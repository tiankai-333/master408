server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Student frontend
    location /student {
        alias /usr/share/nginx/html/student;
        charset utf-8;
        try_files $uri $uri/ /student/index.html;
    }

    # Admin frontend
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # Static images (question figures)
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Root redirect
    location = / {
        return 302 /student/index;
    }
}

server {
    listen 80;
    server_name wx.hhhuu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name wx.hhhuu.com;

    ssl_certificate /etc/nginx/ssl/letsencrypt/live/wx.hhhuu.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/letsencrypt/live/wx.hhhuu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Student frontend
    location /student {
        alias /usr/share/nginx/html/student;
        charset utf-8;
        try_files $uri $uri/ /student/index.html;
    }

    # Admin frontend
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # Static images (question figures)
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Root redirect
    location = / {
        return 302 /student/index;
    }
}
