<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong><br/>平衡二叉树高度为 4（根节点高度为 1），因此左右子树的高度组合为：</p><ul><li>两者均为 3，或</li><li>一个为 3、另一个为 2。</li></ul><p>为最大化节点数之差，应使较高子树取最大节点数，较低子树取最小节点数。</p><ul><li>高度 3 的平衡二叉树最大节点数为 7（满二叉树），</li><li>高度 2 的最小节点数为 2（根节点加一个子节点），<br/>此时节点数之差为
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.7278em;vertical-align:-.0833em"></span><span class="mord">7</span><span class="mspace" style="margin-right:.2222em"></span><span class="mbin">−</span><span class="mspace" style="margin-right:.2222em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">2</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">5</span></span></span></span>
。</li></ul><p>若左右子树高度均为 3，节点数之差最大为
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.7278em;vertical-align:-.0833em"></span><span class="mord">7</span><span class="mspace" style="margin-right:.2222em"></span><span class="mbin">−</span><span class="mspace" style="margin-right:.2222em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">4</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">3</span></span></span></span>
。<br/>因此，根节点的左右子树节点数之差最多为 5。</p>
