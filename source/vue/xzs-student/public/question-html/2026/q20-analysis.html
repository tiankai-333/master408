<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong><br/>在不考虑异常中断处理和访存的额外开销下，单周期数据通路中每条指令在一个时钟周期内完成，因此 CPI 等于 1。</p><p>多周期数据通路中每条指令需要多个时钟周期执行，因此 CPI 大于 1。</p><p>流水线数据通路在理想情况下（无冒险和停顿）可以实现每个时钟周期完成一条指令，因此 CPI 等于 1。</p><p>故 I、II、III 均正确。</p><blockquote><p>注意：II 在理想情况下（完美的 overlap，运行的时间无限长)，CPI 是趋向于 1 的，但是这一题显然不是考察的理想情况，所以 II 是正确的。</p></blockquote>
