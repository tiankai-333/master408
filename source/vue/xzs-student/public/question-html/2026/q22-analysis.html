<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>在中断控制 I/O 方式下，中断响应和处理需要硬件和软件协同工作。</p><ul><li><strong>保存断点</strong>（即程序计数器的值）必须由硬件自动完成。因为中断发生时需立即保存返回地址，以确保后续能正确恢复执行。</li><li><strong>开中断</strong>是通过软件指令实现的，用于允许或禁止中断嵌套。</li><li><strong>中断请求</strong>由硬件设备产生，但响应和处理过程涉及软硬件配合。</li><li><strong>保存通用寄存器</strong>通常由中断服务程序（软件）完成，以保护原程序的上下文。</li></ul><p>因此，只有保存断点必须由硬件完成。</p>
