<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>在 <a href="/operating_system/process/scheduling/#%e4%b8%8a%e4%b8%8b%e6%96%87%e5%88%87%e6%8d%a2">上下文切换</a> 时，操作系统需要保存和恢复与当前进程相关的状态信息。通用寄存器、页表基址寄存器和程序计数器通常会在上下文切换时更新，以切换到新进程的上下文。然而，内核 <a href="/constitution_principle/bus/io/#%e4%b8%ad%e6%96%ad%e5%90%91%e9%87%8f%e8%a1%a8">中断向量表</a> 基址寄存器通常是系统级的，通常不会在每次上下文切换时更改，因此操作系统不需要在上下文切换时更新该寄存器。
