<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><a href="/computer_network/network/dhcp/">DHCP</a> 的 REQUEST 报文：</p><p>目的 IP 地址：DHCP 服务器的 IP 地址或者广播地址（255.255.255.255），因为主机可能不知道 DHCP 服务器的确切 IP 地址，尤其是在初始请求阶段，广播地址确保网络中的所有 DHCP 服务器都能接收到请求。</p><p>源 IP 地址：0.0.0.0，因为主机还未获得正式的 IP 地址，在这个阶段它使用 0.0.0.0 作为源地址来表示“没有 IP 地址”。</p>
