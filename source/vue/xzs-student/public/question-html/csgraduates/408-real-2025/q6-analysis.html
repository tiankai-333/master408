<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>逐个选项来看：</p><ul><li>A. 错误，考虑一个有向图的环，每个顶点的入度都为 1。</li><li>B. 错误，拓扑排序不一定是唯一的，在计算拓扑排序序列的过程中，如果有多个入度为 0 的顶点，则拓扑序列的数量大于 1。</li><li>C. 正确，无环的图至少有一个顶点的度为 1，如果所有顶点的度都大于 1 了，那图中肯定存在环。</li><li>D. 错误，BFS 不能求 带权图 的最短路径，求最短路径是使用 Djkstra 算法。</li></ul>
