<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><ul><li>树高为 3：每个节点内关键字个数最少取 1 时，<a href="/data_structure/search/tree/#b-%e6%a0%91">B 树</a> 高度为 3（类似满二叉树）——仅一种结构；</li><li>树高为 2:<ul><li>根节点关键字个数取 1，第二层两节点关键字个数均取 3——一种结构；</li><li>根节点关键字个数取 2，则第二层内三个节点关键字个数分别可取 221、212、122、311、131、113 共计六种结构；</li><li>根节点关键字个数取 3，则第二层显然只有四个节点各含一个关键字此一种结构。</li></ul></li></ul><p>综上，共计 9 种可能的结构。</p>
