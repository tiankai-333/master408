<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><a href="/operating_system/files/file/#%e6%96%87%e4%bb%b6%e5%88%86%e9%85%8d%e8%a1%a8">文件分配表</a>（FAT）是文件系统用来记录磁盘块（簇）使用情况的数据结构。它记录了哪些磁盘块是空闲的，哪些已经被文件占用，因此文件系统可以通过 FAT 来管理空闲空间。</p><ul><li>A. 目录用于存储文件和子目录的元数据（如文件名、位置等），但不直接管理空闲空间。</li><li>B. <a href="/operating_system/files/file/#%e7%b3%bb%e7%bb%9f%e6%89%93%e5%bc%80%e6%96%87%e4%bb%b6%e8%a1%a8">系统打开文件表</a>：用于记录当前打开的文件及其状态，与空闲空间管理无关。</li><li>D. 文件控制块（FCB）：FCB 记录单个文件的元数据（如大小、位置等），不直接记录整个外存空间使用情况。</li></ul>
