<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>在 <a href="/operating_system/process/scheduling/#%e4%bc%98%e5%85%88%e7%ba%a7%e8%b0%83%e5%ba%a6">优先级调度</a> 中，如果我们采用单链表来保存进程就绪队列，并且高优先级进程在队头，那么：</p><ul><li>插入进程时，需要根据优先级找到合适的位置插入，因此时间复杂度为 O(n)。</li><li>选出进程（即从队头选出最高优先级的进程）是一个 O(1) 的操作，因为高优先级的进程总是在队头。</li></ul>
