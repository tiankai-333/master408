<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>在二叉树的顺序存储表示中，数组中的每个位置对应二叉树中特定节点。若节点值非负（-1 表示不存在），则非 -1 节点的父节点必须存在（根节点除外）。<br/>对于选项 D，索引 8 处的节点值为 19，其父节点索引为 3（由公式
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:1em;vertical-align:-.25em"></span><span class="mopen">⌊(</span><span class="mord">8</span><span class="mspace" style="margin-right:.2222em"></span><span class="mbin">−</span><span class="mspace" style="margin-right:.2222em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-.25em"></span><span class="mord">1</span><span class="mclose">)</span><span class="mord">/2</span><span class="mclose">⌋</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">3</span></span></span></span>
计算），但索引 3 处的值为 -1，即父节点不存在，违反了二叉树顺序存储的规则。因此，选项 D 不能表示一棵二叉树。</p><div class="img-container" style="height:auto;width:auto"><img alt="" draggable="false" src="question-assets/csgraduates/408-real-2025/2025_3_sol-925e69afb2853a27.png" style="width:100%;height:auto"/></div><p>其他选项均满足每个非 -1 节点（除根节点）都有存在的父节点，是有效的二叉树顺序存储表示。</p>
