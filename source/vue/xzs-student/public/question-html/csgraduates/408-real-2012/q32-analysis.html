<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>对于 A，重排 I/O 请求次序也就是进行 <a href="/operating_system/io_device/disks/#%e6%9c%ba%e6%a2%b0%e7%a1%ac%e7%9b%98%e8%b0%83%e5%ba%a6%e7%ae%97%e6%b3%95">I/O 调度</a>，从而使进程之间公平地共享磁盘访问，减少 I/O 完成所需要的平均等待时间。对于 C，缓冲区结合预读和滞后写技术对于具有重复性及阵发性的 I/O 进程改善磁盘 I/O 性能很有帮助。对于 D，优化文件物理块的分布可以减少寻找时间与延迟时间，从而提高磁盘性能。在一个磁盘上设置多个分区与改善设备/O 性能并无多大联系，相反还会带来处理的复杂和降低利用率。
