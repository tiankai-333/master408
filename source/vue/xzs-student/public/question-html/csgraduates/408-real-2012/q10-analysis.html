<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p>本题考察不同 <a href="/data_structure/sort/internal/">内部排序</a> 算法的细节：</p><ul><li>对于 I，简单选择排序每次选择未排序列中的最小元素放入其最终位置。</li><li>对于 II，希尔排序每次是对划分的子表进行排序，得到局部有序的结果，所以不能保证每一趟排序结束都能确定一个元素的最终位置。</li><li>对于 III，快速排序每一趟排序结束后都将枢轴元素放到最终位置。</li><li>对于 IV，堆排序属于选择排序，每次都将大根堆的根结点与表尾结点交换，确定其最终位置。</li><li>对于 V，二路归并排序每趟对子表进行两两归并从而得到若干个局部有序的结果，但无法确定最终位置。</li></ul><p>I、III、IV 正确，本题选择 A。</p>
