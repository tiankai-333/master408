<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>本题关键是对 “在用户态 <strong>发生</strong>”（与上题的 “<strong>执行</strong>” 区分）的理解。</p><p>对于 A，系统调用是操作系统提供给用户程序的接口，系统调用发生在用户态，被调用程序在核心态下执行。</p><p>对于 B，外部中断是用户态到核心态的 “门”，也发生在用户态，在核心态完成中断过程。</p><p>对于 C，进程切换属于系统调用执行过程中的事件，只能发生在核心态。</p><p>对于 D，缺页产生后，在用户态发生缺页中断，然后进入核心态执行缺页中断服务程序。</p>
