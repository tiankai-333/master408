<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/computer_network/application/mail/#smtp">SMTP</a> 采用 “推” 的通信方式，在用户代理向邮件服务器及邮件服务器之间发送邮件时，SMTP 客户主动将邮件“推”送到 SMTP 服务器。而 <a href="/computer_network/application/mail/#pop3">POP3</a> 采用 “拉” 的通信方式，当用户读取邮件时，用户代理向邮件服务器发出请求，“拉”取用户邮箱中的邮件。
