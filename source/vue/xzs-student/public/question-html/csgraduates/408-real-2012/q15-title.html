<p>某计算机存储器按字节编址，采用小端方式存放数据。假定编译器规定 int 型和 short 型长度分别为 32 位和 16 位，并且数据按边界对齐存储。某 C 语言程序段如下：</p>
<div class="highlight"><pre style="background-color:#f8f8f8;-moz-tab-size:4;-o-tab-size:4;tab-size:4" tabindex="0"><code class="language-c" data-lang="c"><span style="display:flex"><span><span style="color:#204a87;font-weight:700">struct</span> <span style="color:#000;font-weight:700">{</span>
</span></span><span style="display:flex"><span>    <span style="color:#204a87;font-weight:700">int</span> <span style="color:#000">a</span><span style="color:#000;font-weight:700">;</span>
</span></span><span style="display:flex"><span>    <span style="color:#204a87;font-weight:700">char</span> <span style="color:#000">b</span><span style="color:#000;font-weight:700">;</span>
</span></span><span style="display:flex"><span>    <span style="color:#204a87;font-weight:700">short</span> <span style="color:#000">c</span><span style="color:#000;font-weight:700">;</span>
</span></span><span style="display:flex"><span><span style="color:#000;font-weight:700">}</span> <span style="color:#000">record</span><span style="color:#000;font-weight:700">;</span>
</span></span><span style="display:flex"><span>
</span></span><span style="display:flex"><span><span style="color:#000">record</span><span style="color:#000;font-weight:700">.</span><span style="color:#000">a</span><span style="color:#ce5c00;font-weight:700">=</span><span style="color:#0000cf;font-weight:700">273</span><span style="color:#000;font-weight:700">;</span>
</span></span></code></pre></div>
<p>若 record 变量的首地址为 0xC008，则地址 0xC008 中内容及 record.c 的地址分别为（ ）。</p>
