<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><a href="/constitution_principle/cpu/controller/#%e5%ad%97%e6%ae%b5%e7%9b%b4%e6%8e%a5%e7%bc%96%e7%a0%81%e6%96%b9%e5%bc%8f">字段直接编码方式</a> 将微命令字段分成若干个小字段，互斥性微命令组合在同一字段中，相容性微命令分在不同字段中，每个字段还要留出一个状态，表示本字段不发出任何微命令。5 个互斥类分别包含 7、3、12、5 和 6 个微命令，需要 3、2、4、3 和 3 位，共 15 位。
