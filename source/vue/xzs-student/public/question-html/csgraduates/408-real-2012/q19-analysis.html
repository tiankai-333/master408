<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>总线频率为 100 MHz，则时钟周期为 10ns。总线位宽与存储字长都是 32 位，故每一个时钟周期可传送一个 32 位存储字。<a href="/constitution_principle/bus/bus/#%e7%aa%81%e5%8f%91%e6%80%bb%e7%ba%bf%e4%bc%a0%e8%be%93%e4%ba%8b%e5%8a%a1">猝发式发送</a> 可以连续传送地址连续的数据，故总的传送时间为：传送地址 10ns，传送 128 位数据 40ns，共需 50ns。
