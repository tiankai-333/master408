<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>对于 I，<a href="/data_structure/graph/operation/#%e6%9c%80%e5%b0%8f%e7%94%9f%e6%88%90%e6%a0%91">最小生成树</a> 的树形可能不唯一（这是因为可能存在权值相同的边），但是代价一定是唯一的，I 正确。对于Ⅱ，如果权值最小的边有多条并且构成环状，则总有权值最小的边将不出现在某棵最小生成树中，Ⅱ错误。对于Ⅲ，设 N 个结点构成环，N-1 条边权值相等，则从不同的顶点开始普里姆算法会得到 N-1 中不同的最小生成树，Ⅱ 错误。对于 V，当最小生成树唯一时（各边的权值不同），Prim 算法和 Kruskal 算法得到的最小生成树相同，IV 错误。
