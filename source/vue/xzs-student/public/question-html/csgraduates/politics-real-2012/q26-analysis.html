<strong>正确答案：<span class="correct-answer-text">BC</span></strong><br/><strong>【解析】</strong><br/>中英《南京条约》签订于1842年，随后美、法两国趁火打劫，迫使清政府签订不平等条约以获取类似特权。其中，美国在1844年逼迫清政府签订《望厦条约》（B选项），法国在同年逼迫清政府签订《黄埔条约》（C选项）。<br/>A选项《虎门条约》是中英在1843年签订的，属于《南京条约》的补充条款，并非美、法逼迫。<br/>D选项《天津条约》是1858年第二次鸦片战争期间签订的，时间远晚于《南京条约》，不符合“趁火打劫”的题意。<br/>因此，正确答案为B和C。
