<strong>正确答案：<span class="correct-answer-text">ABC</span></strong><br/><p><strong>【解析】</strong><br/>洋务运动时期，为培养洋务所需人才，清政府创办了一系列新式学堂，主要包括三类：</p><ol><li><strong>翻译学堂</strong>：如京师同文馆、上海广方言馆等，主要培养外语翻译和外交人才，以解决对外交往中的语言障碍。</li><li><strong>工艺学堂</strong>：如福州船政学堂、上海机器学堂等，侧重培养工程技术、制造和矿业等实用技术人才。</li><li><strong>军事学堂</strong>：如天津水师学堂、天津武备学堂等，旨在培养近代陆海军军事指挥和技术人才。<br/>而<strong>法政学堂</strong>主要出现于清末新政时期（20世纪初），旨在培养法律和政治改革人才，不属于洋务运动时期创办的学堂类型。因此，本题正确答案为 <strong>ABC</strong>。</li></ol>
