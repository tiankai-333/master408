<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>我国实行民族区域自治的历史依据，主要源于中国长期的历史发展特点。在长期的历史进程中，中国逐渐形成了统一的多民族国家格局，各民族在政治、经济、文化等方面交往密切，共同维护了国家的统一。这种“统一的多民族国家的长期存在和发展”为民族区域自治制度提供了重要的历史基础，使这一制度既保障了少数民族的自治权利，又维护了国家的整体统一。<br/>选项A、C、D虽然也是我国民族状况的特点或现实条件，但并非题干所强调的“历史依据”。A项强调发展不平衡，C项描述人口分布特点，D项侧重于近代以来的共同斗争精神，而B项更贴合中国长期历史形成的国家结构特征，因此是正确答案。
