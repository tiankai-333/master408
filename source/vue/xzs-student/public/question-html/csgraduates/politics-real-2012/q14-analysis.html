<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>社会主义道德建设是社会主义精神文明建设的重要组成部分，其核心是为人民服务。这体现了社会主义道德的本质要求，强调一切从人民利益出发，倡导奉献社会、服务人民的价值导向。其他选项虽属于社会主义道德的重要内容，但并非核心：</p><ul><li>A 爱国主义是民族精神的核心，是团结动员全国各族人民的精神旗帜；</li><li>B 集体主义是社会主义道德建设的原则，强调个人利益服从集体利益；</li><li>C 为人民服务是核心，集中体现了社会主义道德的根本宗旨；</li><li>D 社会主义荣辱观是道德建设的基础，明确了社会生活中的基本价值准则。</li></ul><p>因此，本题正确答案为 <strong>C</strong>。</p>
