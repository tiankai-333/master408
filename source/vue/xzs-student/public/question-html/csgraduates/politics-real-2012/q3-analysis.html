<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>在资本主义生产关系下，工人出卖给资本家的不是劳动，而是劳动力。劳动力作为商品，其价值由生产和再生产劳动力所必需的生活资料的价值决定，其价格表现为工资。因此，资本主义工资在本质上是劳动力价值或价格的转化形式，而不是工人全部劳动的报酬。<br/>选项A错误，因为工资不是预付资本的全部，而只是可变资本部分；选项C错误，剩余价值是工人创造的被资本家无偿占有的部分，工资不是剩余价值的一部分；选项D错误，它掩盖了剩余价值的剥削，是资本主义工资的表面现象，而非本质。
