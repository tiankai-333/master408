<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>题干强调个体的人生活动具有双重价值属性：一是满足自我需要（自我价值），二是满足社会需要（社会价值）。个人的需要能否从社会中得到满足以及满足的程度，本质上取决于个人对社会的贡献，即个人通过实践活动为社会创造的物质或精神成果，也就是个人的<strong>社会价值</strong>。社会价值是个体对社会需要的满足程度，它决定了个体从社会获得回报（包括物质和精神上的满足）的基础。其他选项如社会影响、社会地位、社会理想虽然与社会价值有一定关联，但并非直接决定个人需要满足程度的根本因素。因此，正确答案是 <strong>B. 社会价值</strong>。
