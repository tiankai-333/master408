<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong> 该题考查道德与法律的关系。题目要求选择“既是道德规范又是法律原则”的选项。</p><ul><li><strong>A 爱岗敬业</strong>：主要属于职业道德范畴，并非普遍的法律原则。</li><li><strong>B 诚实守信</strong>：既是社会公德和个人品德的基本要求（道德规范），同时在《民法典》等法律中明确规定了诚实信用原则（如《民法典》第7条），属于重要的法律原则。</li><li><strong>C 助人为乐</strong>：属于道德倡导的高尚行为，但法律一般不作强制要求（紧急救助等特殊情况除外）。</li><li><strong>D 勤俭持家</strong>：属于家庭美德，法律未将其作为普遍原则规定。</li></ul><p>因此，符合题意的是 <strong>B 诚实守信</strong>。</p>
