<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>调解分为诉讼外调解和诉讼中调解两类。</p><ul><li><strong>人民调解</strong>（A项）由人民调解委员会主持，属于诉讼外调解。</li><li><strong>行政调解</strong>（B项）由行政机关主持，也属于诉讼外调解。</li><li><strong>仲裁调解</strong>（D项）由仲裁机构在仲裁程序中主持，虽与诉讼程序无关，但属于准司法性质的调解，仍不属于诉讼中调解。</li><li><strong>司法调解</strong>（C项）指在人民法院主持下，在诉讼过程中进行的调解，符合题干中“诉讼中调解”的定义。</li></ul><p>因此，本题正确答案为 <strong>C</strong>。</p>
