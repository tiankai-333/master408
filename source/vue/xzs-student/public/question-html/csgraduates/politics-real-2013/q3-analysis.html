<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>题干出自《资本论》，讨论的是商品（上衣）的自然属性。马克思指出，商品具有使用价值和价值二因素。使用价值是商品能满足人们某种需要的属性，它由具体劳动创造，反映的是商品的自然属性。无论谁穿上衣（裁缝自己穿或顾客穿），上衣都发挥了御寒、遮体等实际效用，即“使用价值”的作用，这与所有者为谁无关。</p><ul><li>A项“抽象劳动的结果”形成价值，而非使用价值；</li><li>B项“价值的作用”涉及交换，题干未体现交换关系；</li><li>D项“社会劳动的结果”强调价值形成的社会性，与使用价值的自然属性不符。<br/>因此，无论谁穿，上衣都发挥着使用价值的作用，正确答案为C。</li></ul>
