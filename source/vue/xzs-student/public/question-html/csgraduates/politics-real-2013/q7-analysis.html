<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>题干中列举的措施（提高个税起征点、提高养老金、提高扶贫标准和低保补助）都属于<strong>再分配</strong>范畴，即政府通过税收、社会保障、转移支付等手段对初次分配后的收入进行调节。这些举措旨在缩小收入差距，促进社会公平，因此体现了<strong>再分配更加注重公平</strong>的原则。<br/>A项“初次分配注重效率”与题意不符，因为所给措施并非初次分配中的市场机制调节；<br/>C项“劳动报酬在初次分配中比重提高”在题干措施中未直接体现；<br/>D项“各种生产要素按贡献参与分配”主要涉及初次分配中的要素分配机制，与再分配调节无关。<br/>故正确答案为B。
