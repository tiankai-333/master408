<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>党的十八大报告明确指出：“在发展平衡性、协调性、可持续性明显增强的基础上，实现国内生产总值和城乡居民人均收入比二〇一〇年翻一番。”因此，除了国内生产总值翻一番的目标外，同时提出翻一番的是<strong>城乡居民人均收入</strong>。<br/>选项B“城乡居民可支配收入”与报告表述不完全一致；选项C“国民收入”和D“财政收入”均未在报告中作为翻一番的目标提出。<br/>故正确答案为 <strong>A</strong>。
