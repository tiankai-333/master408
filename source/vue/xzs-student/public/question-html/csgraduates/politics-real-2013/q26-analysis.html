<strong>正确答案：<span class="correct-answer-text">ABCD</span></strong><br/><p><strong>【解析】</strong><br/>本题以 PM2.5 纳入环境标准及政府工作报告为背景，考查对党的十八大提出的生态文明建设新要求的理解。<br/>2012 年党的十八大报告明确指出，建设生态文明必须做到：</p><ol><li><strong>优化国土空间开发格局</strong>（C 项），这是生态文明建设的基础布局；</li><li><strong>全面促进资源节约</strong>（B 项），这是生态文明建设的重点任务；</li><li><strong>加大自然生态系统和环境保护力度</strong>（A 项），这是生态文明建设的关键举措；</li><li><strong>加强生态文明制度建设</strong>（D 项），这是生态文明建设的制度保障。<br/>这四个方面共同构成了党的十八大对生态文明建设的系统部署，因此 A、B、C、D 均为正确选项。</li></ol>
