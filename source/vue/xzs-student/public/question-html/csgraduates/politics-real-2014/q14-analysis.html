<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong><br/>本题主要考查法律与道德的关系。题干强调《深圳特区救助人权益保护规定》通过立法保护救助人权益，从而鼓励善行、净化社会风气，体现了法律对道德的促进作用。</p><ul><li>A项“法律是道德的归宿”说法不准确，道德与法律各有其范畴，法律并非道德的最终归宿。</li><li>B项“法律是道德的基础”错误，道德往往先于法律产生，并非以法律为基础。</li><li>C项“法律是道德的前提”错误，道德的存在不依赖于法律。</li><li>D项“法律是道德的支撑”正确，法律通过强制力保障道德原则的实施，为道德提供制度支持，从而促进道德正能量的释放。<br/>因此，正确答案为D。</li></ul>
