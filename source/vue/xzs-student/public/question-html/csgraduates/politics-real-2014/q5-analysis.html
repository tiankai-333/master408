<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>党的十四大确立了建立社会主义市场经济体制的目标，初期强调市场在资源配置中起“基础性作用”。随着改革实践深入，2013年党的十八届三中全会通过的《中共中央关于全面深化改革若干重大问题的决定》明确提出：“使市场在资源配置中起决定性作用和更好发挥政府作用。”这标志着党对政府和市场关系的认识达到新的科学高度。因此，本题正确答案是 <strong>B. 决定性作用</strong>。其他选项“辅助性作用”“基础性作用”“补充性作用”均不符合十八届三中全会的新定位。
