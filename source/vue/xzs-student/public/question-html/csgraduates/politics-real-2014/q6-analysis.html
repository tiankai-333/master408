<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>改革开放后，人民代表大会制度不断完善，选举制度逐步规范化、民主化。其中，全国和地方各级人民代表大会代表的选举普遍实行<strong>差额选举</strong>，即候选人名额多于应选名额，以保证选举的竞争性和选民的选择权。这是中国社会主义民主政治建设的重要体现。<br/>选项B“按党派分配名额”和C“按单位分配名额”不符合现行选举制度的基本原则；选项D“等额选举”仅在特定情况下（如法律规定允许的个别情形）出现，不是普遍原则。因此，正确答案是A。
