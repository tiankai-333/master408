<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>社会再生产顺利进行需要实现价值补偿和实物补偿。</p><ul><li><strong>价值补偿</strong>指生产出的商品通过销售转化为货币，补偿生产中预付的价值。</li><li><strong>实物补偿</strong>指用货币购买新的生产资料和劳动力，使生产能在实物形态上继续。<br/>题目中企业因“产品积压”而倒闭，意味着商品卖不出去，无法从商品形态转化为货币形态，即 <strong>价值补偿</strong> 中断。<br/>因此，正确答案是 <strong>B. 价值补偿</strong>。</li></ul>
