<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>爱迪生将每一次实验都视为“整个实践过程中的一部分”，而不是孤立地看成失败。</p><ul><li>A 项（认识中所获得的相对真理）强调的是真理的相对性，但题干并未突出认识的真理性问题。</li><li>B 项正确，因为爱迪生将两千多次实验看作实现发明电灯这一总目标的必要环节，体现了实践过程的整体性。</li><li>C 项（对事物规律的正确反映）不符合题意，实验中显然包含未达到预期结果的探索，并非都是正确反映。</li><li>D 项（实践中可以忽略不计的偶然挫折）与爱迪生的态度相反，他重视每一次实验的价值，并未将其忽略。</li></ul><p>因此，最符合爱迪生原意的选项是 <strong>B</strong>。</p>
