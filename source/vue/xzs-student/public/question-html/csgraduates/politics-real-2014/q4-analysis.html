<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong><br/>当代资本主义的新变化，如产业结构调整、生产社会化程度提高、国家对经济的干预增强、收入分配形式变化等，其根本推动力量在于生产力的发展。科学技术革命作为第一生产力，直接推动了生产方式的变革与社会关系的调整，是资本主义生产关系得以调整和发展的根本动因。选项 A 和 B 虽然也是新变化的原因之一，但属于社会政治层面的推动，不是根本性力量；选项 D 的影响具有外部性，并非当代资本主义变化的内在根本动力。因此，根据马克思主义基本原理，生产力是社会发展的最终决定力量，本题应选择 <strong>C</strong>。
