<strong>正确答案：<span class="correct-answer-text">BC</span></strong><br/><p><strong>【解析】</strong><br/>本题考查对我国社会主义初级阶段基本经济制度的理解。</p><ul><li><strong>A项错误</strong>：社会主义经济特指公有制经济，非公有制经济不属于社会主义经济的组成部分，但它是社会主义市场经济的重要组成部分。因此该项表述不准确。</li><li><strong>B项正确</strong>：公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，共同推动经济社会发展，这是我国基本经济制度的重要内容。</li><li><strong>C项正确</strong>：公有制经济和非公有制经济都是经济社会发展的重要基础，二者相辅相成、共同发展。</li><li><strong>D项错误</strong>：社会主义经济制度的基础是公有制经济，非公有制经济是重要组成部分但不是基础。</li></ul><p>因此，本题正确答案为 <strong>BC</strong>。</p>
