<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong><br/>社会意识的相对独立性表现为多个方面，如与社会存在发展的不完全同步性、历史继承性、内部诸形式的相互作用等，但其中最突出的表现是社会意识对社会存在具有能动的反作用。这是因为：</p><ol><li>社会意识能够指导实践，通过影响人的活动而反作用于社会存在，促进或阻碍社会发展。</li><li>这种反作用体现了社会意识的能动性和相对独立性的最高形式，尤其在历史转折时期，先进的社会意识能成为社会变革的先导。</li><li>其他选项（A、B、C）虽然也是相对独立性的表现，但都属于具体特征，其重要性和突出性不及对社会存在的能动反作用。</li></ol><p>因此，根据马克思主义基本原理，本题正确答案为 <strong>D</strong>。</p>
