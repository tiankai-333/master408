<strong>正确答案：<span class="correct-answer-text">BCD</span></strong><br/><p><strong>【解析】</strong><br/>本题主要考查甲午战争的历史影响。</p><ul><li><strong>A项</strong>：中国海关行政权落入外国人手中始于1858年《通商章程善后条约》设立由外国人管理的总税务司，并非甲午战争的结果，故错误。</li><li><strong>B项</strong>：甲午战争战败后，《马关条约》签订，民族危机空前加深，促进了中华民族的整体觉醒，如公车上书、维新思潮兴起，因此该项正确。</li><li><strong>C项</strong>：根据《马关条约》，清政府割让台湾全岛及附属岛屿给日本，该项正确。</li><li><strong>D项</strong>：甲午战争后，列强看到清朝软弱无力，纷纷在中国强占租借地、划分势力范围，掀起瓜分中国的狂潮，该项正确。</li></ul><p>因此，正确答案为 <strong>B、C、D</strong>。</p>
