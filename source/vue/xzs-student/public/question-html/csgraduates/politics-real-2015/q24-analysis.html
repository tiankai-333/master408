<strong>正确答案：<span class="correct-answer-text">ABD</span></strong><br/><p><strong>【解析】</strong><br/>本题考察基层人大代表比例调整的意义。</p><ul><li><strong>A 项正确</strong>：一线工人、农民等基层代表更贴近群众生活，能更真实反映民生诉求，推动解决群众关心的现实问题。</li><li><strong>B 项正确</strong>：提高基层代表比例能增强基层群众的参政议政热情，体现人民当家作主的制度优势。</li><li><strong>C 项错误</strong>：我国实行间接民主，人民群众通过选举人大代表间接参与国家管理，而非直接参加国家管理。</li><li><strong>D 项正确</strong>：基层代表增多有利于更广泛收集民意，强化人大反映民意和监督政府的职能。</li></ul><p>因此，正确答案为 <strong>ABD</strong>。</p>
