<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>香港特别行政区的高度自治权来源于中央政府的授权，并非其本身固有或完全自治。《中华人民共和国宪法》和《香港特别行政区基本法》明确规定，香港特别行政区是中华人民共和国不可分离的部分，其权力由中央人民政府授予。选项 A 错误，因为“完全自治”不符合“一国两制”中主权属于中央的原则；选项 B 错误，特别行政区没有“剩余权力”，所有权力均由中央授予；选项 C 错误，高度自治权并非香港固有，而是基于中央授权；选项 D 正确，体现了“一国两制”下中央对地方事务管理权的授予关系。
