<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong><br/>本题考察的是中国共产党在初步探索社会主义建设道路时，对工业化道路核心问题的认识。新中国成立初期，受苏联模式影响，工业发展偏重重工业。毛泽东在《论十大关系》等著作中提出要探索适合中国国情的工业化道路，强调必须正确处理重工业、轻工业和农业的关系，不能片面注重重工业而忽视农业和轻工业。这正是当时所讲“工业化道路问题”的主要内涵。</p><p>选项A（经济建设和国防建设的关系）、B（中央和地方的关系）、C（沿海工业和内地工业的关系）均为社会主义建设中的重要关系，但并非当时“工业化道路问题”所指的核心矛盾。因此，正确答案为D。</p>
