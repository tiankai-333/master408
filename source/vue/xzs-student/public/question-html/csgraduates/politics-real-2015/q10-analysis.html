<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>毛泽东的这句话强调辛亥革命虽然推翻了清王朝的君主专制，结束了中国两千多年的封建帝制，但并没有从根本上改变中国半殖民地半封建的社会性质。</p><ul><li>A项错误，辛亥革命确实推翻了帝制，建立了共和政体。</li><li>B项正确，辛亥革命未能完成反帝反封建的根本任务，中国仍然受帝国主义压迫，封建势力也未彻底清除。</li><li>C项错误，孙中山后来继续推动了护法运动等革命活动，但题干重点不在评价孙中山个人。</li><li>D项虽为史实（袁世凯窃取果实），但毛泽东这句话的核心在于指出革命任务未完成，而非仅强调政权被篡夺。<br/>因此，“只把一个皇帝赶跑”实质是指反帝反封建的革命目标未能实现。</li></ul>
