<strong>正确答案：<span class="correct-answer-text">ABD</span></strong><br/><strong>【解析】</strong><br/>本题主要考察对设立中国人民抗日战争胜利纪念日和南京大屠杀死难者国家公祭日目的的理解。<br/>A项正确，设立这两个纪念日有助于向国内外公众传递真实的历史信息，防止历史被歪曲或遗忘。<br/>B项正确，纪念日体现了对抗战先烈和所有为抗战付出牺牲的人们的崇高敬意与深切缅怀。<br/>C项错误，中国是反法西斯东方主战场，但设立纪念日的直接目的并非为了“彰显”战场作用，而是侧重于铭记历史、缅怀先烈、维护和平。<br/>D项正确，设立国家公祭日是对南京大屠杀遇难同胞的沉痛悼念，体现了对生命的尊重和对历史的责任。<br/>因此，正确答案为ABD。
