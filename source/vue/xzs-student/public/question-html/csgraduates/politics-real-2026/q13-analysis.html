<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong><br/>在党的十四大明确提出建立社会主义市场经济体制的目标后，围绕如何建立这一新体制，1993年党的十四届三中全会通过了《关于建立社会主义市场经济体制若干问题的决定》，明确提出以公有制为主体的现代企业制度是社会主义市场经济体制的基础，而<strong>国有企业改革</strong>是建立社会主义市场经济体制的<strong>中心环节</strong>。<br/>国有企业改革旨在通过制度创新，使企业成为自主经营、自负盈亏的市场主体，从而构建起市场经济体制的微观基础。其他选项如价格体制改革、财政制度改革、流通体制改革虽均为社会主义市场经济体制改革的重要内容，但都不属于“中心环节”。因此，正确答案是 <strong>C</strong>。
