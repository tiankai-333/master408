<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong><br/>“阶梯式递进、不断发展进步”强调社会主义现代化进程的辩证特点：</p><ol><li><strong>前进性和曲折性相统一</strong>：发展总体向前，但过程中会有起伏和挑战，符合历史发展规律。</li><li><strong>规律性和能动性相统一</strong>：既要遵循客观规律，又要发挥人的主观能动性，推动发展。</li><li><strong>连续性和非连续性相统一</strong>：“阶梯式”意味着既有持续积累（连续性），又有阶段性突破（非连续性）。</li><li><strong>直线性和循环性相统一</strong>：发展不是简单直线上升，但也不是循环重复，而是螺旋式上升。题目中“直线性和循环性”的表述不符合“阶梯式递进”的螺旋上升特征，因此④不正确。</li></ol><p>综上，①②③正确，对应选项 <strong>A</strong>。</p>
