<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong> 运算器是 CPU 的核心部件之一，主要负责执行算术运算和逻辑运算。其典型组成包括 ALU（算术逻辑单元）、通用寄存器和状态寄存器等。ALU 是运算器的核心，直接处理数据运算；通用寄存器用于临时存储运算数据和中间结果；状态寄存器则记录运算结果的状态标志，如进位、溢出等。这些部件共同协作完成运算任务。</p><p>数据高速缓存属于存储器层次结构，位于 CPU 和主存之间，用于加快数据访问速度，减少 CPU 等待时间。它是存储系统的一部分，并不直接参与运算过程，因此不属于运算器的组成部分。所以，本题中不属于运算器的部件是数据高速缓存。</p>
