<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>首先计算表达式各部分：<code>a + b</code> 的值为 13，经过 <code>(float)</code> 强制转换为 13.0，然后除以 2 得到 6.5。<br/>接着，<code>(int)x</code> 将 4.2 截断为 4，<code>(int)y</code> 将 3.4 截断为 3，<code>4 % 3</code> 的结果为整数 1。<br/>最后执行加法 <code>6.5 + 1</code>，由于 6.5 是浮点类型，整数 1 自动提升为浮点数，得到 7.5。<br/>在 C 语言中，以浮点数格式输出时通常显示为 7.500000，因此选项 A 正确。
