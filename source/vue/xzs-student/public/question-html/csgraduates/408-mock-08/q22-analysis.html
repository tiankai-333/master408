<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong><br/>在中断方式下，CPU 响应中断时，I/O 设备接口控制器会提供一个中断向量表指针，该指针指向中断向量表中对应中断服务程序入口地址的存储位置。本题中，指针为 0800H（与 800H 数值相同，均指地址 0x0800），该地址单元中存储的值为 1200H。由于中断向量表条目通常直接存放中断服务程序的入口地址（在简化模型或特定系统中，可能为物理地址或偏移地址，段地址隐含），因此 1200H 即为该 I/O 设备中断服务程序在主存中的入口地址。选项中，1200H 符合这一结果，故选择 C。
