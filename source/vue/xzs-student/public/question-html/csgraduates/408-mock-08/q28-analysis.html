<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong> 动态分区分配和固定分区分配都属于连续内存分配方式，它们要求程序整体存放在一个连续的内存区域中，因此不支持不连续存放。</p><p>分页式分配将内存划分为固定大小的页框，程序也分成相应的页，这些页可以分散存储在内存的任何可用页框中，无需连续，从而支持不连续存放。段页式分配结合了分段和分页，程序先分段、段内再分页，通过分页机制实现了内存的不连续分配。分段式分配将程序按逻辑划分为多个段，每个段可以独立分配到内存的不同位置，段间可以不连续存放，因此也支持程序的不连续存储。</p><p>综上，支持程序存放在不连续内存中的方法为分页式分配、段页式分配和分段式分配，即 III、IV 和 V。</p>
