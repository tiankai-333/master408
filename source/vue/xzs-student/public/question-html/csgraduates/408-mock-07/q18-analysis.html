<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 控制器是 CPU 的核心部件，负责指令译码、产生控制信号以协调计算机各部件工作。典型控制器包括指令寄存器、程序计数器、时序电路等。<br/>指令寄存器（A）用于存储当前执行的指令，程序计数器（B）存放下一条指令地址，时序电路（D）产生定时信号控制指令执行步骤，三者均属于控制器。<br/>程序状态字寄存器（C）主要存储处理器的状态信息（如进位、零标志等），这些信息反映运算器操作结果，虽可供控制器使用，但其本身属于处理器状态单元或运算器关联部分，不属于控制器。因此，本题选项中不属于控制器的是程序状态字寄存器。
