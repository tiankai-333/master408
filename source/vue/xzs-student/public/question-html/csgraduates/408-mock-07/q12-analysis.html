<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 冯·诺伊曼机采用存储程序结构，指令和数据共享同一个存储器。为了正确执行程序，计算机必须能够区分指令和数据，这一功能主要由控制器实现。控制器负责协调计算机的各部件工作，通过指令周期来管理操作：在取指阶段，控制器从存储器中读取指令，并更新程序计数器；在执行阶段，控制器解码指令，并根据需要访问数据存储器或执行运算。因此，控制器通过不同的时序和控制信号，确保指令被当作命令处理，而数据被当作操作数处理，从而有效区分两者。其他部件如总线只负责传输信息，运算器专注于算术逻辑运算，控制存储器则用于存储微程序，它们均不直接承担区分指令和数据的核心角色。
