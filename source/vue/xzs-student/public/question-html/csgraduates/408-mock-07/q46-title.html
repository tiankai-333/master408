<p>（7 分）设一个没有设置快表的虚拟页式存储系统，页面大小为 100 字节。一个仅有 460 个字节的程序有下述内存访问序列（下标从 0 开始）：<br/>10、11、104、170、73、309、185、245、246、434、458、364。<br/>为该程序分配有 2 个可用页帧（Page frame）。试问：</p>
<p>（1）试叙述缺页中断与一般中断的主要区别？<br/>（2）若分别采用 FIFO 和 LRU 算法，试计算访问过程中发生多少次缺页中断？<br/>（3）若一次访存的时间是 10ms，平均缺页中断处理时间为 25ms，为使该虚拟存储系统的平均有效访问时间不大于 22ms，则可接受的最大缺页中断率是多少？</p>
