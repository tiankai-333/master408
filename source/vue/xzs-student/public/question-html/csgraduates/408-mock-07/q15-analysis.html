<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong> 本题考查 Cache 与主存的映射原理。由于 Cache 被分为 64 块，那么 Cache 有 64 行，采用直接映射，一行相当于一组。故而该标记阵列每行存储 1 个标记项，其中主存标记项为 12bit（
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.8141em"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:.8141em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">12</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">4096</span></span></span></span>
，是 Cache 容量的 4096 倍，那就是地址长度比 Cache 长 12 位），加上 1 位有效位，故而为
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.7278em;vertical-align:-.0833em"></span><span class="mord">64</span><span class="mspace" style="margin-right:.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:.2222em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">13</span></span></span></span>
bit。</p><p>注意：主存—Cache 地址映射表（标记阵列）中内容：映射的 Cache 地址（直接映射不需要因为 Cache 地址唯一，组相联只需要组号）、主存标记（命中判断）、有效位。如下图所示。</p><div class="img-container" style="height:auto;width:60%"><img alt="" draggable="false" src="question-assets/csgraduates/408-mock-07/7_15_sol-2b8f6bd89455a87a.png" style="width:100%;height:auto"/></div>
