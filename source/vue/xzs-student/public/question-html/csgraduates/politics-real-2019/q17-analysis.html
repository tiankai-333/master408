<strong>正确答案：<span class="correct-answer-text">BD</span></strong><br/><p><strong>【解析】</strong><br/>A项错误，虚拟环境本质上是基于计算机硬件、软件和数据的物质性系统生成的，信息本身不能脱离物质载体和意识活动独立存在，因此信息并非独立于物质和意识的“第三种形态”。<br/>B项正确，虚拟现实技术通过数字手段模拟多样化的场景，展现了物质世界表现形式和可能状态的多样性。<br/>C项错误，虚拟环境并未否定物质世界的客观现实性，它本身依赖于客观存在的技术设备与物理规律，是对现实世界的延伸或模拟，不改变物质世界的客观性。<br/>D项正确，虚拟现实技术是人通过实践（技术研发与应用）创造的，这种虚拟环境在自然界原本不存在，体现了人类实践的能动性和创造性。</p><p>因此，本题答案为BD。</p>
