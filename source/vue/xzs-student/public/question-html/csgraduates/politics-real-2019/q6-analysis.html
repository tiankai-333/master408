<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong><br/>总体国家安全观是习近平总书记在2014年首次提出的重大战略思想，其内涵丰富、体系完整。在总体国家安全观中，<strong>人民安全</strong>被明确为宗旨，这体现了以人民为中心的发展思想，强调国家安全一切为了人民、一切依靠人民，保障人民生命财产安全和其他合法权益是国家安全工作的根本出发点和落脚点。其他选项如政治安全是根本，经济安全是基础，军事、文化、社会安全是重要领域，均不属于宗旨范畴。因此，正确答案是C。
