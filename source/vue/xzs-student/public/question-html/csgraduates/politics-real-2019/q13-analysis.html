<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>题目考察的是习近平总书记关于教育根本任务的重要论述。习近平总书记在2018年全国教育大会上明确指出：“培养什么人，是教育的首要问题。我国是中国共产党领导的社会主义国家，这就决定了我们的教育必须把培养社会主义建设者和接班人作为根本任务。”因此，我国教育的根本目标是培养社会主义建设者和接班人。<br/>选项A“推进教育现代化”和D“建设教育强国”是我国教育发展的方向与目标，但不是直接回答“培养什么人”这一根本问题；选项C“全面深化教育体制改革”是教育改革的具体路径，也不是教育的首要问题。<br/>综上，本题正确答案是B。
