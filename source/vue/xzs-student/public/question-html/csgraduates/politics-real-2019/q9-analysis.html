<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>戊戌维新是资产阶级性质的改良运动，主要依据在于其颁布的变法政令（如发展工商业、改革科举、提倡新学等）客观上代表了新兴资产阶级在政治、经济、文化方面的利益与诉求，试图在中国发展资本主义。选项A准确指出了这一本质特征。<br/>B选项错误，因为维新派虽有开设制度局或类似议会的建议，但变法政令中并未真正采纳开设国会的主张；<br/>C选项错误，戊戌维新并未触动封建制度的根本（如土地制度、君主专制等）；<br/>D选项错误，维新运动具有妥协性和不彻底性，并未采取激进手段推翻旧制度。<br/>因此，正确答案为A。
