<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>马克思和恩格斯在革命实践中致力于将科学社会主义与工人运动相结合。1847年，他们应“正义者同盟”领导人的邀请，对其进行改组，并将其更名为“共产主义者同盟”。同年，同盟第二次代表大会通过了马克思和恩格斯参与起草的《共产主义者同盟章程》，标志着世界上第一个以科学社会主义为指导的无产阶级政党的诞生。而“正义者同盟”是改组前的组织，带有空想社会主义色彩；“工人国际”（即第一国际）成立于1864年；“共产国际”成立于1919年，时间均晚于共产主义者同盟。因此，本题正确答案是A。
