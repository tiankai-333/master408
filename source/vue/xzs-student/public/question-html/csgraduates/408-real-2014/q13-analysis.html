<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>8 位 <a href="/constitution_principle/representation/integer/#%e8%a1%a5%e7%a0%81%e8%a1%a8%e7%a4%ba">定点补码</a> 表示的数据范围为 -128~127，若运算结果超出这个范围则会溢出，A 选项 x+y=103-25=78，符合范围，A 排除；B 选项-x+y=-103-25=-128，符合范围，B 排除；D 选项-x-y=-103+25=-78，符合范围，D 排除；C 选项 x-y=103+25=128，超过了 127，选 C.
