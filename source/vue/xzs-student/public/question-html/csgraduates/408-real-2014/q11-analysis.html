<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><a href="/data_structure/sort/internal/#%e5%bf%ab%e9%80%9f%e6%8e%92%e5%ba%8f">快速排序</a> 的阶段性排序结果的特点是，第 i 趟完成时，会有 i 个以上的数出现在它最终将要出现的位置，即它左边的数都比它小，它右边的数都比它大。题目问第二趟 排序的结果，即要找不存在两个这样的数的选项。A 选项中 2、3、6、7、9 均符合，所以 A 排除；B 选项中，2、9 均符合，所以 B 排除；D 选项中 5、9 均符合，所以 D 选项排除；最后看 C 选项，只有 9 一个数符合，所以 C 不可能是快速排序第二趟的结果。
