<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>首先，第二个元素为 1，是整个序列中的最小元素，所以可知该 <a href="/data_structure/sort/internal/#%e5%b8%8c%e5%b0%94%e6%8e%92%e5%ba%8f">希尔排序</a> 为从小到大排序然后考虑增量问题，若增量为 2，第 1+2 个元素 4 明显比第 1 个元素 9 要大，A 排除；若增量为 3，第 i、i+3、i+6 个元素都为有序序列 (i=1,2,3)，符合希尔排序的定义；若增量为 4，第 1 个元素 9 比第 1+4 个元素 7 要大，C 排除；若增量为 5，第 1 个元素 9 比第 1+5 个元素 8 要大，D 排除，选 B。
