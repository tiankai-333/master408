<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/constitution_principle/storage/virtual/#%e5%a4%9a%e7%ba%a7%e9%a1%b5%e8%a1%a8">多级页表</a> 不仅不会加快地址的变换速度，而且会因为增加更多的查表过程，使地址转换速度减慢；也不会减少缺页中断的次数，反而如果访问过程中多级的页表都不在内存中，会大大增加缺页的次数，也并不会减少页表项所占的字节数，而多级页表能够减少页表所占的连续内存空间，即当页表太大时，将页表再分级，可以把每张页表控制在一页之内，减少页表所占的连续内存空间，因此选 D。
