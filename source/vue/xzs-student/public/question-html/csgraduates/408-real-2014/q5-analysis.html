<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>将 <a href="/data_structure/tree/tree/#%e6%a3%ae%e6%9e%97%e8%bd%ac%e4%ba%8c%e5%8f%89%e6%a0%91">森林转化为二叉树</a> 即相当于用孩子兄弟表示法表示森林。在变化过程中，原森林某结点的第一个孩子结点作为它的左子树，它的兄弟作为它的右子树。那么森林中的叶结点由千没有孩子结点，那么转化为二叉树时，该结点就没有左结点，所以 F 中叶结点的个数就等于 T 中左孩子指针为空的结点个数，选 C。此题还可以通过一 些特例来排除 A、B、D 选项。
