<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>主机 00-el-d5-00-23-a1 向 00-el-d5-00-23-c1 发送数据帧时，<a href="/computer_network/datalink/dev/#%e4%ba%a4%e6%8d%a2%e6%9c%ba">交换机</a> 转发表中没有 00-el-d5-00-23-c1 这项，所以向除 1 接口外的所有接口广播这帧，即 2、3 端口会转发这帧，同时因为转发表中并没有 00-e1-d5-00-23-a1 这项，所以转发表会把（目的地址 00-el-d5-00-23-a1，端口 1）这项加入转发表。而当 00-el-d5-00-23-c1 向 00-e1-d5-00-23-a1 发送确认帧时，由于转发表已经有 00-el-d5-00-23-a1 这项，所以交换机只向 1 端口转发，选 B。
