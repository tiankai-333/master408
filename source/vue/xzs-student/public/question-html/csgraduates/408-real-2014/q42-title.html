<p>⑴ 本题中的网络可抽象为数据结构中的哪种结构？</p>
<p>⑵ 针对题 42 表中的内容，设计合理的链式存储结构，以保存题 42 表中的链路状态信息（LSI）。要求给出链式存储结构的数据定义，并画出对应题 42 表的链式存储结构示意图（示意图中仅以 ID 标识结点）。</p>
<p>⑶ 按照迪杰斯特拉（Dijkstra）算法的策略，依次给出 R1 到达题 42 图中子网 192.1.x.x 的最短路径及费用。</p>
