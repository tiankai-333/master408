<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>当接入网络时可能会用到 <a href="/computer_network/datalink/lan/#ppp-%e5%8d%8f%e8%ae%ae">PPP 协议</a>，A 可能用到；当计算机不知道某主机的 MAC 地址时用 IP 地址查询相应的 MAC 地址时会用到 <a href="/computer_network/network/arp/">ARP 协议</a>，B 可能用到；当访问 Web 网站时，若 DNS 缓冲没有存储相应域名的 IP 地址，用域名査询相应的 IP 地址时要使用 <a href="/computer_network/application/dns/">DNS 协议</a>，而 DNS 是基于 UDP 协议的，所以 C 可能用到；<a href="/computer_network/application/mail/#smtp">SMTP</a> 只有使用邮件客户端发送邮件，或是邮件服务器向别的邮件服务器发送邮件时才会用到，单纯的访问 Web 网页不可能用到，选 D。
