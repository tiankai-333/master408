<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><a href="/constitution_principle/storage/virtual/#%e8%99%9a%e6%8b%9f%e5%9c%b0%e5%9d%80%e7%bf%bb%e8%af%91%e8%bf%87%e7%a8%8b">虚实地址转换</a> 是指逻辑地址和物理地址的转换。增大快表容量能把更多的表项装入快表中，会加快虚实地址转换的平均速率；让页表常驻内存可以省去一 些不在内存中的页表从磁盘上调入的过程，也能加快虚实地址转换；增大交换区对虚实地址转换速度无影响，因此 I、II 正确，选 C。
