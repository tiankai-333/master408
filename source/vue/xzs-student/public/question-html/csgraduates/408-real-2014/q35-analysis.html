<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>由 <a href="/computer_network/physical/concept/#%e9%a6%99%e5%86%9c%e5%ae%9a%e7%90%86">香农定理</a> 可知，信噪比和频率带宽都可以限制信道的极限传输速率，所以信噪比和频率带宽对信道的数据传输速率是有影响的，A、B 错误；信道的传输速率实际上就是信号的发送速率，而调制速度也会直接限制数据的传输速率，C 错误；信号的传播速度是信号在信道上传播的速度，与信道的发送速率无关，选 D。
