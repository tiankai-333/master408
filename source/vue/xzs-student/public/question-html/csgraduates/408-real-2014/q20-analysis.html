<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><a href="/constitution_principle/bus/bus/#%e7%aa%81%e5%8f%91%e6%80%bb%e7%ba%bf%e4%bc%a0%e8%be%93%e4%ba%8b%e5%8a%a1">突发传输</a> 是在一个总线周期中，可以传输多个存储地址连续的数据，即一次传输一个地址和一批地址连续的数据，并行传输是在传输中有多个数据位同时在设备之间进行的传输，串行传输是指数据的二进制代码在一条物理信道上以位为单位按时间顺序逐位传输的方式，同步传输是指传输过程由统一的时钟控制，选 C。
