<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 指令格式中，操作码占据位 15 至 10，寻址特征位 X 占据位 9 至 8，位移量 D 占据位 7 至 0。指令 2222H 的二进制表示为 0010 0010 0010 0010。分解后，位 9 至 8 为 10，对应 X=10；位 7 至 0 为 00100010，即 D=22H。根据寻址特征，X=10 表示使用变址寄存器 X2 进行变址寻址，有效地址计算公式为 (X2) + D。已知 (X2)=1122H，D=22H 为 8 位正数，扩展为 16 位后仍为 0022H，因此有效地址为 1122H + 0022H = 1144H。选项 B 符合计算结果。
