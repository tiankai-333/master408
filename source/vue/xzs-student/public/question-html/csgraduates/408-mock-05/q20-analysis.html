<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>数据总线的宽度指的是总线一次能传输的数据位数，这由数据线的数量决定。在总线的各类特性中，功能特性定义了各信号线的具体功能，如地址线、数据线、控制线等。数据总线的宽度直接与数据线的功能相关，因此它由功能特性定义。</p><p>物理特性涉及总线的机械连接方式（如插头、插座），电气特性涉及电压、电流等参数，时间特性则关注信号时序关系。这些特性均不直接决定数据总线的宽度，故其他选项不正确。因此，本题选择 B。</p>
