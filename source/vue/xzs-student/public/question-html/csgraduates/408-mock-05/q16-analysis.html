<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 首先，页面尺寸为 4KB，即 4096 字节。物理地址 32773 可以分解为页框号和页内偏移：页框号 = 32773 ÷ 4096 = 8（因为 4096 × 8 = 32768），页内偏移 = 32773 - 32768 = 5。然后，根据页表内容，页框号 8 对应虚页号 3。因此，逻辑地址由虚页号和页内偏移组成：逻辑地址 = 虚页号 × 页面尺寸 + 页内偏移 = 3 × 4096 + 5 = 12288 + 5 = 12293。故正确答案为 C. 12293。
