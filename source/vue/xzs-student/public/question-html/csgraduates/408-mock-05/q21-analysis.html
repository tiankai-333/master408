<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong> 考查 DMA 方式中的中断与中断传输方式的区别。前者是向 CPU 报告数据传输结束，后者是传送数据，另外 DMA 方式中的中断不包括检查是否出错，而是报告错误。</p><p>注意：DMA 方式与程序中断方式的比较如下。</p><p>① DMA 传送数据的方式是靠硬件传送，而程序传送方式是由程序来传送。</p><p>② 程序中断方式需要中断 CPU 的现行程序，需要保护现场，而 DMA 方式不需要中断现行程序。</p><p>③ 程序中断方式需要在一条指令执行结束才能得到响应，而 DMA 方式则可以在指令周期内的任意存储周期结束时响应。</p><p>④ DMA 方式的优先级高于程序中断方式的优先级。</p>
