<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>在通用计算机指令系统的二地址指令中，操作数的物理位置是指指令能够直接寻址或指定的存储位置。分析各选项：缓冲存储器（如缓存）通常对程序员透明，指令不能直接寻址缓存地址，因此 I 不正确；两个数据寄存器（II）是常见的安排，如寄存器 - 寄存器指令；一个主存单元和一个数据寄存器（III）也常见，如寄存器 - 内存指令；控制存储器用于存储微程序，不是数据操作数的存储位置，因此 IV 不正确；外存单元（如磁盘）需要通过 I/O 机制访问，指令不能直接寻址，因此 V 不正确。综上，只有 II 和 III 是合理的安排，对应选项 B。
