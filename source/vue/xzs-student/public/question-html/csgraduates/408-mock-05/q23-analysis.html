<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong> 微内核结构通过最小化内核功能，仅保留进程调度、内存管理等核心服务，而将文件系统、设备驱动等其他服务置于用户空间。这种设计提升了系统的安全性和可靠性：用户空间服务的故障不易蔓延至内核，从而增强了隔离性（对应选项 C 和 D）。同时，微内核支持模块化扩展，添加新任务时只需在用户空间实现，无需修改内核，提高了灵活性（对应选项 B）。<br/>然而，微内核的劣势在于效率：由于服务分布在用户空间，需要频繁的进程间通信和上下文切换，这引入了额外开销，导致性能通常不如单一内核结构高效。因此，选项 A“使系统更高效”并非微内核的优势，反而是其常见缺点。
