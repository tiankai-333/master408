<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong> 按需调页（Demand-paging）是一种虚拟内存管理策略，它在页面被实际访问时才将其加载到内存中，依赖于程序的局部性原理来减少页面错误和提高性能。适合该环境的程序通常具有良好时间或空间局部性，即访问模式集中或连续。</p><p>堆栈操作集中在栈顶，具有高度局部性；线性搜索顺序访问元素，连续内存访问利于页面重用；矢量运算通常涉及顺序或规律数据访问，也能有效利用页面。这些技术都能较好适应按需调页。</p><p>然而，二分搜索需要在有序数组中反复跳跃访问中间元素，访问模式非连续且不可预测，导致频繁跨页面访问。这种低局部性会引发大量页面错误，显著降低系统效率，因此不适合按需调页环境。</p>
