<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>从历史发展看，资本主义生产资料所有制经历了私人资本所有制、私人股份资本所有制、法人资本所有制等演变阶段。在当代资本主义社会中，随着生产社会化程度不断提高，资本所有制形式进一步社会化，法人资本所有制（即法人持股、机构投资者成为企业主要所有者）逐渐成为占主导地位的所有制形式。它突破了私人股份资本所有制下股权高度分散、个人股东直接控制企业的局限，体现了资本占有、使用和分配的社会化趋势。因此，正确答案为 <strong>B</strong>。
