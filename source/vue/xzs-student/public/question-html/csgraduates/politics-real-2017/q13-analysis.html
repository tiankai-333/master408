<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong></p><ol><li>信念具有层次性，通常高层次的信念（如信仰、核心价值观）对低层次的信念（如具体行为准则、生活态度）具有统领和支配作用，因此 <strong>A 项正确</strong>。</li><li>B 项错误：低层次的信念往往涉及具体观念，不能代表一个人的基本信仰，基本信仰属于高层次信念。</li><li>C 项错误：即使生活在相同社会环境中，由于个体经历、认知差异，人们的信念也不会始终一致。</li><li>D 项错误：信念有科学与非科学之分，例如科学信念基于客观规律，非科学信念可能源于盲目迷信或错误认知。</li></ol><p>综上，正确答案为 <strong>A</strong>。</p>
