<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>第一次世界大战结束后，1919年1月召开的巴黎和会上，中国作为战胜国之一，提出收回德国在山东的特权等合理要求。然而，英、法、美等国操纵会议，竟决定将德国在山东的权益转让给日本。这一消息传回国内，引发了中国人民的极大愤慨，成为五四运动爆发的直接导火索。陈独秀作为当时先进知识分子的代表，最初对威尔逊的“公理”“和平”主张抱有幻想，但巴黎和会外交的失败彻底暴露了帝国主义列强虚伪的本质，使他认识到所谓“公理战胜强权”不过是空话，因此认识发生变化的直接原因是中国在巴黎和会上的外交失败。故正确答案为A。
