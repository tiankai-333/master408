<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>社会主义核心价值观为人生价值的确定和实现提供了方向，而评价人生价值的根本标准需要从社会发展的客观规律角度来把握。在历史唯物主义观点中，判断一个人的人生价值，最根本的是要看其活动是否符合社会历史发展的必然性，是否推动了社会进步，是否顺应了广大人民的根本利益。这本质上是一种 <strong>历史标准</strong>，即以是否符合历史发展趋势、是否促进社会进步作为衡量尺度。其他选项如政治、经济、文化标准，虽然在一定条件下也可作为具体评价依据，但都不是根本尺度。因此，本题正确答案为 <strong>A</strong>。
