<strong>正确答案：<span class="correct-answer-text">BCD</span></strong><br/><p><strong>【解析】</strong><br/>党的基本路线是党和国家的生命线、人民的幸福线，是兴国、立国、强国的重大法宝，也是实现科学发展的政治保证。</p><ul><li><strong>A项错误</strong>：思想路线的核心是实事求是，而非党的基本路线。</li><li><strong>B项正确</strong>：党的基本路线在改革开放实践中被证明是兴国、立国、强国的重大法宝。</li><li><strong>C项正确</strong>：党的基本路线为发展提供了根本政治保证，尤其是推动科学发展。</li><li><strong>D项正确</strong>：党的基本路线关系党和国家前途命运，是生命线，也直接关系到人民福祉，是幸福线。</li></ul><p>因此，本题正确答案为 <strong>BCD</strong>。</p>
