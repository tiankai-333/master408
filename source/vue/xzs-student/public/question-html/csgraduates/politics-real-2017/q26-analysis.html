<strong>正确答案：<span class="correct-answer-text">ABCD</span></strong><br/><strong>【解析】</strong><br/>党的十八届六中全会审议通过的《关于新形势下党内政治生活的若干准则》明确提出，新形势下加强和规范党内政治生活，必须以党章为根本遵循，着力增强党内政治生活的政治性、时代性、原则性、战斗性（对应D项），着力增强党自我净化、自我完善、自我革新、自我提高能力（对应B项），着力提高党的领导水平和执政水平、增强拒腐防变和抵御风险能力（对应C项），着力维护党中央权威、保证党的团结统一、保持党的先进性和纯洁性（对应A项）。这“四个着力”是相互联系、有机统一的整体，共同构成了新形势下加强和规范党内政治生活的主要内容和目标要求。因此，本题正确答案为ABCD。
