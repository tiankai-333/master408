<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>本题考察 <a href="/computer_network/transport/tcp/#%e5%ba%8f%e5%88%97%e5%8f%b7%e5%92%8c%e7%a1%ae%e8%ae%a4%e5%8f%b7">序列号和确认号</a>，确认序号 ack 是期望收到对方下一个报文段的数据的第一个字节的序号，序号 seq 是指本报文段所发送的数据的第一个字节的序号。甲收到 1 个来自乙的 TCP 段，该段的序号 seq=1913、确认序号 ack=2046、有效载荷为 100 字节，表明到序号 1913+100-1=2012 为止的所有数据甲均已收到，而乙期望收到下一个报文段的序号从 2046 开始。故甲发给乙的 TCP 段的序号 seq1=ack=2046 和确认序号 ack1=seq+100=2013。
