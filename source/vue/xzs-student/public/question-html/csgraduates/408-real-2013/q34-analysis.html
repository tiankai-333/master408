<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>需要了解 <a href="/computer_network/datalink/lan/#%e4%bc%a0%e8%be%93%e4%bb%8b%e8%b4%a8">传输介质</a> 的命名规则：10BaseT 即 10Mbps 的以太网，采用 <a href="/computer_network/physical/encoding/#%e7%bc%96%e7%a0%81%e7%b1%bb%e5%9e%8b">曼彻斯特编码</a>，将一个码元分成两个相等的间隔，前一个间隔为低电平后一个间隔为高电平表示码元 1；码元 0 正好相反，也可以采用相反的规定。故对应比特串可以是 0011 0110 或 1100 1001。
