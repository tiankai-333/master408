<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>选项 A、C 和 D 都是 <a href="/computer_network/datalink/mac/#%e4%bf%a1%e9%81%93%e5%88%92%e5%88%86%e4%bb%8b%e8%b4%a8%e8%ae%bf%e9%97%ae%e6%8e%a7%e5%88%b6">信道划分协议</a>，信道划分协议是静态划分信道的方法，肯定不会发生冲突。CSMA 全称是载波侦听多路访问协议，其原理是站点在发送数据前先侦听信道，发现信道空闲后再发送，但在发送过程中有可能会发生冲突。
