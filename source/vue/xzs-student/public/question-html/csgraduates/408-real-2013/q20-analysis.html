<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>本题考察 <a href="/constitution_principle/storage/storage/#raid">RAID</a>，RAID0 方案是无几余和无校验的磁盘阵列，而 RAID1~5 方案均是加入了冗余（镜像）或校验的磁盘阵列。条带化技术就是一种自动地将 IO 的负载均衡到多个物理磁盘上的技术，条带化技术就是将一块连续的数据分成很多小部分并把它们分别存储到不同磁盘上去。这就能使多个进程同时访问数据的多个不同部分但不会造成磁盘冲突，而且在需要对这种数据进行顺序访问的时候可以获得最大程度上的 I/0 并行能力，从而获得非常好的性能。故能够提高 RAID 可靠性的措施主要是对磁盘进行镜像处理和奇偶校验，其余选项不符合条件。
