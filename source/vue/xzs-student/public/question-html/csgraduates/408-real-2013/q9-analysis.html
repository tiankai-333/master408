<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>找出 AOE 网的全部 <a href="/data_structure/graph/operation/#%e5%85%b3%e9%94%ae%e8%b7%af%e5%be%84">关键路径</a> 为 (b,d,c,g)、(b,d,e,h) 和 (b,f,h)。根据定义，只有关键路径上的活动时间同时减少时，才能缩短工期，即正确选项中的两条路径必须涵盖在所有关键路径之中。利用关键路径算法可求出图中的关键路径共有三条：(b,d,cg)、(b,d,e,h) 和 (b,f,h)。由此可知，选项 A 和 B 中并不能包含 (b,f,h) 这条路径，选项 C 中，并不能包含 (b,d,c,g) 和 (b,d,e,h) 这两条路径，只有 C 包含了所有的关键路径，因此只有加快 f 和 d 的进度才能缩短工期。
