<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 第17题所在的句子讨论的是依赖AI技术进行社会比较可能带来的危害。选项C“relying”与介词“on”构成固定搭配“rely on”，意为“依赖、依靠”，符合上下文语义，即“依赖这种技术进行社会比较”会导致身体形象问题等负面后果。其他选项均不贴合：A“starting”与“on”搭配时通常表示“开始做某事”，但在此处逻辑不通；B“checking”与“on”搭配多指“检查、核实”，与“社会比较”的语境不符；D“working”与“on”搭配常表示“致力于、从事”，不能准确表达“依赖技术”的含义。因此，C为正确答案。
