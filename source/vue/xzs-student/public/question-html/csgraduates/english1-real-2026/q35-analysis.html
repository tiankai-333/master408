<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong> 最后一段中，作者通过对比广播时代偶然性带来的丰富体验与现代技术无限选择导致的局限，指出无线广播的随意启蒙性正逐渐消失，而智能手机和播客等创新虽提供自由选择，却可能使人陷入狭隘兴趣和相似信念的窠臼。作者并未直接呼吁技术应以人类福祉为目标（A），也未明确主张复兴聆听艺术（B），更未特指青少年或社交媒体习惯（C），而是反思技术创新的双重影响，强调人们应对创新持明智态度，平衡其便利与潜在弊端。因此，选项D最契合作者的意图。
