<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 第一段明确指出，研究人员通过基因组分析将驴的驯化追溯至大约7000年前东非的一个单一事件，并强调这一时间比人类驯化马早了约3000年。因此，选项C“they were tamed at an earlier time than horses”（它们比马更早被驯化）与原文信息一致。选项A错误，因为原文说驴与人类首次交织的时机和地点一直是个谜，但并未提及对人类祖先显得神秘；选项B错误，因为原文强调驯化是“a single event”（单一事件），而非多次；选项D错误，因为第一段未提及古代旅行者对驴的生动描绘。
