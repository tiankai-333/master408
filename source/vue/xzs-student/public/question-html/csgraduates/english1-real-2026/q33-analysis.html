<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 第四段主要描述了无线电广播在前数字时代为听众带来的意外收获和偶然发现。文中提到，线性语音广播带来了“serendipity”（意外之喜），例如让听众在无意中接触到冰球等原本不感兴趣的内容，或在一次驾驶中意外学到新闻、历史等知识。这些例子均体现了听众可能获得意想不到的收益，与选项C“radio listeners could make unexpected gains”相符。其他选项在第四段中未得到体现：A项未提及研究不足；B项强调数字时代的魅力，但第四段聚焦前数字时代，且第五段指出这种魅力正在消退；D项未讨论节目变化。
