<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 第15题所在的句子进一步阐述了AI工具可能导致的负面后果，即AI驱动的美颜滤镜和编辑工具可能导致扭曲的自我认知和身体不满。前文已经提到AI带来伦理风险和加深社会 beauty 标准，此处是补充另一个相关点，因此需要表示添加信息的过渡词。“Additionally"意为“此外”，符合语境。其他选项中，“Approximately"表示估计，与语境不符；“Alternatively"表示替代选项，但这里不是提供选择；“Accidentally"表示偶然，而这些问题是有意或潜在的后果，并非偶然。
