<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>在 <a href="/constitution_principle/instruction/format/#%e5%8f%98%e5%9d%80%e5%af%bb%e5%9d%80">变址寻址</a> 时，将计算机指令中的地址与变址寄存器中的地址相加，得到有效地址，指令提供数组首地址，由变址寄存器来定位数据中的各元素。所以它最适合按下标顺序访问一维数组元素，故选 D。</p><p>相对寻址以 PC 为基地址，以指令中的地址为偏移量确定有效地址。寄存器寻址则是在指令中指出需要使用的寄存器。直接寻址是在指令的地址字段直接指出操作数的有效地址。</p>
