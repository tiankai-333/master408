<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><a href="/constitution_principle/storage/cache/#%e6%97%b6%e9%97%b4%e5%b1%80%e9%83%a8%e6%80%a7">时间局部性</a> 是一旦一条指令被执行，则在不久的将来它可能再次被执行。<a href="/constitution_principle/storage/cache/#%e7%a9%ba%e9%97%b4%e5%b1%80%e9%83%a8%e6%80%a7">空间局部性</a> 是一旦一个存储单元被访问，那么它附近的存储单元也很快被访问。显然，这里的循环指令本身具有时间局部性，它对数组 a 的访问具有空间局部性，故选 A。
