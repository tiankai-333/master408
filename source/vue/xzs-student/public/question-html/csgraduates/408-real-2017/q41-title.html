<p>输出的中缀表达式分别为 <code>(a+b)*(c*(</code>−<code>d))</code> 和 <code>(a*b)+(</code>−<code>(c</code>−<code>d))</code> 。</p>

<p>要求：</p>
<p>(1) 给出算法的基本设计思想。</p>
<p>(2) 根据设计思想，采用 C 或 C++ 语言描述算法，关键之处给出注释。</p>
