<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><a href="/constitution_principle/cpu/pipeline/#%e4%ba%94%e9%98%b6%e6%ae%b5%e6%b5%81%e6%b0%b4%e7%ba%bf">五阶段流水线</a> 可分为取指（IF）、译码／取数（ID）、执行（EXC）、存储器读（MEM）、写回（Write Back）。数字系统中，各个子系统通过数据总线连接形成的数据传送路径称为 <a href="/constitution_principle/cpu/structure/#%e6%95%b0%e6%8d%ae%e9%80%9a%e8%b7%af">数据通路</a>，包括程序计数器、算术逻辑运算部件、通用寄存器组、取指部件等，不包括控制部件，故选 A。
