<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>一个新的磁盘是一个空白盘，必须分成扇区以便磁盘控制器能读和写，这个过程称为 <a href="/operating_system/io_device/disks/#%e7%89%a9%e7%90%86%e6%a0%bc%e5%bc%8f%e5%8c%96">物理格式化</a>。低级格式化为磁盘的每个扇区采用特别的数据结构，包括校验码，III 错误。为了使用磁盘存储文件，操作系统还需要将其数据结构记录在磁盘上。这分为两步。第一步是将磁盘分为由一个或多个柱面组成的分区，每个分区可以作为一个独立的磁盘，I 错误。在分区之后，第二步是 <a href="/operating_system/io_device/disks/#%e9%80%bb%e8%be%91%e6%a0%bc%e5%bc%8f%e5%8c%96">逻辑格式化</a>（创建文件系统）。在这一步，操作系统将初始的文件系统数据结构存储到磁盘上。这些数据结构包括空闲和已分配的空间和一个初始 为空的目录，II、IV 正确。所以选 B。
