<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/constitution_principle/bus/bus/#%e6%80%bb%e7%ba%bf%e6%9e%b6%e6%9e%84%e6%96%b9%e5%bc%8f">多总线结构</a> 用速率高的总线连接高速设备用速率低的总线连接低速设备。一般来说，CPU 是计算机的核心，是计算机中速度最快的设备之一，所以 A 正确。突发传送方式把多个数据单元作为一个独立传输处理，从而最大化设备的吞吐量。现实中一般用支待突发传送方式的总线提高存储器的读写效率，B 正确。各总线通过桥接器相连，后者起流量交换作用。PCI-Express 总线都采用 <a href="/constitution_principle/bus/bus/#%e6%95%b0%e6%8d%ae%e4%bc%a0%e9%80%81%e6%96%b9%e5%bc%8f">串行</a> 数据包传输数据，所以选 D。
