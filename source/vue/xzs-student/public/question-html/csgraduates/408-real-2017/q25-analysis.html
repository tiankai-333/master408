<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>参考 <a href="/operating_system/memory/concepts/#%e5%8a%a8%e6%80%81%e5%86%85%e5%ad%98%e5%86%85%e5%ad%98%e5%9b%9e%e6%94%b6%e8%bf%87%e7%a8%8b">动态内存内存回收过程</a>，回收起始地址为 60K、大小为 140KB 的分区时，它与表中第一个分区和第四个分区合并，成为起始地址为 20K、大小为 380KB 的分区，剩余 3 个空闲分区。在回收内存后，算法会对空闲分区链按分区大小由小到大进行排序，表中的第二个分区排第一。所以选择 B。
