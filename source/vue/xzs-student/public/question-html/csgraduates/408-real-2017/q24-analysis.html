<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>执行 <a href="/operating_system/concepts/environment/#%e7%b3%bb%e7%bb%9f%e8%b0%83%e7%94%a8">系统调用</a> 的过程是这样的：正在运行的进程先传递系统调用参数，然后由 <a href="/constitution_principle/instruction/instruction_ops/#%e9%99%b7%e9%98%b1%e6%8c%87%e4%bb%a4">陷入指令</a> 负责将用户态转化为内核态，并将返回地址压入堆栈以备后用，接下来 CPU 执行相应的内核态服务程序，最后返回用户态。所以 C 正确。
