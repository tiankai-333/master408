<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>解析：</strong><br/>第 1 题空格处连接的是两个句子：</p><ul><li>第一句说“经常称体重是了解体重显著变化的好方法”。</li><li>第二句说“如果太频繁，这种习惯可能弊大于利”。</li></ul><p>两句之间是<strong>转折关系</strong>，因为第一句讲好处，第二句讲坏处。</p><p>选项分析：</p><ul><li><strong>A. Besides</strong> 表示递进，不符合逻辑。</li><li><strong>B. Therefore</strong> 表示因果，不符合。</li><li><strong>C. Otherwise</strong> 表示“否则”，用于假设后果，不符合。</li><li><strong>D. However</strong> 表示转折，正确。</li></ul><p>因此正确答案是 <strong>D. However</strong>。</p>
