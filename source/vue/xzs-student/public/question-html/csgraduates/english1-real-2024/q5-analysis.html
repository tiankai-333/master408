<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>解析：</strong><br/>本句意为：“它们 <strong>起初</strong> 作为一种新奇的功能出现，但随着使用增加，它们的好处在我们技术先进的世界中扩展了。”</p><ul><li><strong>A. held on</strong>（坚持）→ 不符合“起初作为新奇功能”的语境。</li><li><strong>B. started out</strong>（起初是，开始时是）→ 符合语境，表示最初的状态。</li><li><strong>C. settled down</strong>（安定下来）→ 不适用于描述产品的初期角色。</li><li><strong>D. went by</strong>（时间流逝）→ 主语一般是时间，不适用于此。</li></ul><p>因此，<strong>B. started out</strong> 正确。</p>
