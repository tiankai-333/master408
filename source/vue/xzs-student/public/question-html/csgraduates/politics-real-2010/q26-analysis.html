<strong>正确答案：<span class="correct-answer-text">AB</span></strong><br/><p><strong>【解析】</strong><br/>洋务运动在19世纪下半叶以“自强”“求富”为目标，但其指导思想具有封建性（选项A），即坚持“中体西用”，试图在维护封建制度的前提下引进西方技术，导致改革不彻底；同时，洋务运动对外具有依赖性（选项B），在技术、设备、管理等方面依赖外国，甚至受到列强控制，难以实现真正的独立自强。</p><p>选项C“民主阶级的荒谬性”和选项D“民族资产阶级的腐朽性”不符合史实：洋务运动时期民族资产阶级尚未成熟，也未形成民主阶级；且洋务运动失败主要源于封建体制和外部依赖，而非民族资产阶级的腐朽。因此，本题正确答案为A和B。</p>
