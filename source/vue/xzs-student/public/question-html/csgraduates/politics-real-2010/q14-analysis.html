<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong><br/>我国宪法规定的依法治国基本方略，其核心要义在于确保法律在治理国家和社会中的权威地位。选项A“有法可依、有法必依、执法必严、违法必究”是依法治国的十六字方针，明确了法治建设的关键环节，涵盖了立法、执法、司法和守法全过程，集中体现了依法治国的根本要求。<br/>其他选项中：</p><ul><li>B项强调公民权利保障，是法治建设的重要目标之一，但并非根本要求；</li><li>C项涉及公开原则，是促进司法公正和执法透明的重要措施，属于依法治国的具体实践；</li><li>D项描述的是法治社会的特征，但未直接点明依法治国的核心要义。<br/>因此，本题正确答案为A。</li></ul>
