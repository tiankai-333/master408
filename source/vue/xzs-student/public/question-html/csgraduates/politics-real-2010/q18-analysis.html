<strong>正确答案：<span class="correct-answer-text">CD</span></strong><br/><p><strong>【解析】</strong><br/>A项错误，科技革命有助于应对危机，但“根本出路”的表述过于绝对。摆脱社会危机的根本出路在于解决社会基本矛盾，而非单纯依靠科技革命。<br/>B项错误，社会形态更替的根本标志是生产关系的变革，尤其是生产资料所有制的变化，科学技术是推动社会变革的重要力量，但不是根本标志。<br/>C项正确，历史经验表明，经济危机带来的社会生产需求推动了科技突破，说明社会实践的需要是科技发展的强大动力。<br/>D项正确，电气革命和电子革命都显著推动了社会生产力的飞跃，促进了经济结构的转型升级，体现了科技创新对社会经济跨越式发展的推动作用。</p><p>因此，本题正确答案为CD。</p>
