<strong>正确答案：<span class="correct-answer-text">BD</span></strong><br/><p><strong>【解析】</strong><br/>政治权利与自由是指公民依法参与国家政治生活的权利和表达政治意愿的自由。</p><ul><li><strong>A项错误</strong>：人身自由属于公民的人身权利，而非直接的政治权利与自由。</li><li><strong>B项正确</strong>：言论、出版、集会、结社、游行、示威的自由属于政治自由范畴；选举权和被选举权是公民参与国家管理的基本政治权利。</li><li><strong>C项错误</strong>：宗教自由属于宗教信仰自由，是公民的基本权利，但不直接归类为政治权利与自由。</li><li><strong>D项正确</strong>：政治自由（如言论、出版、集会等自由）是政治权利与自由的重要组成部分。</li></ul><p>因此，本题正确答案为 <strong>BD</strong>。</p>
