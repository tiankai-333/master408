<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>“坚持就是胜利”强调通过持续不断的努力（量变积累），最终实现胜利（质变）。溪水战胜岩石并非依靠瞬间的强大力量，而是依靠持久冲刷，这体现了量变达到一定程度必然引起质变的辩证法原理。</p><ul><li>A 项（必然性通过偶然性开辟道路）强调必然性与偶然性的关系，与题意不符。</li><li>B 项（肯定中包含着否定的因素）揭示事物内部矛盾，未突出持续积累的过程。</li><li>D 项（有其因必有其果）属于因果联系，但未体现量变到质变的关键环节。<br/>因此，C 项最准确契合题干哲理。</li></ul>
