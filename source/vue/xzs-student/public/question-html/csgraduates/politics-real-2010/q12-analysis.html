<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>夸父追日、大禹治水、愚公移山、精卫填海等神话传说，共同展现了中华民族在面对艰难险阻时，不屈不挠、顽强奋斗、持之以恒的精神品质。这些故事强调通过自身不懈的努力和坚定的意志去克服困难、改造自然，正体现了“自强不息”的精神内涵。</p><ul><li><strong>A 勤劳勇敢</strong>：虽涉及劳动与勇气，但更突出长期坚持、不畏艰难的奋斗过程，与“自强不息”核心更为契合。</li><li><strong>B 团结统一</strong>：这些故事主要表现个体或群体的奋斗，未强调民族内部的团结或统一主题。</li><li><strong>D 爱好和平</strong>：故事内容与和平主题无直接关联。<br/>因此，本题正确答案为 <strong>C. 自强不息</strong>。</li></ul>
