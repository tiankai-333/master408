<strong>正确答案：<span class="correct-answer-text">BCD</span></strong><br/><p><strong>【解析】</strong><br/>我国在社会主义时期处理民族问题的基本原则主要包括：</p><ol><li><strong>维护祖国统一</strong>（B项）：这是处理民族问题的前提和基础，任何民族问题都应在国家统一框架下解决。</li><li><strong>反对民族分裂</strong>（C项）：坚决抵制任何形式的民族分裂活动，维护国家主权和领土完整。</li><li><strong>坚持民族平等、民族团结、多民族共同繁荣</strong>（D项）：这是处理民族问题的核心原则，体现了社会主义民族关系的本质要求。</li></ol><p>A项“实行民族区域自治”是我国解决民族问题的基本政策，而非基本原则，因此不选。</p><p>综上，本题正确答案为 <strong>BCD</strong>。</p>
