<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>爱因斯坦的话强调品格（即品德、德行）比才智更重要，是成就科学家的关键。</p><ul><li>A项“道虽迩，不行不至；事虽小，不为不成”强调实践和行动的重要性，与品格和才智的关系无关。</li><li>B项“才者，德之资也；德者，才之帅也”意为才能是德行的辅助，德行是才能的统帅，直接论述了德与才的主次关系，与爱因斯坦的观点一致。</li><li>C项“不学礼，无以立”强调礼仪对个人立身的重要性，未涉及才与德的关系。</li><li>D项“是非之心，智也”强调辨别是非是智慧的表现，侧重于“智”而非德才关系。<br/>因此，只有B项准确体现了“品格统帅才智”的内涵，与题干含义一致。</li></ul>
