<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><a href="/data_structure/sort/internal/#%e5%bf%ab%e9%80%9f%e6%8e%92%e5%ba%8f">快速排序</a> 的递归次数与元素的初始排列有关。若每次划分后分区比较平衡，则递归次数少；若划分后分区不平衡，则递归次数多。但快速排序的递归次数与分区处理顺序无关，即先处理较长的分区或先处理较短的分区都不影响递归次数。</p><p>此外，可以形象地把快速排序的递归调用过程用一个二叉树描述，先处理较长或较短分区，可以想象为交换某一递归结点处的左右子树，这并 不会影响树中的分支数。</p>
