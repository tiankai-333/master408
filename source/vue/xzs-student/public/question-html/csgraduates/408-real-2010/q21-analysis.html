<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p>在 <a href="/constitution_principle/bus/io/#%e5%8d%95%e7%ba%a7%e4%b8%ad%e6%96%ad">单级中断系统</a> 中，不允许中断嵌套。中断处理过程为：①关中断；②保存断点；③识别中断源；④保存现场；⑤中断事件处理；⑥恢复现场；⑦开中断；⑧中断返回。其中，①<del>③由硬件完成，④</del>⑧由中断服务程序完成，故选 A。</p><p>【排除法】选项 B、C、D 的第一个任务（保存断点或关中断）都是由中断隐指令完成的，即由硬件直接执行，与中断服务程序无关。</p>
