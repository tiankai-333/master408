<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p>采用流水线方式，相邻或相近的两条指令可能会因为存在某种关联，后一条指令不能按照原指定的时钟周期运行，从而使流水线断流。有三种 <a href="/constitution_principle/cpu/pipeline/#%e6%b5%81%e6%b0%b4%e7%ba%bf%e7%9a%84%e5%86%92%e9%99%a9%e5%92%8c%e5%a4%84%e7%90%86">相关</a> 可能引起指令流水线阻塞：①结构相关，又称资源相关；②数据相关；③控制相关，主要由转移指令引起。</p><p>数据 <a href="/constitution_principle/cpu/pipeline/#%e6%97%81%e8%b7%af%e8%bd%ac%e5%8f%91">旁路转发</a>，其主要思想是不必待某条指令的执行结果送回到寄存器，再从寄存器中取出该结果，作为下一条指令的源操作数，而是直接将执行结果送到其他指令所需要的地方，这样可以使流水线不发生停顿。</p>
