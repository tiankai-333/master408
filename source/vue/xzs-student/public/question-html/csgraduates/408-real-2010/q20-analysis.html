<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/constitution_principle/bus/bus/#%e5%b8%b8%e8%a7%81%e6%80%bb%e7%ba%bf%e6%a0%87%e5%87%86">常见总线标准</a> 有：ISA、EISA、VESA、PCI、PCI-Express、AGP、USB、RS-232C 等。A 中的 CRT 是纯平显示器；B 中的 CPI 是每条指令的时钟周期数；C 中的 RAM 是半导体随机存储器、MIPS 是每秒执行多少百万条指令数。
