<p>假定变量 <code>i</code>、<code>f</code> 和 <code>d</code> 的数据类型分别为 <code>int</code>，<code>float</code> 和 <code>double</code>（<code>int</code> 用补码表示，<code>float</code> 和 <code>double</code> 分别用 <code>IEEE754</code> 单精度和双精度浮点数格式表示），已 <code>i=785</code>，<code>f=1.5678e3</code>，<code>d=1.5e100</code>。若在 32 位机器中执行下列关系表达式，则结果为 “真” 的是（）。</p>
<p>I. <code>i == (int)(float)i</code>     II. <code>f == (float)(int)f</code></p>
<p>III. <code>f == (float)(double)f</code>    IV. <code>(d+f)-d == f</code></p>
