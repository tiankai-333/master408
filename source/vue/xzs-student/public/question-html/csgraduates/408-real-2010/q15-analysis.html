<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>本题考查 <a href="/constitution_principle/storage/memory/#%e4%b8%bb%e5%ad%98%e5%ae%b9%e9%87%8f%e7%9a%84%e6%89%a9%e5%b1%95">主存容量的扩展</a>，用 2Kx4 位的芯片组成一个 8Kx8 位存储器，共需 8 片 2Kx4 位的芯片，分为 4 组，每组由 2 片 2Kx4 位的芯片并联组成 2Kx8 位的芯片，各组芯片的地址分配如下：</p><ul><li>第一组（2 个芯片并联）：0000H ~ 07FFH</li><li>第二组（2 个芯片并联）：0800H ~ 0FFFH</li><li>第三组（2 个芯片并联）：1000H ~ 17FFH</li><li>第四组（2 个芯片并联）：1800H ~ 1FFFH</li></ul><p>地址 OBIFH 所在的芯片属于第二组，故其所在 芯片的最小地址为 0800H。</p>
