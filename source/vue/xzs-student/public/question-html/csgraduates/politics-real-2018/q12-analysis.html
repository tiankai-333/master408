<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>20 世纪 40 年代前期，中国共产党开展的整风运动是延安整风运动（1941—1945年）。其核心内容是反对主观主义以整顿学风、反对宗派主义以整顿党风、反对党八股以整顿文风。其中，<strong>反对主观主义以整顿学风</strong>是整风运动最主要的任务，因为主观主义是党内错误思想的主要根源，危害最大。<br/>题干中强调“提高广大党员的思想建设水平”，直接对应的是思想层面的问题，即学风问题，因此正确答案是 <strong>D 反对主观主义以整顿学风</strong>。<br/>选项 A 中的“反对享乐主义”并非延安整风运动的主要内容；选项 B 和 C 虽是整风内容，但并非题干所强调的“思想建设水平”的直接对应项。
