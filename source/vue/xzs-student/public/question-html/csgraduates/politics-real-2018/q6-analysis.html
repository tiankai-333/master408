<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>我国在长期探索中形成了选举民主与协商民主相结合的社会主义民主政治体系。其中，<strong>协商民主</strong>作为中国特有的民主形式，强调在重大决策前和决策过程中进行广泛协商，保证人民在日常政治生活中持续参与，体现了“有事好商量，众人的事情由众人商量”的民主真谛。其他选项如竞争性民主、票决民主、谈判民主虽在民主政治中有一定体现，但并非我国强调的“特有民主形式”。因此，本题正确答案为 <strong>B. 协商民主</strong>。
