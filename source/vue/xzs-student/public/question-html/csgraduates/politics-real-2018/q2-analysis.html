<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>“白马非马”是名家公孙龙提出的著名命题，其推理逻辑是：马是形体的概念，白是颜色的概念；白马是“形+色”的概念，因此白马不是马。从唯物辩证法角度看，这一命题的错误在于将“白马”（个性/特殊）与“马”（共性/一般）绝对对立起来，忽视了共性寓于个性之中，个性包含着共性。马的共性（如马的本质属性）通过具体的白马、黑马等个性表现出来，二者是辩证统一的。命题割裂了这种共性与个性的联系，因此错误。</p><p>A项“形态和功能”、C项“内容和形式”、D项“本质和现象”均与题干中“形”“色”与一般概念的关系不直接对应，故不选。</p>
