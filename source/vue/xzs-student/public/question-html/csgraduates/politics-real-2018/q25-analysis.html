<strong>正确答案：<span class="correct-answer-text">ACD</span></strong><br/><p><strong>【解析】</strong><br/>本题主要考查对党的政治建设重要性的理解。</p><ul><li><strong>A项正确</strong>：我们党是马克思主义政党，讲政治是内在要求和根本特征，必须旗帜鲜明坚持正确的政治方向、立场和原则。</li><li><strong>B项错误</strong>：党的根本宗旨是全心全意为人民服务，而非“坚定政治立场”，该项表述混淆了党的根本宗旨与政治建设的要求。</li><li><strong>C项正确</strong>：党的政治建设是根本性建设，贯穿于其他各项建设之中，直接决定党的建设方向和最终效果。</li><li><strong>D项正确</strong>：政党本质上是具有鲜明政治属性的政治组织，政治属性是其首要属性，加强政治建设是保持政党本色的必然要求。</li></ul><p>综上，正确答案为 <strong>ACD</strong>。</p>
