<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>“坚持以人民为中心”强调人民群众在历史发展和社会进步中的决定性作用，集中体现了唯物史观关于<strong>人民群众是历史的创造者</strong>的基本原理。唯物史观认为，人民群众是社会物质财富和精神财富的创造者，是社会变革的决定力量，因此必须尊重人民主体地位、依靠人民推动发展。选项A、B、C虽然都属于唯物史观的内容，但A项侧重人的总体性历史过程，B项是对人的本质的界定，C项强调人民群众活动的条件性，均未直接对应“以人民为中心”的核心内涵。只有D项准确反映了“以人民为中心”的理论基石。
