<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>解析：</strong></p><p>第 8 题考查动词短语 <strong>come down with</strong> 的固定搭配。</p><ul><li><strong>come down with</strong> 意为“患上（疾病）”，尤其指感冒、发烧等常见病症。</li><li>原文语境是：感知到更多社会支持的人 <strong>less likely to come ___ with a cold</strong>（更不容易患上感冒），因此应填入 <strong>down</strong>。</li></ul><p>其他选项：</p><ul><li><strong>come along</strong>（进展；一起来）</li><li><strong>come across</strong>（偶然遇到）</li><li><strong>come out</strong>（出来；出版；结果是）<br/>均不符合“生病”的语义。</li></ul><p>因此正确答案是 <strong>C. down</strong>。</p>
