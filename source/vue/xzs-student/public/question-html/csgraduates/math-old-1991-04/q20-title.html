<p>一汽车沿一街道行驶，需要通过三个均设有红绿信号灯的路口，
每个信号灯为红或绿与其他信号灯为红或绿相互独立，且红绿两种信号显示的时间相等，
以
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.6833em"></span><span class="mord mathnormal" style="margin-right:.07847em">X</span></span></span></span>
表示该汽车首次遇到红灯前已通过的路口的个数．求
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.6833em"></span><span class="mord mathnormal" style="margin-right:.07847em">X</span></span></span></span>
