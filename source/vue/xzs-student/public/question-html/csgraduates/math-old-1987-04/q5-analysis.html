<p><strong>【答案】</strong> 正确</p><p><strong>【解析】</strong> 连续型随机变量的概率分布由概率密度函数描述，其概率计算基于积分。<br/>对于任意给定实数值
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.4306em"></span><span class="mord mathnormal">x</span></span></span></span>
，概率
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:1em;vertical-align:-.25em"></span><span class="mord mathnormal" style="margin-right:.13889em">P</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:.07847em">X</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-.25em"></span><span class="mord mathnormal">x</span><span class="mclose">)</span></span></span></span>
等于概率密度函数在点
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.4306em"></span><span class="mord mathnormal">x</span></span></span></span>
处的积分，但由于积分区间长度为 0，根据积分的性质，该积分值必然为 0。<br/>因此，连续型随机变量取任何给定实数值的概率都等于 0。<br/>需要注意的是，这并不意味着该值不可能发生，而是概率测度在单个点上的值为 0，实际概率质量分布在区间上。</p>
