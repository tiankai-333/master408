<p>为清除井底的污泥，用缆绳将抓斗放入井底，抓起污泥后提出井口（见图），已知井深 30m，抓斗自重 400N，缆绳每米重 50N，抓斗抓起的污泥重 2000N，提升速度为
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:1em;vertical-align:-.25em"></span><span class="mord">3</span><span class="mord mathnormal">m</span><span class="mord">/</span><span class="mord mathnormal">s</span></span></span></span>
，在提升过程中，污泥以 20N/s 的速度从抓斗缝隙中漏掉，现将抓起污泥的抓斗提升至井口，问克服重力需作多少焦耳的功？</p>
<p>(说明：①
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.7667em;vertical-align:-.0833em"></span><span class="mord">1</span><span class="mord mathnormal" style="margin-right:.10903em">N</span><span class="mspace" style="margin-right:.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:.2222em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">1</span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.6833em"></span><span class="mord">1</span><span class="mord mathnormal" style="margin-right:.09618em">J</span></span></span></span>
；其中
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.8778em;vertical-align:-.1944em"></span><span class="mord mathnormal">m</span><span class="mpunct">,</span><span class="mspace" style="margin-right:.1667em"></span><span class="mord mathnormal" style="margin-right:.10903em">N</span><span class="mpunct">,</span><span class="mspace" style="margin-right:.1667em"></span><span class="mord mathnormal">s</span><span class="mpunct">,</span><span class="mspace" style="margin-right:.1667em"></span><span class="mord mathnormal" style="margin-right:.09618em">J</span></span></span></span>
