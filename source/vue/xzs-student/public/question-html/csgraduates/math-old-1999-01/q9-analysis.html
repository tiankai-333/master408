<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 设A是m×n矩阵，B是n×m矩阵，则AB是m×m方阵。当m&gt;n时，由于rank(A) ≤ n和rank(B) ≤ n，因此rank(AB) ≤ min(rank(A), rank(B)) ≤ n &lt; m。这意味着AB的秩小于其阶数m，故AB是奇异矩阵，行列式|AB| = 0。因此选项B正确。当n&gt;m时，rank(AB) ≤ m，但可能等于m，故|AB|可能不为零，也可能为零，因此选项C和D均错误。选项A与上述结论矛盾，故错误。
