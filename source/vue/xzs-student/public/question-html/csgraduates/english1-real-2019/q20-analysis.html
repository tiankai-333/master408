<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>解析：</strong><br/>第 20 题所在句子是：</p><blockquote><p>Trail blazes, tire tracks, and other features can ______ you to civilization.</p></blockquote><ul><li><strong>A. restrict</strong>（限制）——不符合语境，因为这些痕迹不会限制你回到文明世界。</li><li><strong>B. adapt</strong>（适应）——搭配不当，不能说“适应你到文明世界”。</li><li><strong>C. lead</strong>（引导）——搭配正确，意为“引导你回到文明世界”，符合上下文逻辑。</li><li><strong>D. expose</strong>（暴露）——语义不通，不能说“暴露你到文明世界”。</li></ul><p>因此正确答案是 <strong>C. lead</strong>。</p>
