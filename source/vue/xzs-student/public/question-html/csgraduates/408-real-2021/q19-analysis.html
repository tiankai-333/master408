<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><a href="/constitution_principle/bus/bus/#%e6%80%bb%e7%ba%bf">总线</a> 是在两个或多个设备之间进行通信的传输介质，A 正确。<a href="/constitution_principle/bus/bus/#%e5%90%8c%e6%ad%a5%e5%ae%9a%e6%97%b6%e6%96%b9%e5%bc%8f">同步总线</a> 是指总线通信的双方采用同一个时钟信号，但是一次总线事务不一定在一个时钟周期内完成，即时钟频率不一定等于工作频率，B 正确。<a href="/constitution_principle/bus/bus/#%e5%bc%82%e6%ad%a5%e5%ae%9a%e6%97%b6%e6%96%b9%e5%bc%8f">异步总线</a> 采用握手的方式进行通信，每次握手的过程完成一次通信，但一次通信往往会交换多位而非一位数据，C 错误。<a href="/constitution_principle/bus/bus/#%e7%aa%81%e5%8f%91%e6%80%bb%e7%ba%bf%e4%bc%a0%e8%be%93%e4%ba%8b%e5%8a%a1">突发总线传输事务</a> 是指发送方在传输完地址后，连续进行若干次数据的发送，D 正确。
