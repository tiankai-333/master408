<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>这题考察的是两点，一是 <a href="/data_structure/tree/btree/#%e4%ba%8c%e5%8f%89%e6%a0%91%e6%9e%84%e5%bb%ba">二叉树构建</a>，即根据 先序 和 中序 构建二叉树。二是 <a href="/data_structure/tree/tree/#%e6%a3%ae%e6%9e%97%e8%bd%ac%e4%ba%8c%e5%8f%89%e6%a0%91">森林转二叉树</a>，构建出二叉树后即可反向转化得到对应的森林。
森林中树的个数 即 二叉树根结点的右结点个数之和。
