<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/data_structure/linearlist/linked/#%e5%88%a0%e9%99%a4">删除</a>头结点后一个结点的基本流程为 <code>q = h-&gt;next; h-&gt;next = q-&gt;next; free(q);</code>，即通过指针操作跳过下一个结点后删除该结点。
由于题目中提到了该链表非空，所以可以确定 <code>q = h-&gt;next</code> 一定不为空。
但是如果链表中只有一个结点的话，我们还需要在删除该结点后，将尾指针指向头结点的位置，即 <code>if (p == q) p = h;</code>
