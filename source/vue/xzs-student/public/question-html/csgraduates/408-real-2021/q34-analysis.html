<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><a href="/computer_network/physical/encoding/#%e7%bc%96%e7%a0%81%e7%b1%bb%e5%9e%8b">差分曼彻斯特编码</a> 常用于局域网传输，其规则是：若码元为 1，则前半个码元的电平与上一码元的后半个码元的电平相同；若码元为 0，则情形相反。差分曼彻斯特编码的特点在于，在每个时钟周期的起始处，跳变则说明该比特是 0，不跳变则说明该比特是 1。根据题 34 图，第 1 个码元的信号波形因缺乏上一码元的信号波形，无法判断是 0 还是 1.但根据后面的信号波形，可以求出第 2~8 个码元为 011 1001，因此选 A。
