<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>若 x, y 和 z 均为<a href="/constitution_principle/representation/conversion/#%e6%9c%89%e7%ac%a6%e5%8f%b7%e6%95%b4%e6%95%b0%e5%92%8c%e6%97%a0%e7%ac%a6%e5%8f%b7%e6%95%b4%e6%95%b0">无符号整数</a>，则 x &gt; y &gt; z，A 和 B 错误。若 x, y 和 z 均为带符号整数，补码的最高位是符号位，0 表示正数，1 表示负数，因此 z 为正数，而 x 和 y 为负数。对于 x 和 y 的比较，数值位取反加一，可知 x = -3H，y = -21H，故 x &gt; y。
