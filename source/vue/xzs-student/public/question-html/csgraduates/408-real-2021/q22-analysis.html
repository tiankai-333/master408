<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>中断服务程序在内核态下执行，但这并不代表在用户态下就无法响应中断。若只能在用户态下检测和响应中断，显然无法实现多重中断（中断嵌套），A 错误。在 <a href="/constitution_principle/bus/io/#%e5%a4%9a%e9%87%8d%e4%b8%ad%e6%96%ad">多重中断</a> 中，CPU 只有在检测到中断请求信号后（中断处理优先级更低的中断请求信号是检测不到的），才会进入中断响应周期。进入中断响应周期时说明此时 CPU 一定处于中断允许状态，否则无法响应该中断。如果所有中断源都被屏蔽（说明该中断处理优先级最高），则 CPU 不会检测到任何中断请求信号。
