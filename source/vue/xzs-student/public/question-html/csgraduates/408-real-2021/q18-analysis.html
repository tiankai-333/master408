<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>指令执行过程中数据所经过的路径，包括路径上的部件，称为数据通路。ALU、通用寄存器、状态寄存器、Cache、MMU、浮点运算逻辑、异常和中断处理逻辑等，都是指令执行过程中数据流经的部件，都属于 <a href="/constitution_principle/cpu/structure/#%e6%95%b0%e6%8d%ae%e9%80%9a%e8%b7%af">数据通路</a> 的一部分。数据通路中的数据流动路径由控制部件控制，控制部件根据每条指令功能的不同，生成对数据通路的控制信号。
