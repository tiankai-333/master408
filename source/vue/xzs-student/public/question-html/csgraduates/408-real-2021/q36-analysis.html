<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p>本题考察 <a href="/computer_network/network/ip/#ip-%e6%95%b0%e6%8d%ae%e6%8a%a5%e5%88%86%e7%89%87">IP 数据报分片</a>。</p><p>链路层 MTU = 800B。IP 分组首部长 20B。片偏移以 8 个字节为偏移单位，因此除最后个分片，其他每个分片的数据部分长度都是 8B 的整数倍。所以，最大 IP 分片的数据部分长度为 776B。总长度 1580B 的卫 P 数据报中，数据部分占 1560B，1560B/776B=2.01…需要分成 3 片。故第 2 个分片的总长度字段为 796，MF 为 1（表示还有后续的分片）。</p>
