<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p>在 <a href="/operating_system/concepts/environment/#%e5%86%85%e6%a0%b8%e6%a8%a1%e5%bc%8f">内核态</a> 下，CPU 可执行任何指令，在用户态下 CPU 只能执行非特权指令，而特权指令只能在内核态下执行。常见的 <a href="/operating_system/concepts/environment/#%e7%89%b9%e6%9d%83%e6%8c%87%e4%bb%a4">特权指令</a> 有：</p><ol><li>有关对 IO 设备操作的指令；</li><li>有关访问程序状态的指令；</li><li>存取特殊寄存器指令；</li><li>其他指令。</li></ol><p>A、C 和 D 都是提供给用户使用的指令，可以在用户态执行，只是可能会使 CPU 从用户态切换到内核态。</p>
