<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>在分时系统的 <a href="/operating_system/process/scheduling/#%e6%97%b6%e9%97%b4%e7%89%87%e8%bd%ae%e8%bd%ac">时间片轮转</a> 中，当系统检测到时钟中断时，会引出时钟中断处理程序调度程序从就绪队列中选择一个进程为其分配时间片，并修改该进程的进程控制块中的进程状态等信息，同时将时间片用完的进程放入就绪队列或让其结束运行。I、II、Ⅲ 正确。阻塞队列中的进程只有被唤醒进入就绪队列后，才能参与调度，所以该调度过程不使用阻塞队列。
