<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong><br/>间接寻址需要两次访问内存：第一次使用指令中的地址（间接地址）访问内存，得到的是操作数的真实地址。这个从内存读取出的地址信息需要传回 CPU，以便进行第二次访问。</p><p>在计算机系统总线中，地址总线用于 CPU 向内存发送地址信号，是单向的；数据总线用于在 CPU 和内存之间双向传输数据，包括指令、操作数或地址值。第一次访问内存后，内存将读到的地址作为数据通过数据总线送回 CPU。控制总线负责传输控制信号，不参与具体数据或地址的传输；总线控制器是管理总线的部件，与信息传输路径无关。</p><p>因此，第一次访问内存所得的信息（即操作数的真实地址）是通过数据总线传送到 CPU 的。</p>
