<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong> 在请求调页存储管理中，页表项中的<strong>修改位</strong>（也称为脏位）用于标识页面自调入内存后是否被写入过。当系统需要腾出内存空间以调入新页面时，会触发页面淘汰过程。此时，修改位的状态至关重要：</p><ul><li>若页面未被修改（修改位为 <code>0</code>），则可以直接丢弃，因为磁盘上已有相同副本；</li><li>若页面已被修改（修改位为 <code>1</code>），则必须将其写回磁盘以保持数据一致性。</li></ul><p>因此，修改位主要为淘汰页面提供参考，以优化 I/O 操作，避免不必要的磁盘写入。其他选项如程序修改、分配页面或调入页面，均不直接依赖修改位作为关键决策依据。</p>
