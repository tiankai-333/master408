<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong>
当 IP 分组经过路由器进行分片时，其首部中某些字段会发生变化。标识字段用于唯一标识原始 IP 分组，分片时所有片段都继承相同的标识，以便接收端重组，因此该字段不变。标志字段中的“更多片段”位会发生变化：除最后一个片段外，其他片段该位设置为 1，最后一个设置为 0。片偏移字段指示每个片段在原始数据中的位置，分片后每个片段都有新的偏移值。总长度字段更新为每个片段自身的长度，而非原始长度。校验和字段针对每个片段的首部重新计算，因为首部内容已变。因此，发生变化的字段包括标志、片偏移、总长度和校验和，对应选项 B。
