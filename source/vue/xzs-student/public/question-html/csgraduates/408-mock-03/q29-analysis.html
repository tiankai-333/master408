<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong> 首先，计算主存中每块的大小。主存总容量为 128KB，分为 32 块，因此每块大小 = 128KB / 32 = 4KB = 4096 字节。<br/>逻辑地址 [3, 70] 表示页号为 3，页内地址为 70。根据作业的页表映射，页 3 被装入主存的块 6 中，因此对应的物理块号为 6。<br/>物理地址的计算公式为：物理地址 = 块号 × 块大小 + 页内地址。代入数值：物理地址 = 6 × 4096 + 70 = 24576 + 70 = 24646。<br/>因此，逻辑地址 [3, 70] 对应的物理地址为 24646，对应选项 A。
