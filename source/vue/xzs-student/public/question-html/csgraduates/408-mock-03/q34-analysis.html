<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>在计算机网络中，传输介质（如电缆或光纤）的信号会随着距离增加而衰减，这可能导致数据丢失或错误。为了延长传输距离，需要在物理层安装设备来重新生成或增强信号。</p><p>中继器正是这样的设备，它工作在 OSI 模型的物理层，接收衰减的信号，将其放大或重新生成后转发，从而扩展网络的覆盖范围。因此，中继器是解决信号衰减问题的标准选择。</p><p>其他选项的功能不同：放大器虽然也能放大信号，但在网络术语中更常用中继器来描述这一功能；路由器用于连接不同网络并选择路径，工作在网络层；网桥用于连接网段并过滤数据帧，工作在数据链路层，两者均不直接针对物理信号衰减问题。</p>
