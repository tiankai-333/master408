<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong>
程序查询（Ⅰ）完全由软件实现，CPU 通过执行指令不断轮询设备状态，无需硬件辅助，属于纯软件方式。</p><p>程序中断（Ⅱ）由硬件和软件共同实现：硬件负责检测中断信号并触发，软件则通过中断服务程序处理具体 I/O 操作，是典型的软硬结合方式。</p><p>DMA（Ⅲ）同样需要软硬协作：硬件由 DMA 控制器直接管理数据传送，软件则负责初始化控制器、设置参数并在传输完成后处理中断。</p><p>通道（Ⅳ）是一种高级 I/O 控制机制，硬件上通道控制器执行通道程序独立管理 I/O，软件上由 CPU 启动和监控通道操作，也依赖于软硬结合。</p><p>因此，Ⅱ、Ⅲ和Ⅳ均符合“软件和硬件相结合”的实现方式。</p>
