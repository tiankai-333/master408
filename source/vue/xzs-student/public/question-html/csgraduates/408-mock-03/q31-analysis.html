<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong><br/>操作系统的 I/O 子系统通常分为四个层次：用户级 I/O 软件、设备无关软件、设备驱动程序和中断处理程序。检查设备的就绪状态是指直接查询硬件设备是否准备好执行 I/O 操作，这一功能需要与设备控制器进行底层交互。</p><p>设备驱动程序位于设备无关软件之下，直接管理特定硬件设备的操作，包括初始化设备、发送命令、轮询状态或处理中断。因此，检查设备就绪状态的具体实现由设备驱动程序完成。其他层次中，用户级 I/O 软件提供库函数接口，设备无关软件处理设备独立性和通用协议，中断处理程序则被动响应设备完成事件，均不直接负责主动检查设备状态。</p>
