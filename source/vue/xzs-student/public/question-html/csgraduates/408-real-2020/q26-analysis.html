<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/operating_system/process/scheduling/#%e5%a4%9a%e7%ba%a7%e5%8f%8d%e9%a6%88%e9%98%9f%e5%88%97">多级反馈队列</a> 调度算法需要综合考虑优先级数量、优先级之间的转换规则等，就绪队列的
数量会影响长进程的最终完成时间，I 正确；就绪队列的优先级会影响进程执行的顺序，II

中的迁移条件会影响各进程在各队列中的执行时间，IV 正确。
