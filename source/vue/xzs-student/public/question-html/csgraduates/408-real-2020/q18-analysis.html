<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><a href="/constitution_principle/instruction/instruction_ops/#%e9%99%b7%e9%98%b1%e6%8c%87%e4%bb%a4">自陷</a> 是一种内部异常，A 错误。在 8086 中，用于程序调试的“断点设置”功能是通过“自陷”方式实现的，选 项 B 正确。执行到自陷指令时，无条件或有条件地自动调出操作系统内核程序进行执行，选 项 C 正确。CPU 执 行“陷阱指令”后，会自动地根据不同“陷阱”
类型进行相应的处理，然后返回到“陷阱指令”的下一条指令执行，选 项 D 正确。
