<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>本题考查 <a href="/computer_network/overall/protocol/#%e7%bd%91%e7%bb%9c%e5%8d%8f%e8%ae%ae%e8%a6%81%e7%b4%a0">网络协议要素</a>。协议 由语法、语义和时序（又称同步）三部分组成：</p><ul><li><strong>语法</strong> 规定了通信双方彼此“如何讲”，即规定了传输数据的格式。</li><li><strong>语义</strong> 规定了通信双方彼此“讲什么”，规定了所要完成的功能，如通信双方要发出什么控制信息、执行的动作和返回的应答。</li><li><strong>时序</strong> 规定了信息交流的次序。</li></ul><p>由图可知发送方与接收方依次交换信息，体现了协议三要素中的时序要素。</p>
