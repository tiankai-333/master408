<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><a href="/data_structure/sort/internal/#%e5%a0%86">堆</a> 是一棵完全树，采用一维数组存储，故 I 正确，II 正确。<a href="/data_structure/sort/internal/#%e5%a4%a7%e6%a0%b9%e5%a0%86">大根堆</a> 只要求根结点值大于左右孩子值，并不要求左右孩子值有序，III 错误。堆的定义是递归的，所以其左右子树也是大根堆，所以堆的次大值一定是其左孩子或右孩子，IV 正确。
