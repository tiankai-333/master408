<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><a href="/operating_system/process/process_thread/#%e7%88%b6%e5%ad%90%e8%bf%9b%e7%a8%8b">父进程与子进程</a> 当然可以并发执行，选项 A 正确。父进程可与子进程共享一部分资源，但
不能共享虚拟地址空间，在创建子进程时，会为子进程分配资源，如虚拟地址空间等，选
项 B 错误。临界资源一次只能为一个进程所用，选项 D 正确。进程控制块 PCB 是进程存
在的唯一标志，每个进程都有自己的 PCB，选项 C 正确。
