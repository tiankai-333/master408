<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>发送数据帧和确认帧的时间均为 t= 1000x8b/10kbps = 800ms。</p><p>发送周期 T = 800ms + 200ms + 800ms + 200ms = 2000ms。</p><p><a href="/computer_network/datalink/flow_control/#%e4%bf%a1%e9%81%93%e5%88%a9%e7%94%a8%e7%8e%87">信道利用率</a> = t/T x 100% = 800/2000x100% = 40%。</p>
