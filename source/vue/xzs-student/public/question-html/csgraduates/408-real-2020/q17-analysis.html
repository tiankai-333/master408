<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><a href="/constitution_principle/overview/performance/#cpi">CPI</a> 表示执行指令所需的时钟周期数。对于一个程序或一台机器来说，其 CPI 指执行该程序或机器指令集中的所有指令所需的平均时钟周期数。</p><p>对于单周期 CPU，令指令周期 = 时钟周期，CPI=1，I 正确。</p><p>对于多周期 CPU，CPU 的执行过程分成几个阶段，每个阶段用一个时钟去完成，每种指令所用的时钟数可以不同，CPI &gt; 1 , II 错误。</p><p>对于基本流水线 CPU，让每个时钟周期流出一条指令，CPI = 1, III 正确。</p><p>超标量流水线 CPU 在每个时钟周期内并发执行多条独立的指令，每个时钟周期流出多条指令，CPI &lt; 1, IV 错误。</p>
