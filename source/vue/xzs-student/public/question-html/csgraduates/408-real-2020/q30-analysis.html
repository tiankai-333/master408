<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>设备可视为特殊文件，选项 A 正确。用户使用 <a href="/operating_system/io_device/management/#%e9%80%bb%e8%be%91%e8%ae%be%e5%a4%87%e5%90%8d">逻辑设备名</a> 来访问物理文件，有利于设备独
立性，选项 B 正确。通过逻辑设备名访问物理设备时，需要建立逻辑设备和物理设备之间
的 <a href="/operating_system/io_device/management/#%e9%80%bb%e8%be%91%e5%92%8c%e7%89%a9%e7%90%86%e8%ae%be%e5%a4%87%e6%98%a0%e5%b0%84">映射关系</a>，选项 C 正确。应用程序按逻辑设备名访问设备，再经驱动程序的处理来控制物理设备，若更换物理设备，则只需更换驱动程序，而无须修改应用程序，选项 D 错误。
