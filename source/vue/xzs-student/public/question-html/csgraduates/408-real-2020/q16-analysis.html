<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p>参考 <a href="/constitution_principle/instruction/format/#%e6%8c%87%e4%bb%a4%e6%a0%bc%e5%bc%8f">指令格式</a>，48 条指令需要 6 位操作码字段 (
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.8532em;vertical-align:-.0391em"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:.8141em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">5</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.6835em;vertical-align:-.0391em"></span><span class="mord">48</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.8141em"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:.8141em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">6</span></span></span></span></span></span></span></span></span></span></span>
), 4 种寻址方式需要 2 位寻址特征位 (
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">4</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.8141em"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:.8141em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span>
),
还剩 16 - 6 - 2 = 8 位作为地址码，故直接寻址范围为 0 ~ 255。注意，主存地址不能为负。</p><p>🚫 <strong>常见误区说明：</strong></p><ul><li>在 <strong>相对寻址</strong> 中，可能会有<strong>有符号偏移</strong>，比如 <code>-128 ~ 127</code> 或 <code>-512 ~ 511</code>，那是针对偏移字段的符号解释；</li><li><strong>直接寻址不需要符号位</strong>，它就是一个<strong>无符号绝对地址</strong>。</li></ul>
