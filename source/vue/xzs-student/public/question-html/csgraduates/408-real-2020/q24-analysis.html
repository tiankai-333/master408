<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><a href="/operating_system/files/file/#%e7%b4%a2%e5%bc%95%e5%88%86%e9%85%8d">索引分配</a> 支持变长的文件，同时可以随机访问文件的指定数据块，选项 A 正确。链接分配
不支持随机访问，需要依靠指针依次访问，选项 B 错误。连续分配的文件长度固定，不支持
可变文件长度（连续分配的文件长度虽然也可变，但是需大量移动数据，代价较大，相比之
下不太合适），选项 C 错误。动态分区分配是内存管理方式，不是磁盘空间的管理方式，选
项 D 错误。
