<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>解析：</strong></p><p>第1题空格所在句为：</p><blockquote><p>They were typically <strong>______</strong> outside the walls of a city or village…</p></blockquote><p>四个选项的意思分别是：</p><ul><li><strong>A. displayed</strong> 展示</li><li><strong>B. occupied</strong> 占据</li><li><strong>C. located</strong> 位于</li><li><strong>D. equipped</strong> 装备</li></ul><p>根据句意，这里说的是商队旅馆（caravanserais）通常<strong>位于</strong>城市或村庄的城墙之外，强调的是位置，所以 <strong>C. located</strong> 最合适。</p><p><strong>因此正确答案是 C。</strong></p>
