<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>本题考察操作系统 <a href="/operating_system/concepts/concept/#%e5%8f%91%e5%b1%95%e5%8e%86%e7%a8%8b">发展历程</a>。批处理系统中，作业执行时用户无法干预其运行，只能通过事先配置作业控制来间接干预，缺少交互能力，也因此才发展出分时系统，I 错误。批处理系统按发展历程又分为单道批处理系统、多道批处理系统，II 正确。多道程序设计技术允许同时把多个程序放入内存，并允许它们交替在 CPU 中运行，它们共享系统中的各种硬、软件资源，当 一道程序因 1/0 请求而暂停运行时，CPU 便立即转去运行另 一道程序，即多道批处理系统的 1/0 设备可与 CPU 并行工作，这都是借助于中断技术实现的，III 正确。
