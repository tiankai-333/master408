<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>结合题干及选项可知，short 为 16 位。因 C 语言中的数据在内存中为 <a href="/constitution_principle/representation/integer/#%e8%a1%a5%e7%a0%81%e8%a1%a8%e7%a4%ba">补码表示</a>，si 对应的补码二进制表示为：1000 0000 0000 0001B, 最前面的一位 “1” 为符号位，表示负数，即 -32767。由 signed 型转化为等长 unsigned 型数据时，符号位成为数据的一部分，也就是说，负数转化为无符号数（即正数），其数值将发生变化。usi 对应的补码二进制表示与 si 的表示相同，但表示正数，为 32769。
