<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>本题考察 <a href="/operating_system/process/sync/#%e7%a1%ac%e4%bb%b6%e4%ba%92%e6%96%a5">硬件互斥</a>，当进程退出临界区时置 lock 为 FALSE，会负责唤醒处于就绪状态的进程，A 错误。若等待进入临界区的进程会一直停留在执行 <code>while(TSL(&amp;lock))</code> 的循环中，不会主动放弃 CPU, B 正确。让权等待，即当进程不能进入临界区时，应立即释放处理器，防止进程忙等待。通过 B 选项的分析中发现上述伪代码并不满足“让权等待”的同步准则，C 错误。若 <code>while(TSL(&amp;lock))</code> 在关中断状态下执行，当 <code>TSL(&amp;lock)</code> 一直为 true 时，不再开中断，则系统可能会因此终止，D 错误。
