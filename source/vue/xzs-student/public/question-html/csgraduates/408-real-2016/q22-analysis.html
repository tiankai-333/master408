<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><a href="/constitution_principle/cpu/interrupt/#%e4%b8%ad%e6%96%ad">中断</a> 是指来自 CPU 执行指令以外事件的发生，如设备发出的 I/O 结束中断，表示设备输入/输出处理已经完成，希望处理机能够向设备发出下一个输入/输出请求，同时让完成输入/输出后的程序继续运行。时钟中断，表示一个固定的时间片已到，让处理机处理计时、启动定时运行的任务等。这一类中断通常是与当前程序运行无关的事件，即它们与当前处理机运行的程序无关。<a href="/constitution_principle/cpu/interrupt/#%e5%bc%82%e5%b8%b8">异常</a> 也称内中断、例外或陷入（Trap），指源自 CPU 执行指令内部的事件，如程序的非法操作码、地址越界、算术溢出、虚存系统的缺页以及专门的陷入指令等引起的事件。A 错误。
