</span></span><span style="display:flex"><span>    <span style="color:#000">a</span><span style="color:#000;font-weight:700">[</span><span style="color:#000">k</span><span style="color:#000;font-weight:700">]</span> <span style="color:#ce5c00;font-weight:700">=</span> <span style="color:#000">a</span><span style="color:#000;font-weight:700">[</span><span style="color:#000">k</span><span style="color:#000;font-weight:700">]</span> <span style="color:#ce5c00;font-weight:700">+</span> <span style="color:#0000cf;font-weight:700">32</span><span style="color:#000;font-weight:700">;</span>
</span></span></code></pre></div>
