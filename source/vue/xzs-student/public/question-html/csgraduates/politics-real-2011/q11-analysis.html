<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>法律权威强调的是法律在社会生活中的至高地位和普遍约束力，具体表现为法律一经制定和实施，就必须被严格遵守和服从，任何组织或个人都不得违反。</p><ul><li><strong>A. 法的强制性</strong>：虽然法律具有强制性，但强制性只是保障法律实施的手段，并非法律权威的核心内涵。</li><li><strong>B. 法的不可违抗性</strong>：直接体现了法律必须被遵守、不容挑战的特性，是法律权威的本质要求。</li><li><strong>C. 法的合理性</strong>：涉及法律内容是否符合公平正义，属于法律本身的品质，而非权威的直接体现。</li><li><strong>D. 法的规范性</strong>：指法律为行为提供标准，属于法律的功能之一，与权威的侧重点不同。</li></ul><p>因此，本题正确答案为 <strong>B</strong>。</p>
