<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>从中国内部因素分析，历次反侵略战争失败的根本原因在于 <strong>社会制度的腐败</strong>。当时中国处于腐朽的封建专制统治下，政治制度落后，统治集团昏庸无能，对内镇压人民、对外妥协投降，导致无法有效组织全国力量抵抗外来侵略。虽然经济技术的落后（选项C）是重要原因，但它是受社会制度制约的；军事战略错误（选项A）和思想观念保守（选项D）也是社会制度腐败带来的具体表现。因此，最深层、最根本的原因是社会制度的腐败。
