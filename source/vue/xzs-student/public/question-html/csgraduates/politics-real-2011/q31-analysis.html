<strong>正确答案：<span class="correct-answer-text">AB</span></strong><br/><p><strong>【解析】</strong><br/>该句强调法律的权威不仅依赖于外在强制力，更需人们发自内心的认同与信仰。</p><ul><li><strong>A 正确</strong>：法律的内在说服力（如公平正义、保障权利等价值）是法律被自觉遵守和维护的基础，属于法律权威的内在支撑。</li><li><strong>B 正确</strong>：若法律仅靠强制力维持，缺乏公众认同，则难以真正树立权威，因此权威不能完全依赖外在强制。</li><li><strong>C 错误</strong>：法律信仰基于理性和社会规范，宗教信仰则基于超自然神圣性，二者本质不同。</li><li><strong>D 错误</strong>：法律制定和执行的根本依据是客观社会物质生活条件和国家意志，而非个人的法律信仰。</li></ul><p>综上，答案为 <strong>AB</strong>。</p>
