<p>(1) 实践是人的存在方式，是人与自然分化与统一的现实基础，如何合理地处理垃圾是人们实践活动方式和水平的反映。(3 分) 垃圾成为废物是由于人类实践活动方式不当 (即放错位置) 所造成的。我们必须转变实践活动方式，合理地调节人与自然之间的物质变换。(2 分)</p><p>(2) 矛盾是普遍存在的。生产生活中出现垃圾是不可避免的。我们要正视矛盾，只有在正确认识和解决矛盾当中才能推动事物发展。(2 分) 矛盾又具有特殊性，不同事物矛盾要用不同的方法来解决，把垃圾"变废为宝"可以有多种方法，垃圾分类就是一种有效的"出路"。(3 分)(注：如果考生从矛盾转化的角度论述，可酌情给分，最高不超过 4 分。)</p>
