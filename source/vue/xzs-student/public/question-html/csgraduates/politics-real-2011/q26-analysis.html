<strong>正确答案：<span class="correct-answer-text">BCD</span></strong><br/><p><strong>【解析】</strong></p><ol><li><strong>选项A</strong>：辛亥革命提出了“平均地权”，但“耕者有其田”是后来新民主主义革命时期提出的土地政策，并非辛亥革命的内容，因此A错误。</li><li><strong>选项B</strong>：辛亥革命前成立的同盟会是中国近代史上第一个资产阶级政党，故B正确。</li><li><strong>选项C</strong>：同盟会的纲领（三民主义）是比较完整的资产阶级民主革命纲领，故C正确。</li><li><strong>选项D</strong>：辛亥革命推翻了清王朝，结束了封建君主专制制度，建立了中华民国这一资产阶级共和国，故D正确。<br/>综上，本题正确答案为 <strong>BCD</strong>。</li></ol>
