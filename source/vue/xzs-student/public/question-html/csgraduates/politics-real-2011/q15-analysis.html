<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong><br/>题目问的是2010年“嫦娥二号”实现的技术突破。</p><ul><li>A选项：“深空探测‘零的突破’”是指嫦娥一号（2007年）实现中国首次月球探测，因此错误。</li><li>B选项：“首次月球软着陆和自动巡视勘测”是嫦娥三号（2013年）的任务，因此错误。</li><li>C选项：“首次月球样品自动取样返回探测”是嫦娥五号（2020年）的任务，因此错误。</li><li>D选项：“运载火箭直接将卫星发射至地球转移轨道”是嫦娥二号的重要技术突破之一，它由长征三号丙火箭直接送入地月转移轨道，相比嫦娥一号先进入地球停泊轨道再调整，是一种技术进步。<br/>因此正确答案为D。</li></ul>
