<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong><br/>深化文化体制改革中，公益性文化事业与经营性文化产业的功能定位不同。</p><ul><li><strong>公益性文化事业</strong>的根本任务是保障人民群众基本文化权益，构建公共文化服务体系，对应选项 B 和 C。</li><li><strong>经营性文化产业</strong>则通过市场机制运作，以繁荣文化市场、满足人民群众多样化、多层次、多方面的文化需求为目标，这正是其根本任务。<br/>选项 D 是发展文化产业的具体措施之一，而非根本任务。<br/>因此，本题正确答案为 <strong>A</strong>。</li></ul>
