<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>法律的指引作用通过不同的规范形式引导人们的行为。其中，<strong>义务性规范</strong>的特点在于规定人们必须作出某种行为或承担某种责任，通常使用“应当”“必须”等表述。选项C“应当或者必须做什么”准确地描述了义务性规范的内容。</p><ul><li>A项“不得或者不准做什么”对应的是<strong>禁止性规范</strong>；</li><li>B项“可以或者有权做什么”对应的是<strong>授权性规范</strong>；</li><li>D项“能够或者不能做什么”表述模糊，不是法律规范的标准分类。<br/>因此，本题正确答案为C。</li></ul>
