<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>TCP 连接的释放过程见 <a href="/computer_network/transport/tcp/#%e5%9b%9b%e6%ac%a1%e6%8c%a5%e6%89%8b">四次挥手</a>。题目问的是最少时间，所以当服务器 S 收到客户 C 发送的 FIN 请求后不再发送数据，而是立马发送 FN 请求（即第②步和第③步同时发生，忽略 FIN-WAIT2 和 CLOSE-WAIT 状态。C 收到 S 发来的 FIN 报文段后，进入 CLOSED 状态还需等到 TIME-WAIT 结束，总用时至少为 1RTT + 2MSL = 50 + 800×2 = 1650ms。S 进入 CLOSED 状态需要经过 3 次报文段的传输时间，即 1.5RTT=75ms。
