<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>本题考察 <a href="/operating_system/process/scheduling/#%e4%bc%98%e5%85%88%e7%ba%a7%e8%b0%83%e5%ba%a6">优先级调度</a>：</p><ul><li>0 时刻调度进程 P0 获得 CPU；</li><li>1Oms 时 P2 进入就绪队列，调度 P2 抢占获得 CPU；</li><li>15ms 时 P3 进入就绪队列，调度 P3 抢占获得 CPU；</li><li>25ms 时 P3 执行完毕，调度 P2 获得 CPU；</li><li>40ms 时 P2 执行完毕，调度 P0 获得 CPU；</li><li>130ms 时 P2 执行完毕，调度 P1 获得 CPU；</li><li>190ms 时 P2 执行完毕，结束；总共调度 6 次。</li></ul>
