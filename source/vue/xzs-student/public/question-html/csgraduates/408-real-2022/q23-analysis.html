<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>操作系统的 <a href="/operating_system/concepts/concept/#%e6%93%8d%e4%bd%9c%e7%b3%bb%e7%bb%9f%e7%89%b9%e5%be%81">基本特点</a>：并发、共享、虚拟、异步，其中最基本、一定要实现的是并发和共享，A、C 正确。早期的多道批处理操作系统会将所有进程的数据全部调入主存，再让多道程序并发执行，即使不支持虚拟存储管理，也能实现“多道程序并发”，B 正确。进程多并不意味着 CPU 利用率高，进程数量越多，进程之间的资源竞争越激烈，甚至可能因为资源竞争而出现死锁现象，导致 CPU 利用率低，D 错误。
