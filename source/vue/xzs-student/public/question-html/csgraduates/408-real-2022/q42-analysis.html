</code></pre><p>当数据全部扫描完毕，数组 A[0]~A[9]保存的即是最小的 10 个数。</p><p>【答案 2】</p><p>定义含 10 个元素的大根堆 H，元素值均为该堆元素类型能表示的最大数 MAX。</p><pre tabindex="0"><code>for M 中的每个元素 s
