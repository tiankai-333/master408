<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>指令集处于软硬件的交界面上。指令字和指令格式、通用寄存器个数和位数都与
机器指令有关，由 <a href="/constitution_principle/instruction/concepts/#%e6%8c%87%e4%bb%a4%e4%bd%93%e7%b3%bb%e7%bb%93%e6%9e%84">指令体系结构</a> 规定。两个 CPU 可以有不同的时钟周期，但指令集可以相同，CPU 的
时钟周期不由 ISA 规定。加法器的进位方式涉及电路设计，也不由指令集规定。
