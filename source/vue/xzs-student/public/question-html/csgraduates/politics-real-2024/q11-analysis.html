<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>1894年11月，孙中山在檀香山创立兴中会，其章程中明确提出“是会之设，专为振兴中华、维持国体起见”，因此“振兴中华”是孙中山在《兴中会章程》中提出的口号。<br/>选项B“建立民国”是后来同盟会时期提出的革命纲领（三民主义中的“创立民国”）；<br/>选项C“反帝反封”是中国共产党在民主革命时期明确提出的口号；<br/>选项D“民主自由”属于资产阶级革命的一般主张，并非《兴中会章程》中的原文口号。<br/>故本题正确答案为 <strong>A</strong>。
