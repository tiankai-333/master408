<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong></p><ol><li>卢沟桥事变（又称七七事变）发生在1937年7月7日，是日本全面侵华的开始，也是中国全民族抗战的开端。</li><li>选项A“揭开了抗日战争的序幕”不够准确，因为局部抗战早在1931年九一八事变后已经开始。</li><li>选项B“成为中国人民抗日战争的起点”通常指的是1931年九一八事变，而非1937年。</li><li>选项C正确，因为卢沟桥事变后，国共合作加强，全国形成了统一抗战的局面，标志着中国进入全民族抗战阶段。</li><li>选项D错误，世界反法西斯同盟的正式建立以1942年《联合国家宣言》的签署为标志，与卢沟桥事变无关。</li></ol><p>因此，本题正确答案是 <strong>C</strong>。</p>
