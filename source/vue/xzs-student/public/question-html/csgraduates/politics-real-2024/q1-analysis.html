<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>习近平新时代中国特色社会主义思想强调推进理论创新必须坚守“魂脉”与“根脉”。其中，“魂脉”指马克思主义这一科学理论的根本指导思想，是理论创新的灵魂和方向；“根脉”指中华优秀传统文化，是理论创新的历史根基和文化源泉。将马克思主义基本原理同中华优秀传统文化相结合，是保持理论创新生命力、彰显中国特色的关键。<br/>B项中的共产主义社会理想和“天下大同”理想虽有一定联系，但“天下大同”属于传统文化范畴，未完整涵盖“魂”与“根”的整体表述；C项涉及价值观层次，并非理论创新的核心基础；D项强调理想信念，属于实践目标范畴。因此，A项准确对应了“魂脉”与“根脉”的内涵。
