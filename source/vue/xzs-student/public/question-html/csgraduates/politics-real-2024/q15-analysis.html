<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>本题考察对习近平总书记关于基础研究重要讲话内容的理解。习近平总书记在主持中共中央政治局第三次集体学习时明确指出：“加强基础研究，归根到底要靠高水平人才。”人才是科技创新中最核心、最活跃的因素，高水平人才是开展基础研究、实现科技自立自强的根本支撑。其他选项如体制机制、国际合作平台、学科建设布局均为加强基础研究的重要条件或途径，但“归根到底”的决定性力量是高水平人才。因此，正确答案为 <strong>D</strong>。
