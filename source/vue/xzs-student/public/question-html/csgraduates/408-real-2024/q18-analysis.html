<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><a href="/constitution_principle/storage/virtual/#%e5%9c%b0%e5%9d%80%e7%bf%bb%e8%af%91%e6%9c%ba%e6%9e%84">MMU</a> 负责将虚拟地址转化为物理地址，所以会检测以下事件：访问越权、页面缺失、TLB 缺失。Cache 缺失不是在 MMU 地址转换过程中检测的，而是在 CPU 访问主存数据检测的，访问主存的前提是有物理地址，所以该过程是在 MMU 完成地址翻译之后。
