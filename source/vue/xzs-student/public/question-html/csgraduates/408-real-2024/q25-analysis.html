<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>I. 更新程序计数器的值：程序计数器存储了下一条要执行的指令的地址。当进程切换时
，操作系统需要更新程序计数器的值，以便于新的进程能从正确的位置开始执行。</p><p>II. 更新栈基址寄存器的值：栈基址寄存器存储了当前进程栈的基址。当进程切换时，操作系统
需要更新栈基址寄存器的值，以确保新的进程使用正确的栈。</p><p>III. 更新页表基址寄存器值：页基址寄存器存储了当前进程的页表基址。当进程切换时，操作系
统需要更新页基址寄存器的值，以确保新的进程能正确地访问其内存空间。</p>
