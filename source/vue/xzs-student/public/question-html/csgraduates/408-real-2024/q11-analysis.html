<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>在外排序的多路归并中，<a href="/data_structure/sort/external/#%e8%83%9c%e8%80%85%e6%a0%91">败者树</a>（Loser Tree）是一种优化的数据结构，用于快速找出多个归并段中当前最小的关键字。它是一个完全二叉树，每个非叶子节点保存的是“败者”，而整棵树的根节点保存的是当前“冠军” —— 即：</p><blockquote><p>当前最小关键字所在的归并段号。</p></blockquote><p>所以答案选择 D。</p>
