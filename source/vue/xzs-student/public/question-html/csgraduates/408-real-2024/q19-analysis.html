<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>本题考查 <a href="/constitution_principle/cpu/pipeline/#%e6%95%b0%e6%8d%ae%e5%86%92%e9%99%a9">数据冒险</a>。</p><ul><li>A 选项正确，比如第一条指令写寄存器，下一条马上读同一个寄存器，就可能发生数据冒险。</li><li>B 选项正确，“气泡”本质上是插入一条空操作（nop），让数据有时间准备好，避免错误读取。</li><li>C 选项错误，Load-use hazard（加载 - 使用冒险）：加载指令的数据在内存访问阶段（MEM）才准备好，而后续指令可能在执行阶段（EX）就需要使用数据，这种情况即使有旁路电路也可能无法避免，通常还需要插入一个“气泡”。</li><li>D 选项正确，插入气泡即推迟指令后续阶段执行，可以避免所有数据冒险。</li></ul>
