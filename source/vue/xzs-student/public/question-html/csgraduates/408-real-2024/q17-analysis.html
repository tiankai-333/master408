<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>根据题意可知，虚拟地址为 32 位，主存地址为 30 位，页大小为 1KB，因此，虚拟页号为 32-10=22 位，物理页号为 30-10=20 位。TLB 共有 32 个表项，采用 4 路组相联映射方式。因此，TLB 共有 32/4=8 组，每组有 4 路。索引字段为

位。标记字段位数 = 虚拟页号位数 - 索引字段位数=22-3=19 位。</p><p>具体原理可以参考 <a href="/constitution_principle/storage/virtual/#tlb">TLB</a> 一节。</p>
