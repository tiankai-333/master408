<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>在 <a href="/operating_system/io_device/disks/#c-scan">CSCAN</a> 中，磁头会在一个方向上移动，直到达到磁道的一端，然后立即返回到另一端，再次开始扫描。</p><p>首先磁头会移动到 160 号磁道，然后依次是 120 号、110 号、0 号，接着磁头移动到开头，然后向磁道号减少的方向移动：依次移动到 399 号、300 号、210 号，完成所有请求后，磁头移动的总距离为：</p><p>200-160=40；160-110=50；110-0=110；399-0=399；399-300=90；300-210=90；</p><p>磁头移动的总距离为 40+50+110+399+99+90=788</p>
