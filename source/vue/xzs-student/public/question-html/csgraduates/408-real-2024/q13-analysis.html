<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p>伪指令：伪指令不是真正的 CPU 指令，而是由汇编器识别和执行的一些特殊指令。</p><p>微指令：微指令是计算机硬件级别指令，一条机器指令所完成的操作划分成若干条微指令来完成。</p><p>机器指令：CPU 可以直接解析和执行的二进制代码。</p><p>汇编指令：低级别的编程语言，与机器指令一一对应，不过需要汇编器转换为机器指令，CPU 才能执行。</p><p>这些概念的关系参考 <a href="/constitution_principle/cpu/controller/#%e5%be%ae%e7%a8%8b%e5%ba%8f%e6%8e%a7%e5%88%b6%e5%99%a8">该节</a>。</p>
