<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>当用户终止进程时，不一定终止子进程。因为子进程的生命周期并不总是与父进程紧密相关联，在某些情况下，即使父进程被终止，子进程也可以继续运行，如 <a href="/operating_system/process/process_thread/#%e5%ad%a4%e5%84%bf%e8%bf%9b%e7%a8%8b">孤儿进程</a> 和 <a href="/operating_system/process/process_thread/#%e5%83%b5%e5%b0%b8%e8%bf%9b%e7%a8%8b">僵尸进程</a>。
