<strong>正确答案：<span class="correct-answer-text">ABD</span></strong><br/><p><strong>【解析】</strong></p><ol><li><strong>A项正确</strong>：法律权利与法律义务具有二重性，即同一主体可能同时享有权利和承担义务，且权利和义务在一定条件下可以相互转化。</li><li><strong>B项正确</strong>：法律权利与法律义务是目的与手段的关系，权利的实现往往需要义务的履行作为保障，义务的设定也常以维护权利为目的。</li><li><strong>C项错误</strong>：法律权利与义务没有绝对的先后顺序，二者通常同时产生、相互关联，不具有固定的顺序性。</li><li><strong>D项正确</strong>：法律权利与义务相互依存，没有无义务的权利，也没有无权利的义务，二者互为存在条件，如“硬币的两面”。</li></ol><p>综上，符合题意的选项为 <strong>A、B、D</strong>。</p>
