<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>抗日战争初期，华北战场上规模最大、战斗最激烈的战役是忻口会战（1937年10月）。该战役是国民党军队与共产党领导的八路军协同作战的典型战例，八路军在侧翼和敌后开展游击战，积极配合正面战场，体现了国共合作抗日的特点。台儿庄战役虽为著名胜仗，但发生在华东徐州地区；长城抗战发生于1933年，属于抗战前期但并非全民族抗战爆发后的战役；平津会战（1937年7月）是抗战初期战役，但规模与协同程度不及忻口会战。因此，符合题干描述的选项为D。
