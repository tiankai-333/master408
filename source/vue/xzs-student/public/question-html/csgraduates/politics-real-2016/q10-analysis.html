<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>魏源在《海国图志》中提出“师夷长技以制夷”，其核心在于学习西方的先进技术以抵抗外来侵略。结合19世纪中叶的历史背景，当时中国在鸦片战争中惨败，暴露了军事和科技上的落后。魏源所关注的“长技”主要指西方的军事技术（如船坚炮利）及相关科学技术，而非思想文化、教育制度或政治体制。因此，“夷长技”主要指<strong>军事和科学技术</strong>，对应选项C。</p><p>其他选项分析：</p><ul><li>A项“宗教的思想文化”并非魏源强调的重点；</li><li>B项“教育和人才培养”在《海国图志》中有所提及，但非“长技”核心；</li><li>D项“民主和政治制度”在魏源时代尚未成为主流学习对象。</li></ul><p>综上，本题正确答案为C。</p>
