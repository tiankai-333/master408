<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>我国宪法是国家的根本大法，具有最高法律效力。宪法中明确“国家尊重和保障人权”，确立了人权保障的基本原则和框架，其他法律、行政法规、司法活动等都须以宪法为依据。因此，宪法保障是人权保障的<strong>前提和基础</strong>，为人权的立法、行政和司法保障提供根本法律依据。<br/>A项“最后防线”一般对应司法保障；<br/>B项“重要条件”和C项“关键环节”虽与人权保障相关，但并非对宪法保障的准确表述。<br/>故本题正确答案为 <strong>D</strong>。
