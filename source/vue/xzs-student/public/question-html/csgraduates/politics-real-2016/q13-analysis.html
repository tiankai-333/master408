<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>题干明确指出爱国主义在不同历史时期有不同内涵和特点，新民主主义革命时期和现阶段的表现各有具体内容，这体现了爱国主义随着历史条件变化而变化，是<strong>历史的</strong>；同时它在每一阶段都有明确的行为指向和社会要求，是<strong>具体的</strong>。<br/>A项“主观的、现实的”中“主观”不准确，爱国主义的内涵由社会历史条件客观决定；<br/>C项“客观的、抽象的”错误，爱国主义不是抽象不变的；<br/>D项“客观的、具体的”虽强调客观性和具体性，但未突出历史性，而题干更强调不同时期的演变。<br/>因此，最全面反映题干含义的是 <strong>B. 爱国主义是历史的、具体的</strong>。
