<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>参考 <a href="/constitution_principle/cpu/interrupt/#%e4%b8%ad%e6%96%ad%e5%92%8c%e5%bc%82%e5%b8%b8">中断和异常的区别</a>，内中断是指来自 CPU 和内存内部产生的中断，包括程序运算引起的各种错误，如地址非法、校验错、页面失效、非法指令、用户程序执行特权指令自行中断（INT）和除数为零等，以上中断都在指令的执行过程中产生的，故 A 正确。这种检测异常的工作肯定是由 CPU（包括控制器和运算器）实现的，故 B 正确。内中断不能被屏蔽，一旦出现应立即处理，C 正确。对于 D，考虑到特殊情况，如除数为零和自行中断（INT）都会自动跳过中断指令，所以不会返回到发生异常的指令继续执行，故错误。
