<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>由题中失配 <code>s[i] ≠ s[j]</code> 时，<code>i = j = 5",</code> 可知题中的主串和模式串 的位序都是从 0 开始的（要注意灵活应变）。按照 <code>next</code> 数组生成算法，对于 <code>t</code> 有：</p><table class="table td-initial"><thead><tr><th>编号</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><td>t</td><td>a</td><td>b</td><td>a</td><td>a</td><td>b</td><td>b</td></tr><tr><td>next</td><td>-1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>2</td></tr></tbody></table><p>依据 <a href="/data_structure/strings/match/#kmp-%e7%ae%97%e6%b3%95">KMP 算法</a> “当失配时，<code>i</code> 不变，<code>j</code> 回退到 <code>next[j]</code> 的位置并重新比较”，当失配 <code>s[i] ≠ s[j]</code>时，<code>i=j=5,</code> 由上表不难得出 <code>next[j]=next[5]=2</code>（位序从 0 开始）。从而最后结果应为 <code>i=5</code>（<code>i</code> 保持不变），<code>j=2</code> 。</p>
