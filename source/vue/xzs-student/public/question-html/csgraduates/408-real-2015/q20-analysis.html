<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><a href="/constitution_principle/storage/storage/#%e5%b9%b3%e5%9d%87%e5%ad%98%e5%8f%96%e6%97%b6%e9%97%b4">存取时间</a> = 寻道时间 + 延迟时间 + 传输时间。存取一个扇区的平均延迟时间为旋转半周的时间，即为 (60/7200)/2=4.17ms，传输时间为 (60/7200)/1000=0.01ms，因此访问一个扇区的平均存取时间为 4.17+0.01+8=12.18ms，保留一位小数则为 12.2ms。
