<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p>不考虑确认帧的开销，一个帧发送完后经过一个单程传播时延到达接收方，再经过一个单程传播时延发送方收到应答，从而继续发送。要使得传输效率最大化，就是不用等确认也可以连续发送多个帧。设连续发送 n 个帧，一个帧的发送时延为 1000B/128kbps= 62.5ms。对于采用滑动窗口协议的流水线机制，我们有如下公式：<a href="/computer_network/datalink/flow_control/#%e4%bf%a1%e9%81%93%e5%88%a9%e7%94%a8%e7%8e%87">链路利用率</a> = (n×发送时延)/(RTT+ 发送时延)。</p><p>依题意，有 (n×62.5ms)/(62.5ms+250msx2)≥80%, 得 n≥7.2, 帧序号的比特数 K 需要满足
