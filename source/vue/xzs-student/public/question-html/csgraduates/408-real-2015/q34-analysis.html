<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><a href="/computer_network/physical/encoding/#%e7%bc%96%e7%a0%81%e7%b1%bb%e5%9e%8b">NRZ</a> 是最简单的串行编码技术，用两个电压来代表两个二进制数，如高电平表示 1，低电平表示 0，题中编码 1 符合。NRZI 则是用电平的一次翻转来表示 1，与前一个 NRZI 电平相同的电平表示 0。曼彻斯特编码将一个码元分成两个相等的间隔，前一个间隔为低电平后一个间隔为高电平表示 1；0 的表示正好相反，题中编码 2 符合。
