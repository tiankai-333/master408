<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>向量组线性无关的充分必要条件是其中任意一个向量都不能由其余向量线性表示，因此选项 <strong>C</strong> 是充分条件。</p><ul><li><strong>A</strong> 不是充分条件：所有向量非零时仍可能线性相关，例如二维空间中两个非零但成比例的向量。</li><li><strong>B</strong> 不是充分条件：任意两个向量不成比例时整体仍可能线性相关，例如三维空间中三个向量，其中两个不平行但第三个是前两个的线性组合。</li><li><strong>D</strong> 不是充分条件：部分向量线性无关不能保证整体线性无关，例如二维空间中两个向量，其中一个非零（线性无关），但两个向量成比例时整体线性相关。</li></ul>
