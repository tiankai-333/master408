<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong> CPU响应中断时，必须保存当前程序的执行现场，以便在中断处理结束后能准确恢复原程序的运行。两个最关键的硬件状态是程序计数器（PC）和程序状态字（PSW）。PC存储了下一条要执行的指令地址，保护PC能确保中断返回后继续执行原程序；PSW包含了处理器的状态标志（如条件码、中断使能位等），保护PSW能维持处理器的状态一致性。</p><p>其他选项中，IR（指令寄存器）存放当前指令，但中断响应时通常不保护它，因为中断处理更关注未来执行的地址和整体状态；AR（地址寄存器）用于内存寻址，也不是必须保护的核心状态。因此，选项A正确。</p>
