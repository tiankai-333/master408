<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong>
异步传输方式适用于设备之间速度差异较大或无需共享时钟信号的场景，它通过握手信号（如就绪和确认）来协调数据传输，能有效处理不同速度设备间的通信。</p><p>选项A中，I/O接口与打印机交换信息时，打印机作为典型的慢速外部设备，其工作速度远低于计算机内部总线，采用异步传输可以灵活适应速度不匹配，避免数据丢失或冲突。</p><p>其他选项则更适合同步传输：CPU与主存交换信息需要高速、稳定的时钟同步以保证效率；CPU和PCI总线交换信息通常基于同步时钟设计；选项D直接提及统一时序信号控制，属于典型的同步方式。因此，最应采用异步传输的是A。</p>
