<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong><br/>对于 1K×8 位的 ROM 和 RAM 芯片，存储容量均为 1K 个字，每个字 8 位。<br/>1K 等于 1024，因此地址线需要 10 根（因为
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.8141em"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:.8141em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">10</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">1024</span></span></span></span>
），数据线需要 8 根。<br/>地址与数据引脚的总数为
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.7278em;vertical-align:-.0833em"></span><span class="mord">10</span><span class="mspace" style="margin-right:.2222em"></span><span class="mbin">+</span><span class="mspace" style="margin-right:.2222em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">8</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">18</span></span></span></span>
。<br/>问题中“引脚（含地址与数据）的总数”通常指的是地址和数据引脚的总和，不包括控制引脚等其他引脚。<br/>因此，无论是 ROM 还是 RAM，地址和数据引脚的总数都是 18，与选项 C 相符。
