<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>生成树是无向连通图的一个子图，它包含原图的所有顶点，并且是树结构，因此是无环的连通图。<br/>选项A正确，因为生成树的顶点集和边集都是原图的子集，所以它是原图的子图。<br/>选项B错误，因为连通分量是极大连通子图，即不能再添加任何顶点或边而保持连通。生成树是极小连通子图，不是极大连通子图。对于连通图，其唯一的连通分量是图本身，而生成树是它的一个真子图（除非原图本身就是树），因此生成树不是连通分量。<br/>选项C正确，生成树是极小连通子图，意味着去掉任意一条边都会破坏其连通性，并且顶点集与原图相同（V’=V）。<br/>选项D正确，生成树作为树结构，不包含任何环，因此是无环子图。
