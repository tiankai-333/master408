<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong><br/>“Open”系统调用的主要功能是建立进程与文件之间的连接，为后续读写操作做准备。它并不直接读取文件内容，而是通过解析文件路径、检查权限等步骤，将文件的控制信息（如inode或文件控制块）从外存读入内存，以便操作系统快速管理文件状态和访问权限。</p><p>选项A描述的是“read”调用的功能；选项C中FAT表是文件系统整体结构的一部分，通常在挂载时缓存，而非每次打开文件时单独读取；选项D的超级块包含文件系统全局信息，也是在挂载时加载。因此，只有B准确反映了“Open”的核心作用。</p>
