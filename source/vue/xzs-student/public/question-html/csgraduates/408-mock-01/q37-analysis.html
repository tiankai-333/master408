<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong> 子网掩码 255.255.255.224 对应 CIDR /27，块大小为 32。通过计算每个 IP 地址的网络地址：</p><ul><li>200.10.1.60 与子网掩码 AND 运算后得到网络地址 200.10.1.32；</li><li>200.10.1.65、200.10.1.70 和 200.10.1.75 的网络地址均为 200.10.1.64。</li></ul><p>四台主机应属于同一子网才能直接通信，但 200.10.1.60 的网络地址与其他三台不同，因此该主机因 IP 地址分配不当而存在通信故障。</p>
