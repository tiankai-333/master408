<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong><br/>在虚拟分页存储管理系统中，当进程访问的页面不在主存时，会首先触发缺页中断，这是处理流程的起点。由于主存中没有可用的空闲帧，系统无法直接调入新页面，必须通过页面置换来腾出空间。因此，在缺页中断发生后，系统需要决定淘汰哪个页面（即选择置换页），然后将淘汰的页面调出到磁盘（若被修改则需写回），最后才能将所需的页面从磁盘调入主存中腾出的帧。<br/>选项C的顺序“缺页中断→决定淘汰页→页面调出→页面调入”符合这一逻辑，而其他选项或颠倒了中断触发时机，或在无空闲帧时错误地先执行页面调入，因此不正确。
