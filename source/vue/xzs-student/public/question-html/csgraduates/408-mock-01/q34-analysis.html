<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>选项A错误，因为电路交换确实是物理线路交换，但虚电路交换是逻辑连接，且一条物理线路可以支持多条虚电路（即多个逻辑连接），而非仅一条。<br/>选项B不准确，虚电路分为永久虚电路（PVC）和交换虚电路（SVC），其中SVC是临时连接，会话结束释放，但PVC是永久性的，不随会话结束释放。<br/>选项C错误，数据报服务不提供可靠传输，也不保证分组有序到达，分组可能丢失、重复或乱序。<br/>选项D正确，在数据报服务中，每个分组独立路由，必须携带源地址和目的地址，以便网络设备进行转发。
