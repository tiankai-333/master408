<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong> 在计算机系统中，程序计数器（PC）专门用于存储下一条要执行指令的地址。指令的取指阶段总是基于PC的当前值从主存中读取指令，这是冯·诺依曼架构的基本工作原理。即使遇到转移指令（如跳转或分支），也是先将计算出的目标地址加载到PC中，然后继续根据更新后的PC读取指令，因此指令读取始终依赖于PC。</p><p>其他选项中，B提到“有时根据转移指令”不正确，因为转移指令仅修改PC的值，不直接作为读取地址的来源；C和D涉及地址寄存器，但地址寄存器通常用于数据访问或特定寻址模式，并非指令读取的常规依据。因此，A是唯一准确的描述。</p>
