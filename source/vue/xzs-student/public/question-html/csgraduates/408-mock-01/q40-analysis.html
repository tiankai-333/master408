<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong> DNS（域名系统）的核心功能是将域名解析为IP地址，其组成包括域名空间、分布式数据库和域名服务器。域名空间（Ⅰ）定义了域名的层次结构；分布式数据库（Ⅱ）存储了全球的域名与IP地址映射关系，并以分布式方式部署；域名服务器（Ⅲ）是运行DNS服务的实体，负责处理查询请求。</p><p>选项Ⅳ描述的是“从内部IP地址到外部IP地址的翻译程序”，这实际指的是NAT（网络地址转换）技术，用于在私有网络和公共网络之间转换IP地址，属于网络层功能，与DNS的域名解析无关，因此不属于DNS的组成部分。故正确答案为B，即Ⅰ、Ⅱ和Ⅲ。</p>
