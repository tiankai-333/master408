<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>二进制指数后退算法在以太网中用于处理介质访问冲突。当冲突发生时，发送方会根据冲突次数 k，从 0 到 2^k - 1 个时间槽中随机选择一个值作为退避时间。随着冲突次数增加，退避时间区间呈指数增长，这意味着在网络负载较高、冲突频繁时，发送方会等待更长时间再重发，从而降低再次冲突的概率。</p><p>这种设计使算法能够动态适应网络负载：负载越重，冲突越多，退避时间越长，有效缓解拥塞。因此，算法的主要好处是考虑了网络负载对冲突的影响。选项 A 和 B 并非算法的核心优势；选项 D 不准确，因为算法参数（如时间槽）与网络规模（如传播延迟）相关，但算法重点在于负载自适应。</p>
