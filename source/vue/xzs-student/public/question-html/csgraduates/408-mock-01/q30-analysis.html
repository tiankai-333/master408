<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong> 本题考查文件系统的多个知识点。文件系统使用文件名进行管理，也实现了文件名到物理地址的转换，A 错误。在多级目录结构中，从根目录到任何数据文件都只有一条唯一的路径，该路径从树根开始，把全部目录文件名和文件名依次用“/”连接起来，即构成该数据文件的路径名。B 的说法不准确，对文件的访问只需通过路径名即可。文件被划分的物理块的大小是固定的，通常和内存管理中的页面大小一致，C 错误。逻辑记录是文件中按信息在逻辑上的独立含义来划分的信息单位，它是对文件进行存取操作的基本单位，D 正确。
