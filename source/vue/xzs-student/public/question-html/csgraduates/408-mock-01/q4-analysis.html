<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong> 在二叉排序树中，关键字值最大的结点位于树的最右侧，这是由二叉排序树的性质决定的：对于任意结点，其左子树中的所有结点关键字值均小于该结点，右子树中的所有结点关键字值均大于该结点。因此，从根结点开始一直向右遍历，直到没有右子结点时，所到达的结点即为最大值结点。由于该结点没有右子结点，其右指针一定为空。</p><p>左指针的情况则不确定：最大值结点可能有左子树（此时左指针不为空），也可能没有左子树（此时左指针为空），但这并不影响其作为最大值结点的特性。选项A、C、D均不能准确描述最大值结点的指针状态，故选项B正确。</p>
