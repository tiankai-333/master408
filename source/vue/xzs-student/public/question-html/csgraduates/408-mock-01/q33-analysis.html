<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>【解析】</strong> 在不同网络结点的对等层之间通信需要使用对等层协议。对等层协议定义了同一层在不同节点上的实体之间通信的规则、格式和语义，例如OSI模型或TCP/IP模型中各层的协议（如传输层的TCP、网络层的IP），确保对等层实体能够正确交换信息并实现网络功能。</p><p>其他选项中，模块接口通常指软件内部组件之间的调用接口，不直接涉及网络对等层通信；服务原语是同一节点内相邻层之间交互的接口，用于上层调用下层提供的服务，属于层间通信而非对等层通信；电信号是物理层传输的介质信号（如电压、光信号），属于通信的物理实现基础，但不是对等层通信所需的逻辑机制。</p>
