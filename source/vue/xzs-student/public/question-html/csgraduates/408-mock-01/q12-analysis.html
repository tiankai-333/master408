<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong> 有效 CPI（每条指令的时钟周期数）可以根据处理速率（MIPS）和时钟频率（f）的关系计算。公式为：MIPS = f（MHz）/ CPI。给定 f = 15 MHz，处理速率为 10 MIPS，代入公式得 CPI = 15 / 10 = 1.5。</p><p>问题中提到的访存信息（平均每条指令 1 次访存，每次访存 1 周期延迟）是背景条件，但处理速率 10 MIPS 是实际测量值，已经包含了所有延迟效果，因此直接使用公式计算出的 CPI 即为有效 CPI，无需额外调整。计算结果显示 CPI 为 1.5，对应选项 C。</p>
