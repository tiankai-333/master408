<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>在构造二叉排序树时，序列A、B、D生成的树结构相同，而序列C生成的左子树结构不同，具体如下：</p><ul><li>A、B、D的树结构为：</li></ul><pre tabindex="0"><code>        100
       /   \
      80    120
     / \    / \
    60  90 110 130
</code></pre><ul><li>C的树结构为：</li></ul><pre tabindex="0"><code>        100
       /   \
      60    120
        \    / \
         80 110 130
          \
           90
</code></pre><p>因此，与其他三个序列所构造的结果不同的是C。</p>
