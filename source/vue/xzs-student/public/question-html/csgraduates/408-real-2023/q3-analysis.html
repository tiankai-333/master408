<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>存储稀疏矩阵 M，<a href="/data_structure/array/matrix/#%e4%b8%89%e5%85%83%e7%bb%84%e8%a1%a8">三元组表</a> 的表项存储了行 row、列 col、值 value 三种信息，除此之外，我们还需要知道矩阵 M 的规模 rows × cols，即 M 的行数 rows 和 M 的列数 cols，这个信息应该直接给出。当我们需要某个位置的元素，可以先根据 M 的行数和列数判断是否越界，如果没有越界，在三元组进行查找，如果三元组没有保存对应位置的值代表矩阵中该位置的值为 0。本题答案选 A。
