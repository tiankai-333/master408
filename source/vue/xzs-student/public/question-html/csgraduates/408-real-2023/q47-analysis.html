<p>1）FTP 的控制连接是持久的；数据连接是非持久的；H 登录 FTP 服务器时，建立的 TCP 连接是控制连接。</p><p>2）F 的第 1 个字节的序号是 101；第二次挥手 ACK 段的确认序号是 18102。</p><p>3）当 H 收到确认序号为 2101 的确认段时，H 的拥塞窗口调整为 3MSS；收到确认序号为 7101 的确认段时，H 的拥塞窗口调整为 5MSS。</p><p>4）H 从请求建立数据连接开始，到确认 F 已被服务器全部接收为止，至少需要 6RTT=6*10ms=60ms；期间应用层数据平均发送速率是 18000B/60ms=300*10³B/s=0.3MB/s=2.4Mb/s。</p>
