<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>主要考察双链表的插入操作，解决这类问题可在纸上画出具体的双链表进行模拟。因为 <code>s-&gt;next</code> 已经赋值为 <code>p</code> 的后一个结点，同时 <code>p-&gt;next</code> 指针已经赋值为 <code>s</code>。所以只需要处理<code>s-&gt;next-&gt;prev</code> 和 <code>s-&gt;next-&gt;prev</code> 的赋值，<code>s-&gt;prev</code> 需要指向 <code>p</code>，<code>s-next-&gt;prev</code> 需要指向 <code>s</code>。因为<code>p-&gt;next</code> 和 <code>s</code> 指向同一个结点，所以可以用 <code>p-&gt;next</code> 代表 <code>s</code>。故本题的正确选项为 C。
