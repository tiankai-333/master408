<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>机器数是计算机内部用来表示和存储数值的二进制形式。对于有符号的 short 型变量，
通常采用 16 位 <a href="/constitution_principle/representation/integer/#%e8%a1%a5%e7%a0%81%e8%a1%a8%e7%a4%ba">补码</a> 表示法。对于给定的 short 型变量 x=-8190，我们需要将其转换为二进制的补码表示。首先，将数值 8190 转换为二进制形式：8190 = 0001 1111 1111 1110B，然后取其二
进制补码（负数取反后加 1），补码为 1110 0000 0000 0010B，转化为 16 进制为 E002H。因此
正确选项为 A。
