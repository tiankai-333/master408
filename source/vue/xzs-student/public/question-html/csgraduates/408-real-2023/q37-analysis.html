<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>在 <a href="/computer_network/datalink/error/#%e5%be%aa%e7%8e%af%e5%86%97%e4%bd%99%e7%a0%81">循环冗余码</a> 中：</p><blockquote><p>若接收端将接收到的比特串除以 G(x)，余数为 0，则认为“未发生错误”。</p></blockquote><p>即，我们要对每一个选项做模 2 除法（异或除法），看余数是否为 0。</p><p>经过计算，可以得到 D 选项余数为 0，所以答案选择 D。</p>
