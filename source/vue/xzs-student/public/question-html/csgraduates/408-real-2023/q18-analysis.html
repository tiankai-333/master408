<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><a href="/constitution_principle/cpu/structure/#%e7%bb%84%e5%90%88%e9%80%bb%e8%be%91%e5%85%83%e4%bb%b6">组合逻辑元件</a> 是那些仅由组合逻辑电路组成的元件，其输出仅取决于当前的输入，而不受存储器或时钟信号的影响。算术逻辑部件 ALU 和多路选择器 MUX 都属于组合逻辑元件，它们的输出仅由当前输入决定。</p><p>程序计数器 PC 和通用寄存器是时序逻辑元件，也称为状态元件。它们的输出不仅取决于当前输入，还受存储器或时钟信号的影响，并且具有状态或存储功能。因此本题选 B。</p>
