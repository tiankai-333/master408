<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/constitution_principle/cpu/interrupt/#%e5%bc%82%e5%b8%b8">异常</a>通常指内部中断，是指令执行错误或中断指令产生的内部中断，在指令执行过程
中被检测，因此选项 A 正确。外部中断指硬件中断，在指令执行完毕后，CPU 会检查中断请
求信号，如果有中断请求发生，则进行中断响应，暂停当前的任务，保存现场并处理中断，因
此，选项 B，C 正确。外部设备通过中断控制器向 CPU 发出中断请求信号而不是中断结束信
号，选项 D 错误。
