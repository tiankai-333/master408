<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>在私有制商品经济中，复杂劳动与简单劳动的换算并非由任何个人、组织或协商预先确定。商品生产者无法直接计算不同种类劳动的具体比例，市场管理部门也不会事先规定，因为劳动复杂程度的比较是在市场竞争和交换中通过价值规律自发形成的。具体来说，在商品交换过程中，不同生产者生产的商品在市场上反复比较、竞争，市场机制（如供求关系、价格波动等）自发地将复杂劳动折算为多倍的简单劳动，这一过程是自发的、非人为设计的。因此，正确选项为 <strong>D</strong>。
