<strong>正确答案：<span class="correct-answer-text">ACD</span></strong><br/><p><strong>【解析】</strong></p><ol><li>嫦娥四号于2019年1月3日成功着陆月球背面，这是人类历史上探测器首次在月球背面实现软着陆，因此 <strong>A项正确</strong>。</li><li>我国太空站建设的序幕以天宫空间站任务为标志，与嫦娥四号月球探测任务无关，故 <strong>B项错误</strong>。</li><li>嫦娥四号通过“鹊桥”中继星实现了月球背面与地球之间的通信，这是首次地月中继通信任务，因此 <strong>C项正确</strong>。</li><li>嫦娥四号任务突破了月背探测的技术难题，在人类月球探测史上具有里程碑意义，被认为开启了人类月球探测的新篇章，故 <strong>D项正确</strong>。<br/>综上，本题答案为 <strong>A、C、D</strong>。</li></ol>
