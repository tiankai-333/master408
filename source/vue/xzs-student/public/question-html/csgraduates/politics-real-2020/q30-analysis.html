<strong>正确答案：<span class="correct-answer-text">ABCD</span></strong><br/><p><strong>【解析】</strong><br/>本题主要考查对《新时代公民道德建设实施纲要》中重点任务的理解。根据《纲要》内容，新时代公民道德建设的重点任务包括：</p><ol><li><strong>筑牢理想信念之基</strong>（对应选项C），强调坚持共产主义远大理想和中国特色社会主义共同理想；</li><li><strong>培育和践行社会主义核心价值观</strong>（对应选项B），将其融入道德建设各方面；</li><li><strong>传承中华传统美德</strong>（对应选项A），推动创造性转化和创新性发展；</li><li><strong>弘扬民族精神和时代精神</strong>（对应选项D），增强全民族的精神凝聚力。<br/>这四项任务共同构成了新时代公民道德建设的核心内容，因此正确答案为ABCD。</li></ol>
