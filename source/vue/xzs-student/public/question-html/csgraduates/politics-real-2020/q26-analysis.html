<strong>正确答案：<span class="correct-answer-text">ACD</span></strong><br/><p><strong>【解析】</strong><br/>本题考察对“一国两制”原则底线的理解。根据“一国两制”方针和香港特别行政区基本法，维护国家主权、安全和发展利益是最高原则。具体而言：</p><ul><li><strong>A项正确</strong>：危害国家主权安全直接动摇“一国”根本，是绝对不能触碰的底线。</li><li><strong>B项错误</strong>：干扰民间交流虽应避免，但不属于涉及国家根本原则的底线问题，而是社会交往层面的问题。</li><li><strong>C项正确</strong>：挑战中央权力与基本法权威，实质是否定“一国两制”的制度根基，必须坚决禁止。</li><li><strong>D项正确</strong>：利用香港对内地进行渗透破坏，危害国家安全和领土完整，触及底线。</li></ul><p>综上，本题答案为<strong>ACD</strong>。</p>
