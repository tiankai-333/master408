<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>领导人在2019年9月20日的讲话中明确指出：“新时代加强和改进人民政协工作，要把坚持和发展中国特色社会主义作为巩固共同思想政治基础的主轴，把服务实现‘两个一百年’奋斗目标作为工作主线，把加强思想政治引领、广泛凝聚共识作为中心环节。”因此，新时代做好人民政协工作的中心环节是<strong>加强思想政治引领，广泛凝聚共识</strong>。选项A、C、D均是人民政协工作的重要方面，但不是讲话中明确的“中心环节”。故本题正确答案为B。
