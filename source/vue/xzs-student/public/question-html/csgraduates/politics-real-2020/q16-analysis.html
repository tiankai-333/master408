<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong><br/>美国退出《中导条约》的直接借口是指责俄罗斯违约（对应选项A），但这并非其“真实原因”。条约本身旨在限制美俄中程导弹，维持战略平衡（选项B），但美国认为条约限制了自身发展中程导弹的能力，而其他拥有中程导弹的国家（如中国）却不受条约约束（选项D）。然而，从美国后续迅速推进中程导弹研发部署等行动可以看出，其根本目的是摆脱条约束缚，通过发展中导力量强化对潜在对手的军事威慑，从而谋求绝对军事优势。因此，真实原因是“自我松绑，谋求绝对军事优势”，选项C正确。
