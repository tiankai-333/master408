<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong><br/>1905年至1907年，以孙中山为代表的资产阶级革命派与以康有为、梁启超为代表的资产阶级改良派（保皇派）展开了一场思想论战。论战主要围绕以下三个核心问题展开：</p><ol><li><strong>要不要以革命手段推翻清王朝</strong>（焦点问题）；</li><li><strong>要不要推翻帝制，实行共和</strong>；</li><li><strong>要不要进行社会革命（平均地权）</strong>。</li></ol><p>其中，<strong>第一个问题是双方论战的焦点</strong>，因为改良派主张通过君主立宪、和平改良来挽救国家，反对暴力革命；而革命派则认为清王朝已沦为帝国主义统治中国的工具，必须通过革命手段彻底推翻。这一分歧直接决定了双方政治道路的根本对立，因此正确答案为 <strong>A</strong>。</p>
