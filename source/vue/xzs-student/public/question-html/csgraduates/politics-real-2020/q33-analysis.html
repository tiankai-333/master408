<strong>正确答案：<span class="correct-answer-text">ABCD</span></strong><br/><p><strong>【解析】</strong><br/>本题涉及2019年中俄建交70周年之际，领导人在纪念大会上对“新时代的中俄关系”提出的主张。根据公开的讲话内容，其核心主张包括：</p><ol><li><strong>始终以互信为基石，巩固彼此战略依托</strong>（对应选项A）；</li><li><strong>着力深化利益交融，拉紧共同利益纽带</strong>（对应选项B）；</li><li><strong>促进民心相通，夯实世代友好的民意基础</strong>（对应选项C）；</li><li><strong>要更加担当有为，携手维护世界和平安宁</strong>（对应选项D）。<br/>以上四点完整构成了讲话中对新时代中俄关系的主张，因此正确答案为ABCD。</li></ol>
