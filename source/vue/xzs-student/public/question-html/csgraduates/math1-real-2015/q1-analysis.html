<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p>对于连续函数的曲线而言，拐点处的二阶导数等于零或者不存在。</p><p>从图上可以看出有两个二阶导数等于零的点，以及一个二阶导数不存在的点
