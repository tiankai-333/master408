<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><a href="/operating_system/memory/management/#lru">LRU</a> 每次执行页面置换时会换出最近最久没有使用过的页面。第一次访问 5 页面时，会把最久未被使用的 1 页面换出，第一次访问 3 页面时，会把最久未访问的 2 页面换出。具体的页面置换情况如下图所示：</p><table class="table td-initial"><thead><tr><th>访问页面</th><th>0</th><th>1</th><th>2</th><th>7</th><th>0</th><th>5</th><th>3</th><th>5</th><th>0</th><th>2</th><th>7</th><th>6</th></tr></thead><tbody><tr><td>物理块</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>物理块</td><td></td><td>1</td><td>1</td><td>1</td><td>1</td><td>5</td><td>5</td><td>5</td><td>5</td><td>5</td><td>5</td><td>6</td></tr><tr><td>物理块</td><td></td><td></td><td>2</td><td>2</td><td>2</td><td>2</td><td>3</td><td>3</td><td>3</td><td>3</td><td>7</td><td>7</td></tr><tr><td>物理块</td><td></td><td></td><td></td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>2</td><td>2</td><td>2</td></tr><tr><td>缺页否</td><td>√</td><td>√</td><td>√</td><td>√</td><td></td><td>√</td><td>√</td><td></td><td></td><td>√</td><td>√</td><td>√</td></tr></tbody></table><p>需要注意的是：题中问的是页置换算法，而不是缺页次数，所以前 4 次缺页未还也的操作不考虑在内，答案为 5 次，故选 C。</p>
