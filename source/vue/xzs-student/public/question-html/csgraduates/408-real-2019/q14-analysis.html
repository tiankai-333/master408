<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>在请求分页系统中，每当要访问的页面不在内存中时，CPU 检测到异常，便会产生 <a href="/constitution_principle/storage/virtual/#%e7%bc%ba%e9%a1%b5%e4%b8%ad%e6%96%ad">缺页中断</a>，请求操作系统将所缺的页调入内存。缺页处理由缺页中断处理程序完成，根据发生缺页故障的地址从外存读入所缺失的页，鋏页处理完成后回到发生缺页的指令继续执行。选项 D 中描述回到发生缺页的指令的下一条指令执行，明显错误，所以选 D。
