<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>本题考察 <a href="/operating_system/process/deadlock/">死锁</a> 相关知识。剥夺进程资源，将其分配给其他死锁进程，可以解除死锁，Ⅰ正确。死锁预防是死锁处理策略（死锁预防、死锁避免、死锁检测）中最为严苛的一种策略，破坏死锁产生的 4 个必要条件之一。可以确保系统不发生死锁，Ⅱ正确。银行家算法是一种死锁避免算法，用于计算动态资源分配的完全性以避免系统进入死锁状态，不能用于判断系统是否处于死锁，Ⅲ错误。通过简化资源分配图可以检测系统是否为死锁状态，当系统出现死锁时，资源分配图不可完全简化。只有两个成两个以上的进程才会出现“环”而不能被简化，Ⅳ正确。
