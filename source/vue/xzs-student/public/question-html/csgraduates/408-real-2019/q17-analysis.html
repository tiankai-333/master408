<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>该指令的两个源操作数分别采用 <a href="/constitution_principle/instruction/format/#%e5%af%84%e5%ad%98%e5%99%a8%e5%af%bb%e5%9d%80">寄存器寻址</a> 和 <a href="/constitution_principle/instruction/format/#%e5%af%84%e5%ad%98%e5%99%a8%e9%97%b4%e6%8e%a5%e5%af%bb%e5%9d%80">寄存器间接寻址</a>，因此在取数阶段需要用到通用寄存器组和存储器；在执行阶段，两个源操作数相加需要用到算术逻辑单元；而指令译码器用于操作码字段进行译码，向控制器提供特定的操作信号，在取数及执行阶段用不到，所以答案选 B。
