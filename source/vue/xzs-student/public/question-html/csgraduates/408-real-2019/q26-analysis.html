<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>传统的文件系统 <a href="/operating_system/files/file_system/#%e5%a4%96%e5%ad%98%e7%a9%ba%e9%97%b2%e7%ae%a1%e7%90%86">管理空间磁盘的方法</a> 包括空闲表法、空闲链表法、位示图和成组链接法，Ⅰ、Ⅲ 正确。文件分配表（FAT）的表项与物理磁盘块一一对应，并且可以用一个特殊的数字 -1 表示文件的最后一块，用 -2 表示这个磁盘块是空闲的（当然，规定用 -3、-4 来表示也是可行的）。因此文件分配表（FAT）不仅记录了文件中各个块的先后链接关系，同时还标记了空闲的磁盘块，操作系统可以通过 FAT 对文件存储空间进行管理，Ⅳ正确。索引结点是操作系统为了实现文件名与文件信息分开而设计的数据结构，存储了文件描述信息，索引结点属于文件目录管理部分的内容，Ⅱ错误。
