<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>应用程序没有进行线程管理的代码，只有一个到内核级线程的编程接口，内核为进程及其内部的每个线程维护上下文信息，调度也是在内核中由操作系统完成的，选项 A 正确。在多线程模型中，<a href="/operating_system/process/process_thread/#%e7%94%a8%e6%88%b7%e7%ba%a7%e7%ba%bf%e7%a8%8b%e5%92%8c%e5%86%85%e6%a0%b8%e7%ba%a7%e7%ba%bf%e7%a8%8b">用户级线程和内核级线程</a> 的连接方式分为多对一、一对一、多对多，“操作系统为每个用户线程建立一个线程控制块”属于一对一模型，选项 B 错误。用户级线程的切换可以在用户空间完成，内核级线程的切换需要操作系统帮助进行调度，故用户级线程的切换效率更高，选项 C 正确。用户级线程的管理工作可以只在用户空间中进行，故可以在不支持内核级线程的操作系统上实现，选项 D 正确。
