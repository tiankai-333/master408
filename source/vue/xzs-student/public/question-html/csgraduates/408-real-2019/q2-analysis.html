<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p>本第一步，需要知道如何将一棵 <a href="/data_structure/tree/tree/#%e6%a0%91%e8%bd%ac%e5%8c%96%e4%b8%ba%e4%ba%8c%e5%8f%89%e6%a0%91">树转化为二叉树</a>：对于每一个结点，第一个孩子结点放左子树，其余孩子结点（即第一个孩子结点的兄弟结点）放在第一个孩子结点的右子树，其余的孩子结点再依次放在右子树的右子树，依次类推。</p><p>第二步，需要知道选项中的四种遍历方式先序遍历：该结点，左子树，右子树中序遍历：左子树，该结点，右子树后序遍历：左子树，右子树，该节点层次遍历：队列实现前 3 种遍历方式，左子树都是先于右子树，“先”、“中”、“后”指的是访问该结点的次序，对于上图，我们发现，对树的后序遍历与对二叉树的中序遍历相同，选 B。</p>
