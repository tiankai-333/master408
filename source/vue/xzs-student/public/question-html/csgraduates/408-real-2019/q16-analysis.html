<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/constitution_principle/overview/performance/#%e8%84%89%e5%86%b2%e4%bf%a1%e5%8f%b7">时钟脉冲信号</a> 的宽度称为 <a href="/constitution_principle/overview/performance/#%e6%97%b6%e9%92%9f%e5%91%a8%e6%9c%9f">时钟周期</a>，时钟周期是 CPU 工作的最小时间单位，时钟周期的倒数为机器主频。时钟脉冲信号是由机器脉冲源发出的脉冲信号经整形和分频后形成的，时钟周期以相邻状态单元间组合逻辑电路的最大延迟为基准确定。CPU 从内存中取出并执行一条指令所需的全部时间称为指令周期，指令周期又由若干机器周期来表示，一个机器周期又包含若干时钟周期，选项 D 显然错误。
