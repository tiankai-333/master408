<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>构造 <a href="/data_structure/search/hash/#%e6%95%a3%e5%88%97%e8%a1%a8">散列表</a> 只有当遇到关键字为空的地址时才会查找失败，key%7 之后，初始地址只可能在 0~6，所以即 0~6 到空地址的距离求平均，即为查找失败的平均查找长度初始地址是 0 的失败查找长度为 9，同理得初始地址为 1，2，3，4，5，6 的失败查找长度为 8，7，6，5，4，3，(9+8+7+6+5+4+3)/7 = 6 答案是 C。
