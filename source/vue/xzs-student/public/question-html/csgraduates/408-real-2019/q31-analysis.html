<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p>题中给出的是十六进制地址，首先将它转化为二进制地址，然后用二进制地址去匹配题中对应的地址结构。转换为进制地址和地址结构的对应关系如下所示。</p><p>2050 1225H = 0010 0000 01010000 00010010 00100101</p><p>前 10 位、11<del>20 位、21</del>32 位分别对应页目录号、页号和页内偏移。把页目录号、页号单独拿出，转换为十六进制时缺少的位数在高位补零，0000 1000 0001、0001 0000 0001 分别对应 081H、101H，选项 A 正确。</p>
