<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>unsigned short 类型为 <a href="/constitution_principle/representation/integer/#%e6%97%a0%e7%ac%a6%e5%8f%b7%e6%95%b0">无符号</a> 短整型，长度为 2 字节，因此 unsigned short usi 转换为二进制代码即 1111 1111 1111 1111。short 类型为短整型，长度为 2 字节，在采用 <a href="/constitution_principle/representation/integer/#%e8%a1%a5%e7%a0%81%e8%a1%a8%e7%a4%ba">补码</a> 的机器上 short si 的二进制代码为 1111 1111 1111 1111，因此 si 的值为 -1，所以选 A。
