<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>本题考察 <a href="/operating_system/memory/concepts/#%e6%ae%b5%e5%bc%8f%e7%ae%a1%e7%90%86">段式管理</a>。段的共享是通过两个作业的段表中相应表项指向被共享的段的同一个物理副本来实现的，因此在内存中仅保存一份段 s 的内容。选项 A 正确。段 S 对于进程 P1，P2 来说，使用位置可能不同，所以在不同进程中的逻辑段号可能不同，选项 B 错误。段表项存放的是段的物理地址，对于共享段 S 来说物理地址唯一，选项 C 正确。为了保证进程可以顺利使用段 S，段 S 必须确保在没有任何进程使用它后才能被删除，选项 D 正确。
