<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/>每类设备都配置一个<a href="/operating_system/io_device/devices/#%e8%ae%be%e5%a4%87%e9%a9%b1%e5%8a%a8%e7%a8%8b%e5%ba%8f">设备驱动程序</a>，设备驱动程序向上层用户程序提供一组标准接口，负责实现对设备发出各种具体操作指令，用户程序不能直接和 DMA 打交道。<a href="/constitution_principle/bus/io/#dma-%e6%96%b9%e5%bc%8f">DMA</a> 的数据传送过程分为预处理、数据传送和后处理 3 个阶段。预处理阶段由 CPU 完成必要的准备工作，数据传送前由 DMA 控制器请求总线使用权；数据传送由 DMA 控制器直接控制总线完成；传送结束后，DMA 控制器向 CPU 发送中断请求，CPU 执行中断服务程序做 DMA 结束处理。
