<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>设备接口中的数据缓冲寄存器为 32 位，即一次 <a href="/constitution_principle/bus/io/#%e7%a8%8b%e5%ba%8f%e4%b8%ad%e6%96%ad%e6%96%b9%e5%bc%8f">中断</a> 可以传输 4B 数据，设备数据传输率为 50kB/s，共需要 12.5k 次中断，每次中断开销为 1000 个时钟周期，CPU 频为 1GHz，则 CPU 用于该设备输入/输出的时间占整个 CPU 时间的百分比最多是 (12.5k×1000)/1G=1.25%。
