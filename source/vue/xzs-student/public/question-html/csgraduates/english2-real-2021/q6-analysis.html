<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>解析：</strong></p><p>第 6 题所在段落描述了伦敦公交车司机的情况：</p><ul><li>人们抱怨公交车不准时、班次少。</li><li>于是增加了公交车和公交专用道，并根据司机所用时间对他们进行奖励或惩罚。</li><li>司机们实现了“目标”，但撞到骑车人的情况增加了。</li></ul><p>由此可知，这里设定的“目标”是<strong>准时</strong>，即 <strong>punctuality</strong>。<br/>其他选项：</p><ul><li>B. hospitality（好客）与公交运营无关</li><li>C. competition（竞争）不是这里强调的核心目标</li><li>D. innovation（创新）也不符合上下文</li></ul><p>因此正确答案是 <strong>A. punctuality</strong>。</p>
