<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><strong>解析：</strong></p><ol><li>第一句说“为员工设定目标并不难”，第二句说“理解其负面后果要困难得多”。</li><li>两句之间是<strong>转折关系</strong>，而不是因果、递进或重复。</li><li><strong>however</strong> 表示“然而”，用于引出与前面相反或对比的意思，符合语境。</li><li>其他选项：<ul><li>A. therefore 因此（因果）</li><li>C. again 再次（重复）</li><li>D. moreover 而且（递进）<br/>均不符合逻辑。</li></ul></li></ol><p><strong>答案：B. however</strong></p>
