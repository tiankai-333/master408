<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 本题考查系统抖动。要通过对存储分配的理解来推断系统是否会发生抖动，所以本题同时也需要了解不同的存储分配方案的内容。抖动现象是指刚刚被换出的页很快又要被访问，为此，又要换出其他页，而该页又很快被访问，如此频繁地置换页面，以致大部分时间都花在页面置换上。对换的信息量过大，内存容量不足不是引起系统抖动现象的原因，而选择的置换算法不当才是引起抖动的根本原因，例如，先进先出算法就可能会产生抖动现象。本题中只有虚拟页式和虚拟段式才存在换入换出的操作，简单页式和简单段式因已经全部将程序调入内存，因此不需要置换，也就没有了抖动现象。这里需要注意简单式和虚拟式的区别。
