<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong> 在简单停止 - 等待协议中，发送方每发送一帧后必须等待接收方的确认，才能发送下一帧。这种机制容易因确认帧丢失或延迟而产生重复帧问题：当确认丢失时，发送方超时重传原帧，接收方可能再次收到相同帧，若无区分机制，会导致数据重复处理。</p><p>帧序号通过为每个帧分配唯一标识（通常使用 1 位序号，如 0 和 1 交替），使接收方能够检查序号并识别重复帧，从而丢弃它们。定时器主要用于触发超时重传，但可能引入重复帧；ACK 机制用于确认正确接收，不直接防止重复；NAK 机制用于报告错误，与重复帧无关。因此，帧序号是解决重复帧问题的核心。</p>
