<p>（9 分）主机 A 向主机 B 连续发送了 3 个 TCP 报文段。第 1 个报文段的序号为 90，第 2 个报文段的序号为 120，第 3 个报文段的序号为 150。请回答：</p>
<p>(1) 第 1、2 个报文段携带了多少字节的数据？<br/>(2) 主机 B 收到第 2 个报文段后，发回的确认中的确认号应该是多少？<br/>(3) 如果主机 B 收到第 3 个报文段后，发回的确认中的确认号是 200，试问 A 发送的第 3 个报文段中的数据有多少字节？<br/>(4) 如果第 2 个报文段丢失，而其他两个报文段正确到达了主机 B，那么主机 B 在第 3 个报文段到达后，发往主机 A 的确认报文中的确认号应该是多少？</p>
