<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p><strong>【解析】</strong> 通道方式的工作过程中，CPU 首先根据 I/O 请求编制通道程序，为通道提供具体的操作指令。接着，CPU 执行启动指令，将通道程序地址传递给通道并启动它。通道被启动后，独立执行通道程序，组织实际的 I/O 操作，例如控制设备进行数据传输。最后，当 I/O 操作完成时，通道向 CPU 发出中断请求，通知 CPU 操作结束。</p><p>因此，步骤的正确顺序是：编制通道程序（③）→启动 I/O 通道（④）→组织 I/O 操作（①）→向 CPU 发出中断请求（②），对应选项 D。其他选项的顺序不符合通道工作流程，例如中断请求应在操作完成后发出，而不是在开始阶段。</p>
