<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><p><strong>【解析】</strong> 在 OSI 参考模型中，服务访问点（SAP）是相邻协议层之间的逻辑接口，用于标识上层实体访问下层服务的点。数据链路层的 SAP 通常对应 MAC 地址，因为该层使用 MAC 地址在局域网中唯一标识设备以实现帧的传输。题目中的目的地址“0x000F781C6001”是一个 48 位的十六进制数，格式符合标准 MAC 地址（如 00:0F:78:1C:60:01），因此它属于数据链路层的服务访问点。</p><p>网络层的 SAP 是 IP 地址，传输层的 SAP 是端口号，应用层的 SAP 是高层协议标识，均与 MAC 地址的格式和用途不符。故该地址对应数据链路层。</p>
