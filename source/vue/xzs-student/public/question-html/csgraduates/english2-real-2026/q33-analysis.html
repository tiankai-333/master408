<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 根据原文第五段，运输经济学家Andrea Giuricin明确指出“lack of capacity is another problem”，并解释由于系统是混合的且没有备用容量，一旦线路出现小问题，整个高速网络就会受到严重影响。这直接对应选项C“其有限容量”。其他选项中，A“复杂列车时刻表”原文未提及；B“投资短缺”与原文第四段所述的大规模投资计划矛盾；D“其巨大规模”未在文中作为中断原因出现。因此，C是正确选项。
