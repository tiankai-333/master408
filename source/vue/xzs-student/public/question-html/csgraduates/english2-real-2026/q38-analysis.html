<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 根据第三段，芝加哥的街头节日被描述为“经济引擎”，能直接惠及所在社区和整个城市，并带动当地商业的人流，这表明它们对当地经济有积极贡献。第四段虽然主要讨论节日的资金来源（非政府资助），但并未否定其经济作用，反而通过对比强调了社区节日的独特性。选项A（缓解城市生活方式）在文中未提及；选项B（政府资助）与第四段“没有城市资金”相矛盾；选项D（以音乐表演闻名）并非第三、四段的重点，这些段落更强调经济和文化影响而非具体表演内容。因此，选项C正确反映了文意。
