<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 根据原文第七段，RFI投资的高密度技术和卫星信号系统将允许在同一线路上行驶的高速列车之间的间隔距离缩短（“a reduction of the distance between high-speed trains”），从而提高容量和交通流动性。这直接对应选项B中的“shortening high-speed train intervals”。其他选项在原文中未明确提及：A项重建常规线路未涉及；C项在城市中心建设更多车站，原文只提到建设地下铁路连接以分离线路；D项提升高速列车安全性未在改进措施中讨论。
