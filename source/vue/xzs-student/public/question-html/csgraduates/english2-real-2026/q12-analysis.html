<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong> 原文在空格12前描述了老板批评销售报告和朋友取消聚会两个具体情境，这些情境是作为论述“个人化”思维的例子出现的。空格12位于“In both <strong>12</strong> — and others that we all experience”中，其中“both”指代前文两个情境，因此空格应填入指代这些情境的词。选项D“examples”（例子）准确呼应了上下文，表示“在这两个例子中”。其他选项中，A“quotations”指引用的话语，B“experiments”指科学实验，C“questions”指问题，均与语境中描述的经历或情境不符。
