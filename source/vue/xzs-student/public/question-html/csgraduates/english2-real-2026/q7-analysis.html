<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 原文中写道：“Psychologists have a ______ for this way of thinking: personalisation.” 这句话表明心理学家为这种思维方式（即个人化）提供了一个特定的名称。选项B“term”意为“术语”，准确表达了“personalisation”作为心理学专有名词的概念。其他选项中，“method”指方法，“design”指设计，“goal”指目标，均与语境不符。因此，选择B最符合文意。
