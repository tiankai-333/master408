<strong>正确答案：<span class="correct-answer-text">ABD</span></strong><br/><p><strong>【解析】</strong><br/>《关于建国以来党的若干历史问题的决议》在科学评价毛泽东和毛泽东思想的历史地位时，明确将毛泽东思想活的灵魂概括为三个方面：<strong>实事求是、群众路线、独立自主</strong>。</p><ul><li><strong>实事求是</strong>是毛泽东思想的精髓，体现了马克思主义的世界观和方法论；</li><li><strong>群众路线</strong>是党的根本工作路线，强调一切为了群众、一切依靠群众；</li><li><strong>独立自主</strong>是中国共产党领导革命和建设的根本立足点，主张走自己的路。</li></ul><p>选项C“武装斗争”是毛泽东思想中关于中国革命道路的重要内容，但并非“活的灵魂”的组成部分，故不选。</p><p>因此，本题正确答案为<strong>ABD</strong>。</p>
