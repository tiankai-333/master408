<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong><br/>题目所列的诗文名句均体现了将国家、社会、整体利益置于个人私利之上的价值取向：</p><ul><li>“夙夜在公”“以公灭私”强调为公奉献；</li><li>“国而忘家，公而忘私”凸显牺牲个人利益以顾全国家；</li><li>“先天下之忧而忧，后天下之乐而乐”体现心怀天下的责任担当；</li><li>“苟利国家生死以”直接表达为国家利益不惜牺牲生命的奉献精神。<br/>这些表述共同指向<strong>重视整体利益、强调责任奉献</strong>的传统美德，故选项C正确。<br/>A项强调实践行动，B项侧重仁爱和谐，D项关注人伦道德，均与题干中“公而忘私”“为国奉献”的核心主旨不符。</li></ul>
