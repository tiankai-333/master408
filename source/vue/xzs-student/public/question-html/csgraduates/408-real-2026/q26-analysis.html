<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>资源 S 是一个计数信号量，初始值为 5，表示最多允许 5 个进程同时访问资源。<br/>当信号量值 S 为负数时，其绝对值表示阻塞的进程数。当前 S = -2，因此阻塞进程数 n = 2。<br/>同时，当 S &lt; 0 时，所有初始资源均被占用，即有 5 个进程正在访问资源（处于临界区）。<br/>m 表示执行到访问资源的进程个数，在此情境下理解为正在访问资源的进程数，故 m = 5。<br/>因此，m 和 n 的值分别为 5 和 2。
