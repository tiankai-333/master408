<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p><a href="/operating_system/io_device/devices/#io-%e8%bd%af%e4%bb%b6%e5%b1%82%e6%ac%a1">I/O 软件</a> 一般从上到下分为四个层次：用户层、与设备无关的软件层、设备驱动程序以及中断处理程序。与设备无关的软件层也就是系统调用的处理程序。</p><p>当用户使用设备时，首先在用户程序中发起一次系统调用，操作系统的内核接到该调用请求后请求调用处理程序进行处理，再转到相应的设备驱动程序，当设备准备好或所需数据到达后设备硬件发出中断，将数据按上述调用顺序逆向回传到用户程序中。</p>
