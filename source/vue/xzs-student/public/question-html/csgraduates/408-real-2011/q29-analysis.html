<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>在具有对换功能的操作系统中，通常把外存分为文件区和对换区。前者用于存放文件，后者用于存放从内存换出的进程。<a href="/operating_system/memory/management/#%e6%8a%96%e5%8a%a8">抖动</a> 现象是指刚刚被换出的页很快又要被访问，为此又要换出其他页，而该页又很快被访问，如此频繁地置换页面，以致大部分时间都花在页面置换上，引起系统
性能下降。撤销部分进程可以减少所要用到的页面数，防止抖动。对换区大小和进程优先级都与抖动无关。
