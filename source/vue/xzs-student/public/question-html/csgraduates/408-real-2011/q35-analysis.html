<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>在 <a href="/computer_network/datalink/flow_control/#%e9%80%89%e6%8b%a9%e6%80%a7%e9%87%8d%e4%bc%a0">选择性重传</a> 中，接收方逐个确认正确接收的分组，不管接收到的分组是否有序，只要正确接收就发送选择 ACK 分组进行确认。因此选择重传协议中的 ACK 分组不再具有累积确认的作用，要特别注意其与 GBN 协议的区别。本题中只收到 1 号帧的确认，0、2 号帧超时，由于对于1 号帧的确认不具累积确认的作用，因此发送方认为接收方没有收到 0、2 号帧，于是重传这两帧。因为 3 号帧计时器并无超时，所以暂时不用重传 3 号帧。
