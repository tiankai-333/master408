<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>在 <a href="/operating_system/io_device/management/#%e5%8d%95%e7%bc%93%e5%86%b2">单缓冲区</a> 中，当上一个磁盘块从缓冲区读入用户区完成时，下一磁盘块才能开始读入，也就是当最后一块磁盘块读入用户区完毕时所用时间为 150×10=1500μs，加上处理最后一个磁盘块的时间 50μs，得 1550μs。在 <a href="/operating_system/io_device/management/#%e5%8f%8c%e7%bc%93%e5%86%b2">双缓冲</a> 中，不存在等待磁盘块从缓冲区读入用户区的问题，10 个磁盘块可以连续从外存读入主存缓冲区，加上将最后一个磁盘块从缓冲区送到用户区的传输时间 50μs 以及处理时间 50μs，也就是 100×10+50+50=1100μs。
