<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>本题考查<a href="/computer_network/transport/tcp/#%e4%b8%89%e6%ac%a1%e6%8f%a1%e6%89%8b">三次握手</a>，在确认报文段中，同步位 SYN 和确认位 ACK 必须都是 1；返回的确认号 seq 是甲发送的初始序号 seq=11220 加 1，即 ack= 11221；同时乙也要选择并消耗一个初始序号 seq，seq 值由乙的TCP 进程任意给出，它与确认号、请求报文段的序号没有任何关系。
