<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>缺页处理和时钟中断都属于中断，在 <a href="/operating_system/concepts/environment/#%e5%86%85%e6%a0%b8%e6%a8%a1%e5%bc%8f">内核态</a> 执行；进程调度是操作系统内核进程，无须用户干预，在核心态执行；命令解释程序属于命令接口，是四个选项中唯一能面对用户的，它在 <a href="/operating_system/concepts/environment/#%e7%94%a8%e6%88%b7%e6%a8%a1%e5%bc%8f">用户态</a> 执行。
