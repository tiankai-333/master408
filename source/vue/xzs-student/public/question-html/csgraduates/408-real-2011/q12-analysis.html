<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/constitution_principle/overview/performance/#mips">MIPS</a> 是每秒执行多少百万条指令，适用千衡量标量机的性能。<a href="/constitution_principle/overview/performance/#cpi">CPI</a> 是平均每条指令的时钟周期数。<a href="/constitution_principle/overview/performance/#ipc">IPC</a> 是 CPI 的倒数，即每个时钟周期执行的指令数。<a href="/constitution_principle/overview/performance/#flops">MFLOPS</a> 是每秒执行多少百万条浮点数运算，用来描述浮点数运算速度，适用于衡量向量机的性能。
