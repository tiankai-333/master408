<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>第一个顶点和最后一个顶点相同的路径称为回路；序列中顶点不重复出现的路径称为 <a href="/data_structure/graph/defs/#%e5%9b%be%e7%9a%84%e8%b7%af%e5%be%84">简单路径</a>；回路显然不是简单路径，故 I 错误；稀疏图是边比较少的情况，此时用邻接矩阵的空间复杂度为
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:1.0641em;vertical-align:-.25em"></span><span class="mord mathnormal" style="margin-right:.02778em">O</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:.8141em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span>
，必将浪费大量的空间，而邻接表的空间复杂度为
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:1em;vertical-align:-.25em"></span><span class="mord mathnormal" style="margin-right:.02778em">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:.2222em"></span><span class="mbin">+</span><span class="mspace" style="margin-right:.2222em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-.25em"></span><span class="mord mathnormal">e</span><span class="mclose">)</span></span></span></span>
，应该选用邻接表，故 II 错误。存在回路的有向图不存在拓扑序列，若 <a href="/data_structure/graph/operation/#%e6%8b%93%e6%89%91%e6%8e%92%e5%ba%8f">拓扑排序</a> 输出结束后所余下的顶点都有前驱，则说明只得到了部分顶点的拓扑有序序列，图中存在回路，故 III 正确。
