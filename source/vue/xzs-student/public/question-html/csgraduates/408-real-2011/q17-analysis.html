<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>本题考察 <a href="/constitution_principle/cpu/structure/#%e6%a0%87%e5%bf%97%e5%af%84%e5%ad%98%e5%99%a8">标志寄存器</a>，假设两个无符号整数 A 和 B，bgt 指令会将 A 和 B 进行比较，也就是将 A 和 B 相减。如果 A &gt; B，则 A-B 肯定无进位／借位，也不为 0（为 0 时表示两数相同），故而 CF 和 ZF 均为 0，选 C。其余选项中用到了符号标志 SF 和溢出标志 OF, 显然应当排除。
