<strong>正确答案：<span class="correct-answer-text">ABC</span></strong><br/><p><strong>【解析】</strong><br/>法律权威的确立依赖于多个因素。</p><ul><li><strong>A项正确</strong>：法律本身的科学程度（如内容是否符合社会规律、是否公正合理）直接影响其被认同和遵守的基础，科学的法律更易获得权威。</li><li><strong>B项正确</strong>：法律在国家和社会治理体系中的地位和作用至关重要。若法律在实践中被真正作为最高准则，其权威性才能彰显。</li><li><strong>C项正确</strong>：法律实施程度是权威的关键体现。即使法律本身完善，若在实践中得不到有效执行，权威也无法树立。</li><li><strong>D项错误</strong>：国际社会的认可和尊崇可能提升法律的国际影响力，但法律权威主要取决于本国社会的内在认同和实践，而非国际评价。</li></ul><p>因此，本题答案为 <strong>ABC</strong>。</p>
