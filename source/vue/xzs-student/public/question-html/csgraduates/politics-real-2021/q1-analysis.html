<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>马克思和恩格斯于1844年8月在巴黎会面后，开始共同创立科学社会主义理论。1845年至1846年间，两人合写了《德意志意识形态》，首次系统阐述了历史唯物主义的基本观点，如社会存在决定社会意识、生产力与生产关系的矛盾运动等，标志着唯物史观的初步形成。<br/>选项B《神圣家族》写于1844年，主要是批判青年黑格尔派，尚未完整阐述历史唯物主义；选项C《哲学的贫困》是马克思1847年批判蒲鲁东的著作，进一步发挥了历史唯物主义思想；选项D《共产党宣言》发表于1848年，是科学社会主义的纲领性文件，但并非首次系统阐述历史唯物主义基本观点的著作。因此，本题正确答案为A。
