<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>新发展格局是党中央根据国内外环境变化作出的重大战略部署，其核心内涵是 <strong>“以国内大循环为主体、国内国际双循环相互促进”</strong>。这一表述明确写入《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》等重要文件中，旨在充分发挥我国超大规模市场优势，通过畅通国内经济循环增强发展韧性，同时继续深化对外开放，实现国内国际双循环的良性互动。其他选项虽然涉及新发展格局的相关方面，但并非对其核心内容的准确概括。因此，正确答案为 <strong>A</strong>。
