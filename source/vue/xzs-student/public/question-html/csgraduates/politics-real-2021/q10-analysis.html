<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>中国人民抗日战争胜利的关键在于中国共产党的中流砥砥柱作用。中国共产党在抗战中提出并坚持全面抗战路线，建立抗日民族统一战线，领导敌后战场，开展游击战争，并在战略指导、政治动员、组织建设等方面发挥了决定性作用。其他选项虽然也是抗战胜利的重要因素，但并非最关键的核心：A项世界反法西斯力量的支持是重要外部条件；B项战争的正义性是道义基础；C项全民族抗战是重要保障，但全民族抗战的形成和发展离不开中国共产党的倡导、推动和领导。因此，根据历史事实和主流史观，正确答案为D。
