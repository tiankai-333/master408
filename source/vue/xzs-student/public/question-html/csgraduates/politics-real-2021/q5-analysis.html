<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong><br/>毛泽东思想是马克思主义基本原理同中国革命和建设具体实践相结合的产物，其理论内容广泛涵盖新民主主义革命、社会主义革命和社会主义建设等多个方面。虽然涉及中国社会性质、阶级状况、国家前途命运等问题，但整个思想体系的建构始终紧紧围绕“中国革命和建设”这一主题展开。具体来说，毛泽东思想系统回答了在中国如何进行革命、如何走向社会主义、如何开展社会主义建设等根本问题。因此，选项 <strong>B. 中国革命和建设</strong> 最准确、最完整地概括了毛泽东思想科学体系的主题。
