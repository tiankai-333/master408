<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>我国对资本主义工商业的社会主义改造，采取了“和平赎买”的政策。这一政策是在无产阶级掌握国家政权和国民经济命脉的条件下，通过国家资本主义形式，有偿地将资本主义私有制逐步改造为社会主义公有制。具体方式包括支付定息、安排资本家工作等，既实现了生产资料所有制的变革，又减少了社会震荡，得到了民族资产阶级中多数人的配合。题目中邓小平提到的“资本家阶级中的进步分子和大多数人在接受改造方面也起了有益的配合作用”，正体现了和平赎买的特点。其他选项中，B项“调整巩固”是国民经济恢复时期的措施，C项“互助合作”是对农业手工业改造的政策，D项“剥夺没收”是对官僚资本的政策，均不符合题意。
