<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>在 <a href="/computer_network/datalink/flow_control/#%e5%9b%9e%e9%80%80-n-%e5%b8%a7">回退 N 帧</a> 中，当接收方检测到某个帧出错后，则简单地丢弃该帧及其后所有的后续帧，发送方超时后需重传该数据帧及其后续的所有帧。这里应注意，连续 ARQ 协议中，接收方一般采用累积确认的方式，即接收方对按序到达的最后一个分组发送确认，因此本题中收到 3 的确认帧就表示编号为 0,1,2,3 的帧已接收，而此时发送方未收到 1 号帧的确认只能代表确认帧在返回的过程中丢失了，而不代表 1 号帧未到达接收方。因此需要重传的帧为编号是 4,5,6，
7 的帧。
