<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>相对于 <a href="/constitution_principle/instruction/concepts/#cisc">CISC</a>，<a href="/constitution_principle/instruction/concepts/#risc">RISC</a> 的特点是指令条数少；指令长度固定，指令格式和寻址种类少：只有取数/存数指令访问存储器，其余指令的操作均在寄存器之间进行；CPU 中通用寄存器多；大部分指令在一个或者小于一个机器周期内完成；以硬布线逻辑为主，不用或者少用微程序控制。选项 B、C、D 都是 RISC 的特点，选项 A 是错误的，因为 RISC 的速度快，所以普遍采用硬布线控制器，而非微程序控制器。
