<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/constitution_principle/cpu/controller/#%e5%be%ae%e7%a8%8b%e5%ba%8f%e6%8e%a7%e5%88%b6%e5%99%a8">微程序控制器</a> 采用了“存储程序”的原理，每条机器指令对应一个微程序，因此修改和扩充容易，灵活性好，但每条指令的执行都要访问控制存储器，所以速度慢。<a href="/constitution_principle/cpu/controller/#%e7%a1%ac%e5%b8%83%e7%ba%bf%e6%8e%a7%e5%88%b6%e5%99%a8">硬布线控制器</a> 采用专门的逻辑电路实现，其速度主要取决于逻辑电路的延迟，因此速度快，但修改和扩展困难，灵活性差。
