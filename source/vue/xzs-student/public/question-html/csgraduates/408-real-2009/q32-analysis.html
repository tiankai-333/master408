<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/>设备管理具有设备独立性的特点，操作系统以系统调用方式来请求某类设备时，使用的是 <a href="/operating_system/io_device/management/#%e9%80%bb%e8%be%91%e8%ae%be%e5%a4%87%e5%90%8d">逻辑设备名</a>。而在程序实际执行时，将逻辑设备名 转换为对应的 <a href="/operating_system/io_device/management/#%e7%89%a9%e7%90%86%e8%ae%be%e5%a4%87%e5%90%8d">物理设备名</a>。
