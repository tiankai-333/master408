<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><a href="/constitution_principle/instruction/format/#%e7%9b%b8%e5%af%b9%e5%af%bb%e5%9d%80">相对寻址</a> EA = (PC)+A，首先要求的是取指令后 PC 的值。转移指令由两个字节组成，每取一个字节 PC 值自动加 1，因此取指令后 PC 值为 2000H+2H = 2002H, 故 EA = (PC)+A = 2002H+06H = 2008H。</p><p>【易错点】本题易误选 A 或 B。选项 A 没有考虑 PC 值的自动更新，选项 B 虽然考虑了 PC 值要自动更新，但没有注意到该转移指令是一条两字节指令，PC 值仅仅“+1”而不是“+2”。</p>
