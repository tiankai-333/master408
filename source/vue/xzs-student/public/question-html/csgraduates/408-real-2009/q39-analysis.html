<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>在发生超时后，慢开始门限 ssthresh 变为 16KB/2 = 8KB，拥塞窗口变为 1KB。在接下来的 3 个 RTT 内，执行 <a href="/computer_network/transport/tcp/#%e6%85%a2%e5%bc%80%e5%a7%8b">慢开始</a> 算法，拥塞窗口大小依次为 2KB、4KB、8KB，由于慢开始门限 ssthresh 为 8KB，因此之后转而执行 <a href="/computer_network/transport/tcp/#%e6%8b%a5%e5%a1%9e%e9%81%bf%e5%85%8d">拥塞避免</a> 算法，即拥塞窗口开始“加法增大”。因此第 4 个 RTT 结束后，拥塞窗口的大小为 9KB。
