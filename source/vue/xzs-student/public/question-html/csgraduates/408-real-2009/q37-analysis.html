<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>本题考查 <a href="/computer_network/datalink/mac/#%e9%99%90%e5%88%b6%e6%9d%a1%e4%bb%b6">CSMA/CD 的限制条件</a>。若最短帧长减少，而数据传输速率不变，则需要使冲突域的最大距离变短来实现碰撞窗口的减少。碰撞窗口是指网络中收发结点间的往返时延，因此假设需要减少的最小距离为 S, 则可以得到如下公式（注意单位的转换）：</p><p>减少的往返时延=减少的发送时延，即

="height:.8141em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">9</span></span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span>
。即，由于帧长减少而缩短的发送时延，应等于由于距离减少而缩短的传播时延的 2 倍。</p><p>可得 s=80, 即最远的两个站点之间的距离最少需要减少 80m。</p><p>【注意】CSMA/CD 的碰撞窗口 = 2 倍传播时延，报文发送时间 » 碰撞窗口。</p>
