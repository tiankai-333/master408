<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>延安精神是中国共产党的宝贵精神财富，其核心内容包括坚定正确的政治方向、解放思想实事求是的思想路线、全心全意为人民服务的根本宗旨、自力更生艰苦奋斗的创业精神。其中，<strong>全心全意为人民服务</strong>是党的根本宗旨，也是延安精神的本质体现。题干强调“延安精神所体现的党的宗旨”，直接对应党的宗旨，故正确答案为 A。其他选项 B、C、D 均为延安精神的重要组成部分，但并非直接指向“党的宗旨”这一特定角度。
