<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong> 本题考察对共同富裕分配制度中三次分配的理解。</p><ul><li><strong>初次分配</strong>主要由市场机制决定，强调按劳分配和生产要素按贡献参与分配，选项A（提高劳动报酬比重）和D（健全生产要素按贡献决定报酬）属于初次分配范畴。</li><li><strong>再分配</strong>由政府主导，通过税收、社保、转移支付等调节收入分配，选项B（加大税收、社保等调节力度）属于再分配范畴。</li><li><strong>第三次分配</strong>则依靠社会力量，通过公益慈善、志愿服务等方式进行资源流动，选项C（引导支持企业、社会组织和个人参与公益慈善事业）直接对应第三次分配的作用。</li></ul><p>题干明确要求“发挥第三次分配的作用”，因此C为正确答案。</p>
