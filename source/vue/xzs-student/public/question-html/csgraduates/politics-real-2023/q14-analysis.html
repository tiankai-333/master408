<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong><br/>党的二十大报告明确指出，坚持依法治国首先要坚持依宪治国。这是因为宪法是国家的根本法，是治国安邦的总章程，具有最高的法律地位、法律权威和法律效力。依法治国必须首先维护宪法权威，确保宪法实施，所有法律法规和各项政策都不得与宪法相抵触。选项B“坚持依法行政”是法治政府建设的重要内容，选项C“坚持依法执政”是党治国理政的基本方式，选项D“坚持公正司法”是法治建设的关键环节，但它们均不属于“首要”地位。因此，本题正确答案为A。
