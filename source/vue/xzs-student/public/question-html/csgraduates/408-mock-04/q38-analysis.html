<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 在主机 A 向主机 B 发送 IP 数据报的过程中，由于主机 B 位于不同的网络（通过 WAN 连接），主机 A 需要先将数据报发送到默认网关（即交换机 R1，在此场景中充当路由器或网关角色）。因此，在以太网 1 上，主机 A 发出的以太网帧的目的 MAC 地址是下一跳设备 R1 的 MAC 地址，以便帧能正确传递到 R1。而 IP 数据报头的目的 IP 地址始终是最终目标主机 B 的 IP 地址，不会在传输过程中改变。所以，以太网帧中的目的地址是 R1 的 MAC 地址，IP 报头中的目的地址是 B 的 IP 地址，对应选项 C。
