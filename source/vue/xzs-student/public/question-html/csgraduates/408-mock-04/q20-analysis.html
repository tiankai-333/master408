<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong>
在手术过程中，医生伸手相当于通信中的发送方发出请求信号，护士递上手术刀相当于接收方收到请求后发送应答信号，而医生握紧后护士才松手相当于发送方确认收到应答后，接收方等待确认信号才完成操作。这一系列动作体现了完整的握手协议，需要双方相互确认，确保可靠传递。异步通信的全互锁方式正是通过请求、应答和确认三个步骤实现可靠通信，而半互锁方式缺少接收方等待确认的环节，不互锁方式则没有等待过程，同步通信则依赖统一时钟而不需要握手。因此，该场景对应于异步通信的全互锁方式。
