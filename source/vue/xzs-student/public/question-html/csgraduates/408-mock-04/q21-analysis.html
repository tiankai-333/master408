<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong><br/>中断源可以分为外部中断和内部中断（异常）。外部事件如 I/O 设备请求属于典型的外部中断，能够提出中断请求。虚拟存储器失效（如页面错误）是内部异常，会触发缺页中断，由 CPU 执行中断服务程序处理。浮点运算上溢属于算术异常，通常作为中断源，CPU 可响应并处理。Cache 缺失一般由硬件透明处理，不直接向 CPU 提出中断；浮点运算下溢虽然也是浮点异常，但在许多系统中常被屏蔽或默认处理为零，一般不视为直接中断源。因此，可以提出中断的是 I、III 和 V。
