<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong><br/>I 错误：在客户/服务器模型中，客户端需要知道服务器的地址以发起请求，但服务器不需要事先知道客户端的地址；服务器在连接建立后从请求中获取客户端地址。<br/>II 错误：HTTP 基于客户/服务器模型，但默认端口号仅服务器端为 80，客户端使用临时分配的随机端口，并非固定为 80。<br/>III 正确：浏览器作为客户端，其显示的内容确实来自服务器响应的数据。<br/>IV 错误：客户/服务器模型中，服务器在某些协议下可以主动发送数据，例如 FTP 主动模式或 WebSocket 推送，并非绝对不能主动发送。<br/>因此，错误的陈述是 I、II 和 IV，对应选项 C。
