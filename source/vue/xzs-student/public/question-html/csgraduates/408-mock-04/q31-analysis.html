<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong> 位示图使用 8 个字（每个字 32 位）管理内存，总位数为 8×32=256 位，对应 256 个内存块，块号从 0 到 255。字号和位号均从 0 开始计数。计算块号 100 对应的位示图位置时，采用公式：字号 = 块号 ÷ 每字位数，位号 = 块号 % 每字位数。每字位数为 32，因此 100 ÷ 32 = 3（商），余数 4。即字号为 3，位号为 4。</p><p>验证：字号 3 对应的起始块号为 3×32=96，结束块号为 127。块号 100 在该范围内，位号=100-96=4。故对应位示图位置为字号 3、位号 4，与选项 C 一致。</p>
