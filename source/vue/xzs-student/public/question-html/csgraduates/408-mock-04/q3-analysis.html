<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><strong>【解析】</strong> 深度为 6 的完全二叉树，前 5 层必须是满二叉树，因此第 5 层有 2^(5-1)=16 个结点。第 6 层有 3 个叶子结点，由于第 6 层是最底层，所有结点都是叶子结点，且这 3 个结点对应第 5 层前两个结点的子结点：第 5 层第 1 个结点有左右子结点，第 5 层第 2 个结点有左子结点。因此，第 5 层中只有前两个结点有子结点，其余 14 个结点均无子结点，为叶子结点。叶子结点总数等于第 6 层的 3 个加上第 5 层的 14 个，共 17 个。
