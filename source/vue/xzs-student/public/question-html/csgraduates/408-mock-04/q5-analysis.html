<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><p><strong>【解析】</strong> 考查由遍历序列确定二叉树、森林与二叉树的转换。根据后序序列，A 是二叉树的根结点。根据中序遍历序列，则二叉树的形态一定如下图左所示。对于 A 的左子树，由后序序列可知，因为 B 比 D 后被访问，因此，B 必为 D 的父结点，又由中序序列可知，D 是 B 的右儿子。对于 A 的右子树，同理可确定结点 E、C、F 的关系。此二叉树的形态如下图右所示。</p><div class="img-container" style="height:auto;width:80%"><img alt="" draggable="false" src="question-assets/csgraduates/408-mock-04/4_5_sol-d30dacfa735c56c7.png" style="width:100%;height:auto"/></div><p>再根据二叉树与森林的对应关系。森林中树的棵数即为其对应二叉树（向右上旋转 45° 后）中根结点 A 及其“右兄弟”数。可知此森林中有 3 棵树，根结点分别为 A、C 和 F。</p>
