<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 中断发生后，CPU 会暂停当前执行的用户程序，并切换到内核模式（或特权模式），然后根据中断向量表跳转到对应的中断处理程序。这些中断处理程序，也称为中断服务例程（ISR），是操作系统内核的一部分，负责直接处理硬件中断、异常等事件，管理系统资源和调度。由于中断处理涉及对硬件和核心系统资源的访问，必须由操作系统在特权模式下执行，用户程序无权直接处理中断。因此，进入中断处理的程序始终属于 OS 程序，而非用户程序或其他独立实体。
