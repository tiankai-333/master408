<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong> 我国当前的高水平对外开放主要是指制度型开放。制度型开放的核心是通过对接国际高标准经贸规则，深化国内相关领域制度改革，营造市场化、法治化、国际化一流营商环境，构建与高质量发展和高水平开放相适应的制度体系。这区别于过去以商品和要素流动为主的“要素型开放”或依靠政策优惠驱动的“政策性开放”，而是更注重规则、规制、管理、标准等制度层面的系统性开放，具有更深层次、更宽领域、更全局性的特点。因此，D项最符合题意。A项“全局性开放”描述的是开放的广度，但并非当前阶段“高水平对外开放”的特定内涵；B项“要素型开放”是过往开放阶段的主要特征；C项“政策性开放”亦多见于早期开放模式。
