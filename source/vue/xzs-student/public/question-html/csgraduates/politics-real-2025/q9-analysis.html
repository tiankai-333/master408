<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><strong>【解析】</strong> 题干中引用的“幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶”全面体现了社会建设的成就，而设问强调“新时代加强社会建设重要着力点”。根据新时代党和国家战略部署，社会建设的重点是完善共建共治共享的社会治理制度，其中“建设更高水平的平安中国”是社会治理现代化的重要目标，也是加强社会建设的关键着力点，它直接关系到人民群众的获得感、幸福感、安全感，是当前社会建设的重中之重。其他选项虽是社会建设的重要方面，但并非题干所强调的新时代重要着力点。
