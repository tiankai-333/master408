<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 《论本本主义》（原题为《调查工作》）写于1930年，当时党内存在严重的教条主义倾向，一些人机械照搬马克思主义理论和共产国际指示，脱离中国实际。毛泽东在文中强调“中国革命斗争的胜利要靠中国同志了解中国情况”，正是针对这种教条主义倾向，倡导独立自主地运用马克思主义解决中国实际问题，反对盲目依赖外来指示和书本教条。选项A、C、D分别涉及统一战线、思想建设和军队作风，虽然也是当时的重要问题，但并非毛泽东这一表述的直接针对性。
