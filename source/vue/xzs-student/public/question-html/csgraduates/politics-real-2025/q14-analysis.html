<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 隐私权是指自然人享有的私人生活安宁与不愿为他人知晓的私密空间、私密活动、私密信息依法受到保护，不被他人非法侵扰、知悉、收集、利用和公开的权利。在《民法典》中，隐私权被纳入人格权编，属于人格尊严权的重要组成部分。人格尊严权包括姓名权、肖像权、名誉权、隐私权等具体权利，旨在维护个人的社会评价和人格独立。选项A生命健康权主要涉及身体和健康安全，选项B民主管理权属于政治权利，选项D通信自由权侧重于通信秘密和自由，均与隐私权的法律属性不符。因此，隐私权属于人格尊严权。
