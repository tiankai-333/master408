<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 此题出自毛泽东《中国革命和中国共产党》，文中明确指出，帝国主义侵略中国，一方面破坏了中国自然经济，为中国资本主义的产生创造了客观条件；另一方面，帝国主义勾结中国封建势力，压迫中国资本主义的发展。因此正确选项是B。A项表述错误，因为封建土地所有制并未彻底破坏，反而在一定程度上被保留；C项不符合史实，中国没有形成统一的资本主义经济；D项“完全成为附庸”的说法过于绝对，不符合毛泽东原文中关于中国社会半殖民地半封建性质的论述。
