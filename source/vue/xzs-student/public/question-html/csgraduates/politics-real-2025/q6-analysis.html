<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/><strong>【解析】</strong> 邓小平理论作为中国特色社会主义理论体系的开篇之作，系统回答了建设中国特色社会主义的一系列基本问题。在邓小平理论中，社会主义初级阶段理论明确指出我国正处于并将长期处于社会主义初级阶段，这是我国最大的国情和实际，是建设中国特色社会主义的总依据。其他选项中，社会主义根本任务和发展战略理论、社会主义本质理论分别回答了社会主义的根本任务和本质问题，社会主义社会矛盾学说主要分析社会主义社会的矛盾问题，均不直接构成建设中国特色社会主义的总依据。
