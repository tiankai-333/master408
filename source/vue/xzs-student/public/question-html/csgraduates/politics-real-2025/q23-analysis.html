<strong>正确答案：<span class="correct-answer-text">ABD</span></strong><br/><p><strong>【解析】</strong><br/>本题要求分析民营经济迅速发展的原因。</p><ul><li><strong>A项正确</strong>：民营经济作为非公有制经济的重要组成部分，其快速发展离不开政策制度环境的持续优化，如市场准入放宽、减税降费等，为民营经济提供了有利条件。</li><li><strong>B项正确</strong>：体制机制完善是民营经济发展的保障，例如建立健全产权保护、公平竞争等制度，促进了非公有制经济的壮大。</li><li><strong>C项错误</strong>：在我国，国有经济在国民经济中起主导作用，非公有制经济是社会主义市场经济的重要组成部分，但并不起主导作用。</li><li><strong>D项正确</strong>：民营经济主体数量大幅增长，表明其发展活力不断增强，体现了市场机制的积极效应。</li></ul><p>因此，正确答案为ABD。</p>
