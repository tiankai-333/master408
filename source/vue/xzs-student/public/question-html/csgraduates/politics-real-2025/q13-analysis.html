<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><strong>【解析】</strong> 党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》科学评价了毛泽东同志和毛泽东思想，彻底否定了“文化大革命”，并系统总结了社会主义建设的历史经验。决议明确指出，党的各项工作都必须服从和服务于经济建设这个中心，强调社会主义现代化建设是党和国家工作的重心，为后来确立“以经济建设为中心”的基本路线奠定了重要的思想和理论基础。选项A涉及的是1949年党的七届二中全会的主要内容；选项C是新中国成立初期“一五”计划时期的重点；选项D虽然与思想路线有关，但并非该决议强调的核心内容。
