上均匀分布的随机变量，
而经销商进货数量为区间
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:1em;vertical-align:-.25em"></span><span class="minner"><span class="mopen delimcenter" style="top:0">[</span><span class="mord">10</span><span class="mpunct">,</span><span class="mspace" style="margin-right:.1667em"></span><span class="mord">30</span><span class="mclose delimcenter" style="top:0">]</span></span></span></span></span>

若供大于求则削价处理，每处理
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">1</span></span></span></span>

<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.6444em"></span><span class="mord">100</span></span></span></span>
