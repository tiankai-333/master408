<strong>正确答案：<span class="correct-answer-text">A</span></strong><br/><a href="/constitution_principle/representation/floats/#ieee-%e6%b5%ae%e7%82%b9%e6%95%b0%e8%a1%a8%e7%a4%ba">IEEE754</a> 单精度浮点数的符号位、阶码位、尾数位（省去正数位 1）所占的位数分别是 1、8、23 位。最小正数，数符位取 0，移码的取值范围是 1~254，取 1，得阶码值 1-127=-126（127 为我们规定的偏置值），尾数取全 0，最终推出最小规格化正数为 A 选项。
