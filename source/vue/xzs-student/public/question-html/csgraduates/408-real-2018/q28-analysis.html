<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><a href="/operating_system/process/sync/#%e6%9d%a1%e4%bb%b6%e5%8f%98%e9%87%8f">条件变量</a> 是 <a href="/operating_system/process/sync/#%e7%ae%a1%e7%a8%8b">管程</a> 内部说明和使用的一种特殊变量，其作用类似于信号量机制中的信号量，都是用于实现进程同步的。需要注意的是，在同一时刻，管程中只能有一个进程在执行。如果进程 A 执行了 x.wait() 操作，那么该进程会阻塞，并挂到条件变量 x 对应的阻塞队列上。这样，管程的使用权被释放，就可以有另一个进程进入管程。如果进程 B 执行了 x.signal() 操作，那么会唤醒 x 对应的阻塞队列队头进程。在 Pascal 语言的管程中，规定只有一个进程要离开管程时才能调用 signal() 操作。
