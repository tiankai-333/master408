<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/>总线数据传输率 ＝ 总线工作频率 x 总线带宽（＝总线宽度 / 8）, 所以 Ⅰ 和 Ⅱ 会影响总线数据传输率。采用<a href="/constitution_principle/bus/bus/#%e7%aa%81%e5%8f%91%e6%80%bb%e7%ba%bf%e4%bc%a0%e8%be%93%e4%ba%8b%e5%8a%a1">突发总线传输事务</a>（也称猝发传输），在一个总线周期内传输存储地址连续的多个数据字，从而提高了传输效率。采用地址 I 数据线复用只是减少了线的数量，节省了成本，并不能提高传输率。
