<strong>正确答案：<span class="correct-answer-text">C</span></strong><br/>利用 <a href="/constitution_principle/representation/integer/#%e8%a1%a5%e7%a0%81%e7%9a%84%e5%91%bd%e5%90%8d">补码转换成原码的规则</a>：负数符号位不变数值位取反加 1；正数补码等于原码。两个机器数对应的原码是 [x]原 = 80000021H，对应的数值是 -33，[y]原=[y]补=00000041H=65。排除 A、D 选项。x-y 直接利用补码减法准则，[x]补-[y]补 =[x]补+[-y]补，-y 的补码是连同符号位取反加 1，最终减法变成加法，得出结果为 FFFFFF9EH。
