<strong>正确答案：<span class="correct-answer-text">B</span></strong><br/><p>本题考察 <a href="/data_structure/array/application/#%e5%90%8e%e5%ba%8f%e8%a1%a8%e8%be%be%e5%bc%8f%e6%b1%82%e5%80%bc">后序表达式求值</a>，调用三次 <code>F()</code> 栈中内容如下表所示：</p><table class="table td-initial"><thead><tr><th>调用次数</th><th>S1 初始状态（栈底 → 栈顶）</th><th>S2 初始状态（栈底 → 栈顶）</th><th>弹出操作数 a, b</th><th>弹出运算符 op</th><th>执行运算 b op a</th><th>运算结果入栈后 S1 状态（栈底 → 栈顶）</th></tr></thead><tbody><tr><td>第一次</td><td>5, 8, 3, 2</td><td>×, −, +</td><td>a=2, b=3</td><td>+</td><td>3 + 2 = 5</td><td>5, 8, 5</td></tr><tr><td>第二次</td><td>5, 8, 5</td><td>×, −</td><td>a=5, b=8</td><td>−</td><td>8 − 5 = 3</td><td>5, 3</td></tr><tr><td>第三次</td><td>5, 3</td><td>×</td><td>a=3, b=5</td><td>×</td><td>5 × 3 = 15</td><td>15</td></tr></tbody></table><p>调用三次 <code>F()</code> 后，S1 的栈顶是 <strong>15</strong>，因此选择 <strong>B</strong>。</p>
