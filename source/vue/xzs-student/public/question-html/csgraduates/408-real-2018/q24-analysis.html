<strong>正确答案：<span class="correct-answer-text">D</span></strong><br/><p>本题考察 <a href="/operating_system/process/scheduling/#%e9%9d%9e%e6%8a%a2%e5%8d%a0%e5%bc%8f%e4%bc%98%e5%85%88%e7%ba%a7%e8%b0%83%e5%ba%a6">非抢占式优先级调度</a>，由优先权可知，进程的执行顺序为 P2 → P3 → P1。</p><p>P2 的周转时间：1 +15+24= 40μs</p><p>P3 的周转时间：18+1+24+1 +36= 80μs</p><p>P1 的周转时间：30+1+24 +1 +36+1 +12=105μs</p><p>平均周转时间： (40+80+105) /3= 225/3= 75μs, 故选 D。</p>
